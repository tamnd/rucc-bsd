# The rules for which trees are pinned (plan 04.5). `rb sets --write` reads what FreeBSD and
# NetBSD publish and expands these rules into pins.toml. Edit this file, never pins.toml.

[freebsd.current]
branches = ["main", "stable/15", "stable/14"]
# A branch here has no reference. rb sets pins it at its head with reference = "no-ref" and the
# reason, and does not grade it (04.6). stable/14 left the graded branches by the decision on #1.
no_ref = { "stable/14" = "no G-good commit with amd64-gcc15; GCC 14 candidate 2192d42bbcde (#85)" }
releng_in_progress = true           # releng/X.Y while ALPHA, BETA or RC
nightly = true

[freebsd.releases]
supported_only = true               # from the security page's table
# The 04.5 table pins one release per major: 15.1 and 14.5. The security page also lists 14.4
# until 31 December 2026 (04.7). This key keeps the newest release of each major only.
latest_per_major = true
weekly = true

[netbsd.current]
branches = ["trunk", "netbsd-11", "netbsd-10"]
nightly = true

[netbsd.releases]
supported_only = true               # from www.netbsd.org/releases/
weekly = true

[pin_policy]
head = "last-g-good"                # see 04.6
