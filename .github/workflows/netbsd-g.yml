# G for NetBSD trunk on amd64: the pinned tree built by its own in-tree GCC with build.sh, made
# into the project's live image by rb image, booted under QEMU with KVM by rb boot, and tested with
# the system's own ATF suite. Nothing here runs rucc. The build scripts are in scripts/netbsd and
# the pin in conf/netbsd. rb is built from this commit, and rb-rc in the image runs the suites.
#
# The jobs and what they hand on:
#   rb       cargo builds rb. The binary is an artifact for the image, boot, atf and report jobs.
#   tools    build.sh tools. TOOLDIR and the tools' object directory go to the cache, keyed by the
#            pin file, so the other jobs and later runs restore them instead of building them.
#   world    distribution, the GENERIC kernel and the sets. The sets, the kernel and the two parts
#            of DESTDIR that the image needs (METALOG and etc/mtree) go on as an artifact.
#   image    rb image: build.sh's live-image target from those sets, with rb-rc, the smoke suite
#            and the serial console added. The image is an artifact.
#   boot     two boots with rb boot: BIOS with the boot suite, and UEFI with the boot and smoke
#            suites, as the amd64 row of rows.toml says.
#   atf      the ATF suite in three shards by top-level directory, each in its own UEFI boot, so
#            that each fits in a job. The split follows the time each directory took in the
#            published run of 4 October 2026: net about 1.6 hours, lib about 0.9, the rest about 1.
#   report   the phase table and the ATF counts against the published run, the results files in
#            the format of results/README.md, and a one-run baseline from rb baseline --from, as
#            an artifact.
#
# Every job works under /mnt, the runner's larger disk, at the same absolute paths, because a
# TOOLDIR records them.

name: netbsd-g

# The paths leave out the files that only the R builds use (netbsd-r.yml), so that a change to R
# does not build G again.
on:
  pull_request:
    paths:
      - scripts/netbsd/**
      - conf/netbsd/**
      - .github/workflows/netbsd-g.yml
      - "!scripts/netbsd/overlay.sh"
      - "!scripts/netbsd/r-report.sh"
      - "!conf/netbsd/toolchain/**"
  workflow_dispatch:
    inputs:
      atf:
        description: Run the ATF shards after the smoke boot
        type: boolean
        default: true

# A manual run is its own group, so that a push to the branch does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NB_ROOT: /mnt/nb

jobs:
  rb:
    name: cargo build rb
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo build
        run: cargo build --release --locked -p rb --bin rb
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rb-linux-x86_64
          path: target/release/rb
          retention-days: 7

  tools:
    name: build.sh tools
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
          df -h / /mnt
      - uses: actions/cache@v6.1.0
        id: tools
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles('conf/netbsd/trunk.pin', 'scripts/netbsd/common.sh') }}
          lookup-only: true
      - name: host packages
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends zlib1g-dev
      - name: fetch the pinned tree
        if: steps.tools.outputs.cache-hit != 'true'
        run: scripts/netbsd/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: build.sh tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: scripts/netbsd/phase.sh tools tools
      - name: summary
        if: always()
        run: |
          {
            echo "### build.sh tools"
            if [ "$HIT" = true ]; then echo "Restored from the cache, key \`$TOOLS_KEY\`."; fi
            if [ -f "$NB_ROOT/logs/phases.tsv" ]; then scripts/netbsd/summary.sh "$NB_ROOT/logs/phases.tsv"; fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          HIT: ${{ steps.tools.outputs.cache-hit }}
          TOOLS_KEY: netbsd-tools-amd64-${{ hashFiles('conf/netbsd/trunk.pin', 'scripts/netbsd/common.sh') }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-logs-tools
          path: /mnt/nb/logs
          if-no-files-found: ignore
          retention-days: 14

  world:
    name: distribution, kernel and sets
    needs: tools
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
          df -h / /mnt
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles('conf/netbsd/trunk.pin', 'scripts/netbsd/common.sh') }}
          fail-on-cache-miss: true
      - name: host packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends zlib1g-dev
      - name: fetch the pinned tree
        run: scripts/netbsd/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: build.sh distribution
        run: scripts/netbsd/phase.sh distribution -u distribution
      - name: build.sh kernel=GENERIC
        run: |
          scripts/netbsd/phase.sh kernel -u kernel=GENERIC
          scripts/netbsd/phase.sh releasekernel -u releasekernel=GENERIC
      - name: build.sh sets
        run: |
          scripts/netbsd/phase.sh sets -u sets
          scripts/netbsd/phase.sh kernset -- scripts/netbsd/kernset.sh GENERIC
      - name: hand the sets on
        run: |
          tar -C "$NB_ROOT/destdir" -cf "$NB_ROOT/release/destdir-meta.tar" METALOG etc/mtree
          ls -l "$NB_ROOT"/release/amd64/binary/sets "$NB_ROOT"/release/amd64/binary/kernel
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: netbsd-amd64-sets
          path: |
            /mnt/nb/release/amd64/binary
            /mnt/nb/release/destdir-meta.tar
          compression-level: 0
          retention-days: 7
      - name: summary
        if: always()
        run: |
          {
            echo "### distribution, kernel and sets"
            scripts/netbsd/summary.sh "$NB_ROOT/logs/phases.tsv"
            echo
            echo "Sets, in KiB:"
            echo
            echo '```'
            du -k "$NB_ROOT"/release/amd64/binary/sets/* "$NB_ROOT"/release/amd64/binary/kernel/* 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: compress the logs
        if: always()
        run: xz -T0 "$NB_ROOT"/logs/*.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-logs-world
          path: /mnt/nb/logs
          retention-days: 14

  image:
    name: rb image
    needs: [rb, world]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles('conf/netbsd/trunk.pin', 'scripts/netbsd/common.sh') }}
          fail-on-cache-miss: true
      - name: fetch the pinned tree
        run: scripts/netbsd/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-amd64-sets
          path: /mnt/nb/release
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: put the sets and DESTDIR's metadata in place
        run: |
          mkdir -p "$NB_ROOT/release/amd64" "$NB_ROOT/destdir"
          if [ -d "$NB_ROOT/release/binary" ]; then mv "$NB_ROOT/release/binary" "$NB_ROOT/release/amd64/"; fi
          tar -C "$NB_ROOT/destdir" -xf "$NB_ROOT/release/destdir-meta.tar"
          rm "$NB_ROOT/release/destdir-meta.tar"
          find "$NB_ROOT/release" -type f | sort
          # The live-image target runs make in etc and in distrib/amd64/liveimage. Their object
          # directories must exist, or make writes into the tree. rb image makes the second.
          "$NB_ROOT/tools/bin/nbmake-amd64" -C "$NB_ROOT/src/etc" obj
      - name: rb image
        run: |
          chmod +x "$RUNNER_TEMP/rb/rb"
          scripts/netbsd/phase.sh image -- "$RUNNER_TEMP/rb/rb" image --build "$NB_ROOT/tools" \
            --out "$NB_ROOT/netbsd-amd64-serial.img" --work "$NB_ROOT/image-work"
          cp "$NB_ROOT"/image-work/logs/* "$NB_ROOT/logs/" 2>/dev/null || true
          gzip -1 "$NB_ROOT/netbsd-amd64-serial.img"
          ls -l "$NB_ROOT/netbsd-amd64-serial.img.gz"
          sha256sum "$NB_ROOT/netbsd-amd64-serial.img.gz" | tee "$NB_ROOT/logs/images.sha256"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: netbsd-amd64-serial-image
          path: /mnt/nb/netbsd-amd64-serial.img.gz
          compression-level: 0
          retention-days: 7
      - name: summary
        if: always()
        run: |
          {
            echo "### rb image"
            scripts/netbsd/summary.sh "$NB_ROOT/logs/phases.tsv"
            echo
            img="$NB_ROOT/netbsd-amd64-serial.img.gz"
            if [ -f "$img" ]; then
              echo "Image \`$(basename "$img")\`: $(du -m "$img" | cut -f1) MiB compressed, $(gzip -dc "$img" | wc -c | awk '{ printf "%d", $1 / 1048576 }') MiB raw."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-logs-image
          path: /mnt/nb/logs
          retention-days: 14

  boot:
    name: boot and smoke
    needs: [rb, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-system-x86 qemu-utils ovmf
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-amd64-serial-image
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: rb boot
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/rb/rb"
          gzip -d "$RUNNER_TEMP/netbsd-amd64-serial.img.gz"
          truncate -s 12G "$RUNNER_TEMP/netbsd-amd64-serial.img"
          status=0
          # BIOS boots once with the boot suite only, because its point is the boot code. UEFI is
          # the row's test firmware, so it runs the smoke suite too.
          "$RUNNER_TEMP/rb/rb" boot --image "$RUNNER_TEMP/netbsd-amd64-serial.img" \
            --out "$RUNNER_TEMP/boot/seabios" --firmware seabios --suite boot \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          "$RUNNER_TEMP/rb/rb" boot --image "$RUNNER_TEMP/netbsd-amd64-serial.img" \
            --out "$RUNNER_TEMP/boot/ovmf" --suite boot,smoke \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"
      - name: summary
        if: always()
        run: |
          {
            echo "### boot and smoke: the console's RB- lines"
            echo
            echo '```'
            grep -a '^RB-' "$RUNNER_TEMP"/boot/*/console.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-boot-smoke
          path: ${{ runner.temp }}/boot
          retention-days: 14

  atf:
    name: ATF ${{ matrix.shard }}
    needs: [rb, image]
    if: github.event_name != 'workflow_dispatch' || inputs.atf
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "only:net"
            tests: --tests-only net
          - shard: "only:lib"
            tests: --tests-only lib
          - shard: "except:net,lib"
            tests: --tests-except net,lib
    steps:
      - uses: actions/checkout@v7.0.1
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-system-x86 qemu-utils ovmf
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-amd64-serial-image
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: shard name
        run: echo "SHARD_NAME=$(echo "$SHARD" | tr ':,' '--')" >> "$GITHUB_ENV"
        env:
          SHARD: ${{ matrix.shard }}
      - name: rb boot with the tests suite
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/rb/rb"
          gzip -d "$RUNNER_TEMP/netbsd-amd64-serial.img.gz"
          truncate -s 12G "$RUNNER_TEMP/netbsd-amd64-serial.img"
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/rb/rb" boot --image "$RUNNER_TEMP/netbsd-amd64-serial.img" \
            --out "$RUNNER_TEMP/atf-$SHARD_NAME" --suite boot,smoke,tests $TESTS --timeout 18000 \
            | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          TESTS: ${{ matrix.tests }}
      - name: counts
        if: always()
        run: |
          out="$RUNNER_TEMP/atf-$SHARD_NAME"
          shopt -s nullglob
          tps=("$out"/results/tests/atf/*.tps)
          if [ ${#tps[@]} -gt 0 ]; then
            python3 scripts/netbsd/atf-counts.py count --out "$out/shard.counts" \
              --cases "$out/shard.cases.tsv" --set "shard=$SHARD" "${tps[@]}"
          fi
          {
            echo "### ATF $SHARD"
            echo
            echo '```'
            cat "$out/results/tests/atf/status" "$out/shard.counts" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP"/netbsd-amd64-serial.img
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-atf-${{ env.SHARD_NAME }}
          path: ${{ runner.temp }}/atf-${{ env.SHARD_NAME }}
          retention-days: 30

  report:
    name: report
    needs: [rb, tools, world, image, boot, atf]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: netbsd-logs-*
          path: logs
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: netbsd-atf-*
          path: atf
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-boot-smoke
          path: boot
        continue-on-error: true
      - name: phases
        run: |
          {
            echo "### NetBSD trunk amd64, G: build phases"
            echo
            echo "Times are wall clock on one ubuntu-24.04 runner (4 vCPUs). Sizes are in MiB after each phase; Free is what was left on /mnt."
            echo
            cat logs/netbsd-logs-*/phases.tsv 2>/dev/null > phases.tsv || true
            scripts/netbsd/summary.sh phases.tsv
          } >> "$GITHUB_STEP_SUMMARY"
      - name: ATF counts against the published run
        run: |
          . conf/netbsd/trunk.pin
          mkdir -p out
          shopt -s nullglob
          tps=(atf/*/results/tests/atf/*.tps)
          if [ ${#tps[@]} -eq 0 ]; then
            echo "No ATF results." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dirs=$(cat atf/*/results/tests/dirs | tr ' ' '\n' | sed '/^$/d' | sort | tr '\n' ' ')
          all=$(cat atf/*/results/tests/all-dirs | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ')
          name="$NB_PIN_NAME-$NB_PIN_SHORT-amd64-g-$GITHUB_RUN_ID"
          python3 scripts/netbsd/atf-counts.py count --out "out/$name.counts" --cases "out/$name.cases.tsv" \
            --set label=G --set system=netbsd --set "pin=$NB_PIN_NAME" --set "commit=$NB_PIN_COMMIT" \
            --set row=amd64 --set cc=gcc-in-tree --set "gcc=$NB_PIN_GCC" --set kernel=GENERIC \
            --set image=live-image --set host=github-ubuntu-24.04-kvm --set vm=2-vcpu-8g \
            --set "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --set "date=$(date -u +%Y-%m-%d)" --set "dirs=$dirs" "${tps[@]}"
          awk -F '\t' '$3 == "failed" { print $1 "\t" $2 }' "out/$name.cases.tsv" > "out/$name.failed"
          {
            echo "### ATF: G against the published bare-metal run"
            echo
            echo "Directories run: $dirs"
            if [ "$(echo "$dirs" | tr -s ' ')" != "$(echo "$all" | tr -s ' ')" ]; then
              echo
              echo "Not every directory ran, so the totals are partial. All directories: $all"
            fi
            echo
            python3 scripts/netbsd/atf-counts.py compare \
              results/netbsd/published/amd64-baremetal-2026.10.04.03.28.10.counts "out/$name.counts"
            echo
            echo "Failed here and not in the published run:"
            echo
            echo '```'
            sort "out/$name.failed" | comm -23 - <(sort results/netbsd/published/amd64-baremetal-2026.10.04.03.28.10.failed)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
        continue-on-error: true
      - name: a one-run baseline
        run: |
          # The run is in shards: the two boots of the boot job and the three ATF boots. rb
          # baseline joins them with + into one run. It writes to out/baselines, not baselines/.
          shopt -s nullglob
          shards=(boot/*/ atf/*/)
          chmod +x "$RUNNER_TEMP/rb/rb" 2>/dev/null || true
          if [ ! -x "$RUNNER_TEMP/rb/rb" ] || [ ${#shards[@]} -eq 0 ]; then
            echo "No rb or no boots, so no baseline." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          from=$(printf '%s+' "${shards[@]%/}")
          status=0
          "$RUNNER_TEMP/rb/rb" baseline netbsd-trunk --row amd64 --conf graded \
            --from "${from%+}" --dir out/baselines > baseline.md || status=$?
          {
            cat baseline.md
            echo
            echo "rb baseline exited with $status."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-results
          path: out
          if-no-files-found: ignore
          retention-days: 90
