# DragonFly x86_64 built natively by rucc (R), in the DragonFly builder VM (plan 05.3 and 16.12).
#
# The job boots the builder VM of dragonfly-g. scripts/dragonfly/rucc.sh installs the rust package,
# builds rucc in the VM from a commit of tamnd/rucc, and adds rucc to /etc/compilers.conf as the
# CCVER of the ccver input. The job then builds the pinned, unmodified tree with
#
#   env WORLD_CCVER=<ccver> make -j4 buildworld
#   env WORLD_CCVER=<ccver> make -j4 buildkernel KERNCONF=X86_64_GENERIC
#
# which is how compilers.conf(5) builds the system with a compiler that is not in base. rucc
# compiles the C. C++ stays with the reference g++ of the release. scripts/dragonfly/image.sh then
# makes a test image of the build, and scripts/dragonfly/boot.sh boots it and runs the smoke suite.
# The build record is the artifact, with rucc.txt for the versions and the compilers.conf entry, and
# boot/ for the console log and the results of the boot.
#
# The selfbuild job is the self-build (RR). It boots the image of the build job as its builder VM,
# installs the rucc of the build job as the same CCVER, and builds, images and boots the tree again.
#
# rucc is built from the head of tamnd/rucc main, or from the rucc input. Such a run is ungraded.
# The workflow runs only when it is started by hand, because one run holds a runner for hours.

name: dragonfly-r

on:
  workflow_dispatch:
    inputs:
      pin:
        description: A pin of conf/dragonfly/pins.conf
        required: false
        default: 6.4.2
      commit:
        description: Build this full commit hash of the pin's repository instead of the pinned one
        required: false
        default: ""
      rucc:
        description: A branch or commit of tamnd/rucc
        required: false
        default: main
      ccver:
        description: The CCVER of rucc in compilers.conf
        required: false
        default: rucc80
      stop:
        description: Stop after provision, after rucc is installed, or after the R build and its boot, or run all stages with the self-build
        type: choice
        options: [all, provision, rucc, build]
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  RB_PIN: ${{ inputs.pin || '6.4.2' }}
  RB_STOP: ${{ inputs.stop || 'all' }}
  RB_CCVER: ${{ inputs.ccver || 'rucc80' }}
  RB_CACHE: /mnt/rb-cache
  RB_VM_DIR: /mnt/rb-builder
  # The command environment of the scripts in the builder VM. The shell of root there is csh, so
  # the commands start with env.
  VM_ENV: >-
    RB_SRC=/build/src RB_OBJ=/build/obj RB_OUT=/root/out RB_JOBS=4
    RB_CCVER=${{ inputs.ccver || 'rucc80' }}

jobs:
  build:
    name: build ${{ inputs.pin || '6.4.2' }} with rucc
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7.0.1
      - name: free disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$RB_CACHE" "$RB_VM_DIR"
          sudo chown "$USER" "$RB_CACHE" "$RB_VM_DIR"
          df -h / /mnt
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: install QEMU
        run: scripts/ci/apt-install.sh qemu-system-x86 qemu-utils bzip2
      - name: cache the builder image
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/dfly-*.img.bz2
          key: dragonfly-builder-${{ hashFiles('conf/dragonfly/builder.conf') }}
      - name: cache the source
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/dragonfly-src-*
          key: dragonfly-src-${{ env.RB_PIN }}-${{ inputs.commit }}-${{ hashFiles('conf/dragonfly/pins.conf') }}
      - name: the commit of tamnd/rucc
        run: |
          sha=$(gh api "repos/tamnd/rucc/commits/$REF" -q .sha)
          echo "RUCC_COMMIT=$sha" >> "$GITHUB_ENV"
          echo "rucc built in the VM from tamnd/rucc $REF, commit $sha. The run is ungraded." >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.rucc || 'main' }}
      - name: boot the builder VM
        run: |
          scripts/dragonfly/builder.sh up
          tar --exclude=./.git --exclude=./target -cf - . \
            | scripts/dragonfly/builder.sh ssh 'mkdir -p /root/harness && tar -xf - -C /root/harness'
      - name: provision
        run: scripts/dragonfly/builder.sh ssh 'sh /root/harness/scripts/dragonfly/provision.sh /root/out'
      - name: rucc as CCVER ${{ env.RB_CCVER }}
        if: env.RB_STOP != 'provision'
        run: |
          curl -sfL --retry 3 "https://codeload.github.com/tamnd/rucc/tar.gz/$RUCC_COMMIT" \
            | scripts/dragonfly/builder.sh ssh 'mkdir -p /build/rucc-src && tar -xzf - -C /build/rucc-src --strip-components 1'
          scripts/dragonfly/builder.sh ssh "env $VM_ENV sh /root/harness/scripts/dragonfly/rucc.sh /root/out $RB_CCVER"
      - name: fetch the source of ${{ env.RB_PIN }}
        if: env.RB_STOP == 'all' || env.RB_STOP == 'build'
        run: |
          mkdir -p record
          archive=$(RB_OUT=record RB_COMMIT="${{ inputs.commit }}" scripts/dragonfly/fetch.sh "$RB_PIN")
          ls -l "$archive"
          scripts/dragonfly/builder.sh ssh 'mkdir -p /build/src && tar -xf - -C /build/src' < "$archive"
          scripts/dragonfly/builder.sh put record/source.txt /root/out/source.txt
          scripts/dragonfly/builder.sh ssh 'du -sh /build/src; df -h /build'
      - name: the make variables of gcc80 and ${{ env.RB_CCVER }}
        if: env.RB_STOP == 'all' || env.RB_STOP == 'build'
        run: scripts/dragonfly/builder.sh ssh "env $VM_ENV sh /root/harness/scripts/dragonfly/mkdiff.sh /root/out gcc80 $RB_CCVER"
      - name: buildworld
        if: env.RB_STOP == 'all' || env.RB_STOP == 'build'
        run: scripts/dragonfly/builder.sh ssh "env $VM_ENV sh /root/harness/scripts/dragonfly/build.sh world"
      - name: buildkernel
        if: env.RB_STOP == 'all' || env.RB_STOP == 'build'
        run: scripts/dragonfly/builder.sh ssh "env $VM_ENV sh /root/harness/scripts/dragonfly/build.sh kernel"
      - name: the test image
        if: env.RB_STOP == 'all' || env.RB_STOP == 'build'
        run: |
          scripts/dragonfly/builder.sh ssh "env $VM_ENV RB_HARNESS=/root/harness RB_DESTDIR=/build/dest RB_IMAGE=/build/img/rb.img sh /root/harness/scripts/dragonfly/image.sh"
          # The image is sparse in the VM. dd keeps the blocks of zeros out of the copy on the host.
          scripts/dragonfly/builder.sh ssh 'cat /build/img/rb.img' | dd of="$RB_VM_DIR/rb.img" bs=1M iflag=fullblock conv=sparse status=none
          ls -ls "$RB_VM_DIR/rb.img"
          scripts/dragonfly/builder.sh get /build/rb/bin/rucc "$RB_VM_DIR/rucc"
      - name: copy the build record out
        if: always()
        run: |
          mkdir -p record
          echo "$GITHUB_RUN_ID" > record/run.txt
          scripts/dragonfly/builder.sh ssh 'df -k /build / | tail -n +2 > /root/out/df.txt; tar -cf - -C /root/out .' | tar -xf - -C record || true
          scripts/dragonfly/builder.sh down || true
          cp "$RB_VM_DIR/console.log" record/builder-console.log || true
          df -h /mnt > record/host-df.txt
          ls -l record
      - name: boot the test image and run the smoke suite
        if: always() && env.RB_STOP == 'all'
        run: |
          if [ ! -f "$RB_VM_DIR/rb.img" ]; then
            echo "no image"
            exit 1
          fi
          rm -f "$RB_VM_DIR/root.raw" "$RB_VM_DIR/build.raw"
          scripts/dragonfly/boot.sh "$RB_VM_DIR/rb.img" "boot smoke" record/boot
      - name: summary
        if: always()
        run: |
          {
            echo "### DragonFly $RB_PIN, R with CCVER=$RB_CCVER"
            echo
            if [ -f record/source.txt ]; then
              echo "Source: \`$(cut -f3,4 record/source.txt | tr '\t' ' ')\`"
              echo
            fi
            if [ -f record/phases.tsv ]; then
              echo '| phase | status | seconds | objects (KB) | disk used (KB) |'
              echo '|---|---|---|---|---|'
              sed -e 's/\t/ | /g' -e 's/^/| /' -e 's/$/ |/' record/phases.tsv
              echo
            fi
            if [ -f record/toolchain.txt ]; then
              echo '```'
              sed -n '/^# host/,+1p;/^# CCVER/p;/--version/,+1p;/^# gcc -v/,+1p' record/toolchain.txt
              echo '```'
            fi
            if [ -f record/boot/boot.json ]; then
              echo "Boot of the test image: \`$(cat record/boot/boot.json)\`"
              echo
              if [ -f record/boot/results/out/smoke/results ]; then
                echo '```'
                cat record/boot/results/out/smoke/results
                echo '```'
              fi
            fi
            if [ -f record/mk-diff.txt ]; then
              echo '```'
              cat record/mk-diff.txt
              echo '```'
            fi
            if [ -f record/rucc.txt ]; then
              echo '```'
              cat record/rucc.txt
              echo '```'
            fi
            for f in record/*-error.txt; do
              [ -f "$f" ] || continue
              echo
              echo "First error in $(basename "$f" -error.txt):"
              echo
              echo '```'
              tail -40 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload the build record
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dragonfly-build-${{ env.RB_PIN }}-${{ env.RB_CCVER }}
          path: record
          if-no-files-found: ignore
      - name: keep the image and rucc for the self-build
        if: env.RB_STOP == 'all'
        run: |
          mkdir -p selfbuild
          zstd -q -T0 -3 "$RB_VM_DIR/rb.img" -o selfbuild/rb.img.zst
          cp "$RB_VM_DIR/rucc" selfbuild/rucc
          ls -l selfbuild
      - name: upload the image and rucc
        if: env.RB_STOP == 'all'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dragonfly-image-${{ env.RB_PIN }}-${{ env.RB_CCVER }}
          path: selfbuild
          retention-days: 7
          compression-level: 0

  # The self-build (RR, plan 02.7): the image of the R build is the builder VM. Its own rucc builds
  # the same tree again, and the image of that build boots and runs the smoke suite.
  selfbuild:
    name: self-build of ${{ inputs.pin || '6.4.2' }} with rucc
    needs: build
    if: (inputs.stop || 'all') == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      RB_BUILDER_RAW: /mnt/rb-builder/r.img
    steps:
      - uses: actions/checkout@v7.0.1
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$RB_CACHE" "$RB_VM_DIR"
          sudo chown "$USER" "$RB_CACHE" "$RB_VM_DIR"
          df -h / /mnt
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: install QEMU
        run: scripts/ci/apt-install.sh qemu-system-x86 qemu-utils zstd
      - name: the image and rucc of the R build
        uses: actions/download-artifact@v8.0.1
        with:
          name: dragonfly-image-${{ env.RB_PIN }}-${{ env.RB_CCVER }}
          path: selfbuild
      - name: cache the source
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/dragonfly-src-*
          key: dragonfly-src-${{ env.RB_PIN }}-${{ inputs.commit }}-${{ hashFiles('conf/dragonfly/pins.conf') }}
      - name: boot the R image as the builder VM
        run: |
          zstd -q -d --sparse selfbuild/rb.img.zst -o "$RB_BUILDER_RAW"
          rm selfbuild/rb.img.zst
          scripts/dragonfly/builder.sh up
          tar --exclude=./.git --exclude=./target --exclude=./selfbuild -cf - . \
            | scripts/dragonfly/builder.sh ssh 'mkdir -p /root/harness && tar -xf - -C /root/harness'
      - name: provision
        run: scripts/dragonfly/builder.sh ssh 'env RB_BUILD_DEV=da2 sh /root/harness/scripts/dragonfly/provision.sh /root/out'
      - name: the rucc of the R build as CCVER ${{ env.RB_CCVER }}
        run: |
          scripts/dragonfly/builder.sh ssh 'mkdir -p /build/rb/bin'
          scripts/dragonfly/builder.sh put selfbuild/rucc /build/rucc-r
          scripts/dragonfly/builder.sh ssh "env $VM_ENV RB_RUCC_BIN=/build/rucc-r sh /root/harness/scripts/dragonfly/rucc.sh /root/out $RB_CCVER"
      - name: fetch the source of ${{ env.RB_PIN }}
        run: |
          mkdir -p record
          archive=$(RB_OUT=record RB_COMMIT="${{ inputs.commit }}" scripts/dragonfly/fetch.sh "$RB_PIN")
          scripts/dragonfly/builder.sh ssh 'mkdir -p /build/src && tar -xf - -C /build/src' < "$archive"
          scripts/dragonfly/builder.sh put record/source.txt /root/out/source.txt
      - name: buildworld
        run: scripts/dragonfly/builder.sh ssh "env $VM_ENV sh /root/harness/scripts/dragonfly/build.sh world"
      - name: buildkernel
        run: scripts/dragonfly/builder.sh ssh "env $VM_ENV sh /root/harness/scripts/dragonfly/build.sh kernel"
      - name: the test image
        run: |
          scripts/dragonfly/builder.sh ssh "env $VM_ENV RB_HARNESS=/root/harness RB_DESTDIR=/build/dest RB_IMAGE=/build/img/rb.img sh /root/harness/scripts/dragonfly/image.sh"
          scripts/dragonfly/builder.sh ssh 'cat /build/img/rb.img' | dd of="$RB_VM_DIR/rr.img" bs=1M iflag=fullblock conv=sparse status=none
      - name: copy the build record out
        if: always()
        run: |
          mkdir -p record
          echo "$GITHUB_RUN_ID" > record/run.txt
          scripts/dragonfly/builder.sh ssh 'tar -cf - -C /root/out .' | tar -xf - -C record || true
          scripts/dragonfly/builder.sh down || true
          cp "$RB_VM_DIR/console.log" record/builder-console.log || true
      - name: boot the self-built image and run the smoke suite
        if: always()
        run: |
          if [ ! -f "$RB_VM_DIR/rr.img" ]; then
            echo "no image"
            exit 1
          fi
          rm -f "$RB_BUILDER_RAW" "$RB_VM_DIR/build.raw"
          scripts/dragonfly/boot.sh "$RB_VM_DIR/rr.img" "boot smoke" record/boot
      - name: summary
        if: always()
        run: |
          {
            echo "### DragonFly $RB_PIN, self-build (RR) with CCVER=$RB_CCVER"
            echo
            if [ -f record/phases.tsv ]; then
              echo '| phase | status | seconds | objects (KB) | disk used (KB) |'
              echo '|---|---|---|---|---|'
              sed -e 's/\t/ | /g' -e 's/^/| /' -e 's/$/ |/' record/phases.tsv
              echo
            fi
            if [ -f record/boot/boot.json ]; then
              echo "Boot of the self-built image: \`$(cat record/boot/boot.json)\`"
              echo
              if [ -f record/boot/results/out/smoke/results ]; then
                echo '```'
                cat record/boot/results/out/smoke/results
                echo '```'
              fi
            fi
            for f in record/*-error.txt; do
              [ -f "$f" ] || continue
              echo
              echo "First error in $(basename "$f" -error.txt):"
              echo
              echo '```'
              tail -40 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload the build record
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dragonfly-selfbuild-${{ env.RB_PIN }}-${{ env.RB_CCVER }}
          path: record
          if-no-files-found: ignore
