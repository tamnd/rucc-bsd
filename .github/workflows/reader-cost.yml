# Two B1 measurements on NetBSD trunk amd64 (docs/plan 16, B1):
#   reader     what rucc's file-scope asm reader saves on NetBSD userland (07.3). build.sh
#              distribution runs with the reference GCC through the control overlay
#              ("overlay.sh ref"), whose log names every C unit, its directory and its arguments.
#              scripts/reader-cost.py then compiles the units again with rucc, with the reader on
#              and off, and times them. The plan's rule: if the reader saves less than 1% of the
#              build's time, it is removed rather than fixed.
#   toolchain  rb toolchain makes G's and R's TOOLDIR from the TOOLDIR of build.sh tools, and
#              rb toolchain-diff checks that they differ in the side of rb-shim.toml only (05.4).
# rucc is built from a branch or commit of tamnd/rucc, main by default. It is not the pinned
# release, so the toolchain check runs with --ungraded.

name: reader-cost

on:
  workflow_dispatch:
    inputs:
      rucc:
        description: A branch or commit of tamnd/rucc
        required: false
        default: main
      budget:
        description: The seconds the replay may take
        required: false
        default: "9000"

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NB_ROOT: /mnt/nb
  RUCC_REF: ${{ inputs.rucc || 'main' }}

jobs:
  bins:
    name: cargo build rucc, rb and rb-cc
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: rb and rb-cc
        run: |
          cargo build --release --locked -p rb --bin rb -p rb-shim --bin rb-cc
          mkdir -p "$RUNNER_TEMP/bins"
          cp target/release/rb target/release/rb-cc "$RUNNER_TEMP/bins/"
      - name: rucc ${{ env.RUCC_REF }}
        run: |
          git clone -q https://github.com/tamnd/rucc "$RUNNER_TEMP/rucc-src"
          git -C "$RUNNER_TEMP/rucc-src" checkout -q "$RUCC_REF"
          cargo build --release --manifest-path "$RUNNER_TEMP/rucc-src/Cargo.toml" -p rucc
          cp "$RUNNER_TEMP/rucc-src/target/release/rucc" "$RUNNER_TEMP/bins/"
          echo "rucc built from tamnd/rucc $(git -C "$RUNNER_TEMP/rucc-src" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: reader-cost-bins
          path: ${{ runner.temp }}/bins
          retention-days: 7

  toolchain:
    name: rb toolchain-diff for NetBSD
    needs: bins
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles('conf/netbsd/trunk.pin', 'scripts/netbsd/common.sh') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: reader-cost-bins
          path: ${{ runner.temp }}/bins
      - name: rb toolchain and rb toolchain-diff
        run: |
          bins="$RUNNER_TEMP/bins"
          chmod +x "$bins"/*
          out="$RUNNER_TEMP/toolchain.txt"
          status=0
          "$bins/rb" toolchain netbsd-trunk --dir "$NB_ROOT/tools-g" --tools "$NB_ROOT/tools" \
            --destdir "$NB_ROOT/destdir" --cc ref --shim "$bins/rb-cc" --log "$NB_ROOT/g.jsonl" \
            > "$out" 2>&1 || status=1
          echo >> "$out"
          "$bins/rb" toolchain netbsd-trunk --dir "$NB_ROOT/tools-r" --tools "$NB_ROOT/tools" \
            --destdir "$NB_ROOT/destdir" --cc rucc --rucc "$bins/rucc" --ungraded \
            --shim "$bins/rb-cc" --log "$NB_ROOT/r.jsonl" >> "$out" 2>&1 || status=1
          echo >> "$out"
          "$bins/rb" toolchain-diff netbsd-trunk --g "$NB_ROOT/tools-g" --r "$NB_ROOT/tools-r" \
            --ungraded >> "$out" 2>&1 || status=1
          cat "$out"
          {
            echo "### rb toolchain-diff for netbsd-trunk"
            echo
            echo '```'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  reader:
    name: the reader on and off over NetBSD userland
    needs: bins
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles('conf/netbsd/trunk.pin', 'scripts/netbsd/common.sh') }}
          fail-on-cache-miss: true
      - name: host packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends zlib1g-dev
      - name: fetch the pinned tree
        run: scripts/netbsd/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: reader-cost-bins
          path: ${{ runner.temp }}/bins
      - name: the control TOOLDIR, which logs every C unit
        run: |
          chmod +x "$RUNNER_TEMP"/bins/*
          scripts/netbsd/overlay.sh ref
      - name: build.sh distribution with the reference GCC
        run: NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh distribution -u distribution
      - name: the units again with rucc, the reader on and off
        run: |
          . conf/netbsd/trunk.pin
          python3 scripts/reader-cost.py --log "$NB_ROOT/logs/shim.tsv" --rucc "$RUNNER_TEMP/bins/rucc" \
            --target x86_64--netbsd --gnuc "$NB_PIN_GCC" --sysroot "$NB_ROOT/destdir" \
            --out "$NB_ROOT/reader-cost" --budget "$BUDGET"
          cat "$NB_ROOT/reader-cost/summary.md" >> "$GITHUB_STEP_SUMMARY"
        env:
          BUDGET: ${{ inputs.budget || '9000' }}
      - name: compress the results
        if: always()
        run: |
          cp "$NB_ROOT/logs/phases.tsv" "$NB_ROOT/reader-cost/" 2>/dev/null || true
          xz -T0 "$NB_ROOT/logs/shim.tsv" 2>/dev/null && cp "$NB_ROOT/logs/shim.tsv.xz" "$NB_ROOT/reader-cost/" || true
          xz -T0 "$NB_ROOT/reader-cost/units.tsv" 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: reader-cost
          path: /mnt/nb/reader-cost
          if-no-files-found: ignore
          retention-days: 90
