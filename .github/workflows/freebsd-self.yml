# rucc as the system compiler of FreeBSD amd64 (milestone B10, plan 16.11).
#
# The package job boots the builder VM, builds rb, rb-cc and rucc (scripts/freebsd/rb-tools.sh), and
# makes the FreeBSD package of rucc (scripts/freebsd/rucc-pkg.sh). The package is of the commit of
# the rucc input, or of the [rucc] pin of toolchains.toml when the input is empty. It goes to the
# artifact freebsd-rucc-pkg with rucc-pkg.txt, which gives the commit and the SHA-256 of the binary
# and of the package.
#
# The cc job boots the RR image of the freebsd-r run r_run, or of the newest freebsd-r run on main
# with the artifacts freebsd-r-rr and freebsd-r-image when r_run is empty. The image boots as a host
# that the job drives by ssh (scripts/freebsd/rr-vm.sh). pkg add installs the package into the
# running system, not into the base system of the image, and the job runs scripts/freebsd/guest/cc.sh:
# small programs that cc compiles and runs, and the kyua test programs that compile at run time.
# GG and RR skip those for want of cc, so the results are reported and not graded.

name: freebsd-self

on:
  push:
    branches: [b10-rucc-pkg]
  workflow_dispatch:
    inputs:
      rucc:
        description: A full commit of tamnd/rucc for the package; empty for the pin of toolchains.toml
        required: false
        default: ""
      r_run:
        description: The freebsd-r run (target rr) whose RR image to boot; empty for the newest on main
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}

permissions:
  contents: read
  actions: read

env:
  RB_CACHE: /mnt/rb-cache
  VM_ENV: >-
    RB_SRC=/build/src RB_OBJ=/build/obj RB_OUT=/root/out RB_JOBS=4
    RB_HARNESS=/root/harness RB_PIN_NAME=freebsd-15.1 RB_GCC=15
    RB_COMPILE_JSONL=/build/out/compile.jsonl

jobs:
  package:
    name: the rucc package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    env:
      RB_VM_DIR: /mnt/rb-builder
    steps:
      - uses: actions/checkout@v7.0.1
      - name: free disk
        run: |
          sudo mkdir -p "$RB_CACHE" "$RB_VM_DIR"
          sudo chown "$USER" "$RB_CACHE" "$RB_VM_DIR"
          df -h / /mnt
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: install QEMU
        run: scripts/ci/apt-install.sh qemu-system-x86 qemu-utils sshpass zstd
      - name: cache the builder image
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/FreeBSD-*.raw.xz
          key: freebsd-builder-${{ hashFiles('conf/freebsd/builder.conf') }}
      - name: the commit of tamnd/rucc
        id: commit
        run: |
          if [ -n "$REF" ]; then
            sha=$(gh api "repos/tamnd/rucc/commits/$REF" -q .sha)
            how="the rucc input $REF"
          else
            sha=$(python3 -I -c 'import tomllib; print(tomllib.load(open("toolchains.toml", "rb"))["rucc"]["commit"])')
            how="the [rucc] pin of toolchains.toml"
          fi
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "RUCC_COMMIT=$sha" >> "$GITHUB_ENV"
          echo "The rucc package is built from tamnd/rucc $sha, $how." >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.rucc }}
      - name: boot the builder VM
        run: |
          scripts/freebsd/builder.sh up
          tar --exclude=./.git --exclude=./target -cf - . \
            | scripts/freebsd/builder.sh ssh 'mkdir -p /root/harness && tar -xf - -C /root/harness'
      - name: provision
        run: scripts/freebsd/builder.sh ssh "sh /root/harness/scripts/freebsd/provision.sh /root/out"
      - name: rb, rb-cc and rucc
        run: scripts/freebsd/builder.sh ssh "$VM_ENV sh /root/harness/scripts/freebsd/rb-tools.sh /root/out rucc $RUCC_COMMIT"
      - name: the package
        run: |
          scripts/freebsd/builder.sh ssh "$VM_ENV sh /root/harness/scripts/freebsd/rucc-pkg.sh /root/out $RUCC_COMMIT"
          mkdir -p pkg
          name=$(scripts/freebsd/builder.sh ssh 'cd /build/pkg && ls rucc-*.pkg')
          scripts/freebsd/builder.sh get "/build/pkg/$name" "pkg/$name"
          scripts/freebsd/builder.sh get /root/out/rucc-pkg.txt pkg/rucc-pkg.txt
          # rb and rb-cc, for the jobs that make the shims in the RR image.
          scripts/freebsd/builder.sh ssh 'tar -cJf - -C /build/rb/bin rb rb-cc' > pkg/rb-bin.tar.xz
          scripts/freebsd/builder.sh get /root/out/rb-tools.txt pkg/rb-tools.txt
          ls -l pkg
          { echo '```'; sed -n '1,/^$/p' pkg/rucc-pkg.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: power off
        if: always()
        run: scripts/freebsd/builder.sh down || true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: freebsd-rucc-pkg
          path: pkg
          retention-days: 30

  cc:
    name: the run-time compile tests in RR
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RB_VM_DIR: /mnt/rb-rr
    steps:
      - uses: actions/checkout@v7.0.1
      - name: free disk
        run: |
          sudo mkdir -p /mnt/rb "$RB_VM_DIR"
          sudo chown "$USER" /mnt/rb "$RB_VM_DIR"
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: install QEMU
        run: scripts/ci/apt-install.sh qemu-system-x86 qemu-utils zstd
      - name: the freebsd-r run of the RR image
        id: rrun
        run: |
          id=$R_RUN
          if [ -z "$id" ]; then
            for run in $(gh run list -R "$GITHUB_REPOSITORY" -w freebsd-r.yml -b main -L 40 --json databaseId -q '.[].databaseId'); do
              names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" -q '.artifacts[] | select(.expired | not) | .name')
              if echo "$names" | grep -qx freebsd-r-rr && echo "$names" | grep -qx freebsd-r-image; then
                id=$run
                break
              fi
            done
          fi
          if [ -z "$id" ]; then
            echo "No freebsd-r run on main has the artifacts freebsd-r-rr and freebsd-r-image." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "run=$id" >> "$GITHUB_OUTPUT"
          echo "The RR image is the one of freebsd-r run $id." >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          R_RUN: ${{ inputs.r_run }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: freebsd-r-image
          path: image
          run-id: ${{ steps.rrun.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: freebsd-rucc-pkg
          path: pkg
      - name: boot the RR image
        run: |
          zstd -d -q image/freebsd.img.zst -o /mnt/rb/freebsd.img
          rm -rf image
          scripts/freebsd/rr-vm.sh up /mnt/rb/freebsd.img
      - name: pkg add the rucc package
        run: |
          name=$(cd pkg && ls rucc-*.pkg)
          scripts/freebsd/rr-vm.sh put "pkg/$name" "/tmp/$name"
          # rucc links with ld of binutils. The images made before #182 have no gcc and so no binutils.
          scripts/freebsd/rr-vm.sh ssh "pkg info -e binutils || env ASSUME_ALWAYS_YES=yes IGNORE_OSVERSION=yes pkg install -y binutils;
            pkg add /tmp/$name && pkg info rucc && pkg annotate -S rucc rucc_commit &&
            ls -l /usr/local/bin/rucc /usr/local/bin/cc && rucc --version" | tee pkg-add.txt
      - name: the run-time compile tests
        timeout-minutes: 45
        run: |
          scripts/freebsd/rr-vm.sh put scripts/freebsd/guest/cc.sh /root/cc.sh
          scripts/freebsd/rr-vm.sh ssh 'sh /root/cc.sh /root/cc-out'
      - name: copy the results out
        if: always()
        run: |
          mkdir -p cc
          scripts/freebsd/rr-vm.sh ssh 'tar -cf - -C /root cc-out' | tar -xf - -C cc || true
          cp pkg-add.txt cc/ 2>/dev/null || true
          scripts/freebsd/rr-vm.sh down || true
          cp "$RB_VM_DIR/console.log" cc/ 2>/dev/null || true
      - name: summary
        if: always()
        run: |
          r=cc/cc-out
          {
            echo "### The run-time compile tests in RR, reported and not graded"
            echo
            echo "The RR image of freebsd-r run $R_RUN, with the rucc package of tamnd/rucc $COMMIT."
            echo
            echo '```'
            cat cc/pkg-add.txt 2>/dev/null || true
            echo '```'
            echo
            echo "Checks: $(cat "$r/counts" 2>/dev/null || echo none)"
            echo
            echo '```'
            cat "$r/results" 2>/dev/null || true
            echo '```'
            for f in "$r"/*.log; do
              [ -f "$f" ] || continue
              n=$(basename "$f" .log)
              grep -qx "fail $n" "$r/results" || continue
              echo
              echo "#### $n"
              echo
              echo '```'
              tail -30 "$f"
              echo '```'
            done
            echo
            echo "kyua, lib/atf/libatf-c and usr.bin/lorder: $(cat "$r/kyua/counts" 2>/dev/null || echo none)"
            echo
            echo '```'
            grep -v -- '->  passed' "$r/kyua/report.txt" 2>/dev/null | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          R_RUN: ${{ steps.rrun.outputs.run }}
          COMMIT: ${{ needs.package.outputs.commit }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: freebsd-self-cc
          path: cc
          retention-days: 30
