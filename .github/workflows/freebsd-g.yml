# FreeBSD amd64 built by the reference GCC (G), then imaged, booted and tested (plan 12 and 14.6).
#
# The build job boots the official FreeBSD 15.1-RELEASE BASIC-CI image under QEMU with KVM on the
# runner, with all the runner's vCPUs, 12 GB and a sparse 100 GB build disk on /mnt. In that VM it
# installs amd64-gcc15 and amd64-binutils from the FreeBSD package repository, or amd64-gcc14 with
# gcc: 14, the fallback of personas.toml for stable/14 (plan 04.3). It builds rb and rb-cc
# with rustup's Rust, and rb toolchain puts G's shims in /build/toolchain. Then it builds the pinned,
# unmodified tree with
#
#   make -j4 buildworld buildkernel CROSS_TOOLCHAIN=/build/toolchain/ref.mk SRCCONF=/root/out/src.conf
#
# where src.conf is conf/freebsd/<conf>.conf and the src.conf lines of the pin's fifth field in
# conf/freebsd/pins.conf, such as WITHOUT_SSP=yes for stable-14. freebsd-r adds the same lines, so
# G and R build the same configuration. That is the command line of FreeBSD's own GCC CI jobs with
# our SRCCONF and the shims in place of
# the package's CROSS_TOOLCHAIN file. The shims run the same amd64-gcc15 with the same arguments, and
# write a record of each call to compile.jsonl. Then it installs world,
# kernel and distribution into a staging tree, adds the image changes of conf/freebsd/image and rb-rc,
# and makes a GPT image with makefs and mkimg. rb census and rb demands read compile.jsonl. The image,
# the build record and compile.jsonl.xz are the artifacts.
#
# The boot job boots the image twice, with 2 vCPUs and 8 GB as FreeBSD's CI test VM has: by BIOS for
# the boot suite only, and by UEFI for the boot suite, the smoke suite and kyua over /usr/tests. It
# compares the kyua counts with the build of FreeBSD's own test job that conf/freebsd/published.conf
# gives for the pin, or else with the last completed build of the branch's test job.
#
# A manual run can boot the image three times (runs: 3). Each run is one boot job with both boots,
# and the baseline job gives the runs to rb baseline, which writes the cases that passed in every
# run (plan 12.5). With rebuild, a second build job builds the same pin again, and the repro job
# compares the two images and the manifests of their staging trees (plan 16.1). With kyua off, the
# UEFI boot runs only the boot and smoke suites, which is enough to say that a pin is G-good: G built
# it, and it booted (plan 04.6).
#
# A manual run can stop after a stage, and can boot the image of an earlier run instead of building.
# On a pull request, the image and the build record are cached by the hash of what goes into them,
# so a change to the boot, the suites or the summary does not build FreeBSD again. A scheduled or
# manual run always builds.

name: freebsd-g

on:
  schedule:
    - cron: "41 4 * * 6"
  workflow_dispatch:
    inputs:
      pin:
        description: A pin of conf/freebsd/pins.conf, or a FreeBSD pin of pins.toml such as freebsd-14.5
        required: false
        default: 15.1-release
      commit:
        description: Build this full commit hash of a git pin instead of the pinned one, to look for a G-good commit
        required: false
        default: ""
      conf:
        description: A SRCCONF of conf/freebsd
        required: false
        default: graded
      stop:
        description: Stop after provision, build or image, or run all stages
        required: false
        default: all
      image-run:
        description: Boot the image of this earlier run, and do not build
        required: false
        default: ""
      runs:
        description: How many times to boot and test the image, for rb baseline
        type: choice
        options: ["1", "3"]
        default: "1"
      rebuild:
        description: Build the pin a second time and compare the two images
        type: boolean
        default: false
      kyua:
        description: Run kyua in the UEFI boot
        type: boolean
        default: true
      gcc:
        description: The reference, amd64-gcc15, or its fallback amd64-gcc14 of personas.toml where 15 fails
        type: choice
        options: ["15", "14"]
        default: "15"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

env:
  RB_PIN: ${{ inputs.pin || '15.1-release' }}
  RB_CONF: ${{ inputs.conf || 'graded' }}
  RB_STOP: ${{ inputs.stop || 'all' }}
  RB_CACHE: /mnt/rb-cache
  RB_VM_DIR: /mnt/rb-builder
  # The command environment of the scripts in the builder VM. RB_PIN_NAME is the pin's name in
  # pins.toml, for rb.
  VM_ENV: >-
    RB_SRC=/build/src RB_OBJ=/build/obj RB_OUT=/root/out RB_JOBS=4
    RB_SRCCONF=/root/out/src.conf RB_TOOLCHAIN=/build/toolchain/ref.mk
    RB_HARNESS=/root/harness RB_DESTDIR=/build/destdir RB_IMAGE=/build/image/freebsd.img
    RB_CONF=${{ inputs.conf || 'graded' }} RB_COMPILE_JSONL=/build/out/compile.jsonl
    RB_PIN_NAME=${{ startsWith(inputs.pin, 'freebsd-') && inputs.pin || (inputs.pin || '15.1-release') == '15.1-release' && 'freebsd-15.1' || format('freebsd-{0}', inputs.pin) }}
    RB_GCC=${{ inputs.gcc || '15' }}

jobs:
  rb:
    name: cargo build rb
    if: (inputs.stop || 'all') == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo build
        run: cargo build --release --locked -p rb --bin rb
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rb-linux-x86_64
          path: target/release/rb
          retention-days: 7

  build:
    name: build ${{ inputs.pin || '15.1-release' }} ${{ inputs.conf || 'graded' }}${{ inputs.gcc == '14' && ' gcc14' || '' }}${{ matrix.build == 2 && ' again' || '' }}
    if: ${{ !inputs.image-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(inputs.rebuild && '[1, 2]' || '[1]') }}
    env:
      # The second build's artifacts have names that the boot job does not download.
      RB_AGAIN: ${{ matrix.build == 2 && '-rebuild' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: look for a cached image
        id: cached
        if: github.event_name == 'pull_request'
        uses: actions/cache@v6.1.0
        with:
          path: cached
          key: >-
            freebsd-image-${{ env.RB_PIN }}-${{ env.RB_CONF }}-${{ hashFiles('conf/freebsd/**',
            '!conf/freebsd/image/kyua-exclude', 'scripts/freebsd/*.sh', '!scripts/freebsd/boot.sh',
            'scripts/freebsd/guest/rb') }}
      - name: use the cached image
        if: steps.cached.outputs.cache-hit == 'true'
        run: |
          mv cached/record record
          mkdir -p image
          mv cached/freebsd.img.zst image/
          echo "The image and the build record are those of run $(cat record/run.txt), from the cache." >> "$GITHUB_STEP_SUMMARY"
          echo RB_HIT=true >> "$GITHUB_ENV"
      - name: free disk
        if: env.RB_HIT != 'true'
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$RB_CACHE" "$RB_VM_DIR"
          sudo chown "$USER" "$RB_CACHE" "$RB_VM_DIR"
          df -h / /mnt
      - name: let the runner user open /dev/kvm
        if: env.RB_HIT != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: install QEMU
        if: env.RB_HIT != 'true'
        run: |
          scripts/ci/apt-install.sh qemu-system-x86 qemu-utils sshpass zstd
      - name: cache the builder image
        if: env.RB_HIT != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/FreeBSD-*.raw.xz
          key: freebsd-builder-${{ hashFiles('conf/freebsd/builder.conf') }}
      - name: cache the source
        if: env.RB_HIT != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/freebsd-src-*
          key: freebsd-src-${{ env.RB_PIN }}-${{ hashFiles('conf/freebsd/pins.conf') }}
      - name: boot the builder VM
        if: env.RB_HIT != 'true'
        run: |
          scripts/freebsd/builder.sh up
          tar --exclude=./.git --exclude=./target -cf - . \
            | scripts/freebsd/builder.sh ssh 'mkdir -p /root/harness && tar -xf - -C /root/harness'
      - name: provision
        if: env.RB_HIT != 'true'
        run: scripts/freebsd/builder.sh ssh "RB_GCC=${{ inputs.gcc || '15' }} sh /root/harness/scripts/freebsd/provision.sh /root/out"
      - name: rb, rb-cc and G's shims
        if: env.RB_HIT != 'true' && env.RB_STOP != 'provision'
        run: scripts/freebsd/builder.sh ssh "$VM_ENV sh /root/harness/scripts/freebsd/rb-tools.sh /root/out ref"
      - name: fetch the source of ${{ env.RB_PIN }}
        if: env.RB_HIT != 'true' && env.RB_STOP != 'provision'
        run: |
          mkdir -p record
          read -r archive strip < <(RB_OUT=record RB_COMMIT="${{ inputs.commit }}" scripts/freebsd/fetch.sh "$RB_PIN")
          ls -l "$archive"
          scripts/freebsd/builder.sh ssh "mkdir -p /build/src && tar -xf - -C /build/src --strip-components $strip" < "$archive"
          scripts/freebsd/builder.sh put record/source.txt /root/out/source.txt
          # The SRCCONF: the conf and the src.conf lines of the pin.
          scripts/freebsd/builder.sh ssh "cat /root/harness/conf/freebsd/$RB_CONF.conf - > /root/out/src.conf" < record/pin.conf
          if [ -s record/pin.conf ]; then
            echo "The pin $RB_PIN adds to the SRCCONF: $(paste -sd' ' record/pin.conf)" >> "$GITHUB_STEP_SUMMARY"
          fi
          scripts/freebsd/builder.sh ssh 'du -sh /build/src; df -h /build'
      - name: buildworld
        if: env.RB_HIT != 'true' && env.RB_STOP != 'provision'
        run: scripts/freebsd/builder.sh ssh "$VM_ENV sh /root/harness/scripts/freebsd/build.sh world"
      - name: buildkernel
        if: env.RB_HIT != 'true' && env.RB_STOP != 'provision'
        run: scripts/freebsd/builder.sh ssh "$VM_ENV sh /root/harness/scripts/freebsd/build.sh kernel"
      - name: image
        if: env.RB_HIT != 'true' && env.RB_STOP != 'provision' && env.RB_STOP != 'build'
        run: |
          scripts/freebsd/builder.sh ssh "$VM_ENV sh /root/harness/scripts/freebsd/image.sh"
          mkdir -p image
          scripts/freebsd/builder.sh get /build/image/freebsd.img.zst image/freebsd.img.zst
          ls -l image
      - name: rb census and rb demands
        if: always() && env.RB_HIT != 'true' && env.RB_STOP != 'provision'
        continue-on-error: true
        run: |
          scripts/freebsd/builder.sh ssh "$VM_ENV sh /root/harness/scripts/freebsd/census.sh /root/out"
          mkdir -p compile
          scripts/freebsd/builder.sh get /build/out/compile.jsonl.xz compile/compile.jsonl.xz
          ls -l compile
      - name: copy the build record out
        if: always() && env.RB_HIT != 'true'
        run: |
          mkdir -p record
          echo "$GITHUB_RUN_ID" > record/run.txt
          scripts/freebsd/builder.sh ssh 'df -k /build / | tail -n +2 > /root/out/df.txt; tar -cf - -C /root/out .' | tar -xf - -C record || true
          scripts/freebsd/builder.sh down || true
          cp "$RB_VM_DIR/console.log" record/builder-console.log || true
          df -h /mnt > record/host-df.txt
          du -sh "$RB_VM_DIR"/* >> record/host-df.txt || true
          cat record/host-df.txt
          ls -l record
      - name: keep the image for the next push
        if: >-
          steps.cached.outcome == 'success' && env.RB_HIT != 'true' && matrix.build == 1
          && hashFiles('image/freebsd.img.zst') != ''
        run: |
          mkdir -p cached
          cp -R record cached/record
          cp image/freebsd.img.zst cached/
      - name: summary
        if: always()
        run: |
          python3 -I scripts/freebsd/summarize.py --build record --conf "$RB_CONF" --out summary
          cat summary/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f record/toolchain.txt ]; then
            { echo; echo '```'; sed -n '/^# packages/,/^$/p;/--version/,+1p' record/toolchain.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f record/compile-jsonl.txt ]; then
            { echo; echo '### compile.jsonl'; echo; echo '```'; cat record/compile-jsonl.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            for f in census demands; do
              [ -f "record/$f.txt" ] || continue
              { echo; echo "### rb $f"; echo; echo '```'; head -80 "record/$f.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          for f in record/*-error.txt; do
            [ -f "$f" ] || continue
            { echo; echo "First error in $(basename "$f" -error.txt):"; echo; echo '```'; tail -40 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: upload the build record
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: freebsd-build-${{ env.RB_PIN }}-${{ env.RB_CONF }}${{ env.RB_AGAIN }}
          path: record
          if-no-files-found: ignore
      - name: upload compile.jsonl
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: freebsd-compile-${{ env.RB_PIN }}-${{ env.RB_CONF }}${{ env.RB_AGAIN }}
          path: compile
          if-no-files-found: ignore
          compression-level: 0
      - name: upload the image
        if: env.RB_STOP != 'provision' && env.RB_STOP != 'build'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: freebsd-image-${{ env.RB_PIN }}-${{ env.RB_CONF }}${{ env.RB_AGAIN }}
          path: image/freebsd.img.zst
          compression-level: 0

  boot:
    name: boot and test, run ${{ matrix.run }}
    needs: build
    if: >-
      always() && (inputs.stop || 'all') == 'all'
      && (needs.build.result == 'success' || inputs.image-run || (inputs.rebuild && needs.build.result == 'failure'))
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON((inputs.runs || '1') == '3' && '[1, 2, 3]' || '[1]') }}
    env:
      RB_RUN_NAME: ${{ matrix.run > 1 && format('-run-{0}', matrix.run) || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: install QEMU
        run: |
          scripts/ci/apt-install.sh qemu-system-x86 qemu-utils ovmf zstd
      - name: download the image and the build record
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: freebsd-*-${{ env.RB_PIN }}-${{ env.RB_CONF }}
          path: artifacts
          run-id: ${{ inputs.image-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: unpack the image
        run: |
          sudo mkdir -p /mnt/rb && sudo chown "$USER" /mnt/rb
          zstd -d -q artifacts/freebsd-image-*/freebsd.img.zst -o /mnt/rb/freebsd.img
          ls -ls /mnt/rb/freebsd.img
      - name: boot by BIOS, boot suite
        run: scripts/freebsd/boot.sh /mnt/rb/freebsd.img bios boot boots/bios
        env:
          RB_RUN_LIMIT: 900
      - name: boot by UEFI, boot, smoke and kyua
        if: always()
        run: scripts/freebsd/boot.sh /mnt/rb/freebsd.img uefi "boot smoke${{ (inputs.kyua || github.event_name != 'workflow_dispatch') && ' kyua' || '' }}" boots/uefi
        env:
          RB_RUN_LIMIT: 14400
      - name: summary
        if: always()
        run: |
          # The published run of the pin, from conf/freebsd/published.conf, or else the last one of
          # the branch's test job.
          # An entry of published.conf is for the pinned commit, so a run of another commit does not use it.
          [ -n "${{ inputs.commit }}" ] ||
            read -r job build < <(awk -v p="$RB_PIN" '$1 == p { print $2, $3 }' conf/freebsd/published.conf) || true
          if [ -z "${job:-}" ]; then
            case $RB_PIN in
            main | freebsd-main) job=FreeBSD-main-amd64-test ;;
            stable-14 | freebsd-stable-14 | freebsd-14.*) job=FreeBSD-stable-14-amd64-test ;;
            *) job=FreeBSD-stable-15-amd64-test ;;
            esac
          fi
          python3 -I scripts/freebsd/published.py "$job" published.json ${build:+"$build"} || true
          python3 -I scripts/freebsd/summarize.py --build artifacts/freebsd-build-"$RB_PIN-$RB_CONF" \
            --boot bios=boots/bios --boot uefi=boots/uefi --published published.json \
            --conf "$RB_CONF" --out summary
          cat summary/summary.md >> "$GITHUB_STEP_SUMMARY"
          for b in bios uefi; do
            { echo; echo "Console of the $b boot, last 30 lines:"; echo; echo '```'; tail -30 "boots/$b/console.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          done
      - name: upload the results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: freebsd-results-${{ env.RB_PIN }}-${{ env.RB_CONF }}${{ env.RB_RUN_NAME }}
          path: |
            boots
            summary
            published.json
          if-no-files-found: ignore

  baseline:
    name: rb baseline
    needs: [rb, boot]
    # A baseline is of the pinned commit, so a run of another commit makes none.
    if: always() && needs.rb.result == 'success' && needs.boot.result != 'skipped' && !inputs.commit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RB_PIN_NAME: ${{ startsWith(inputs.pin, 'freebsd-') && inputs.pin || (inputs.pin || '15.1-release') == '15.1-release' && 'freebsd-15.1' || format('freebsd-{0}', inputs.pin) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: download the results of the runs
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: freebsd-results-${{ env.RB_PIN }}-${{ env.RB_CONF }}*
          path: results
      - name: download the image
        uses: actions/download-artifact@v8.0.1
        with:
          name: freebsd-image-${{ env.RB_PIN }}-${{ env.RB_CONF }}
          path: image
          run-id: ${{ inputs.image-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: rb baseline
        run: |
          # Each run is two boots, BIOS and UEFI, which rb baseline joins with + into one run. The
          # runs are separated by commas. It writes to out/baselines, not baselines/.
          chmod +x "$RUNNER_TEMP/rb/rb"
          zstd -d -q image/freebsd.img.zst -o "$RUNNER_TEMP/freebsd.img"
          # download-artifact puts a single artifact straight into results, and each of two or more
          # into results/NAME.
          from=""
          for r in results/freebsd-results-* results; do
            [ -d "$r/boots" ] || continue
            run=""
            for fw in bios uefi; do
              [ -f "$r/boots/$fw/boot.json" ] || continue
              python3 -I scripts/freebsd/rb-runs.py "$r/boots/$fw" "runs/$(basename "$r")/$fw" --image "$RUNNER_TEMP/freebsd.img"
              run="$run+runs/$(basename "$r")/$fw"
            done
            [ -z "$run" ] || from="$from,${run#+}"
          done
          # Without --from, rb baseline would boot the image itself.
          if [ -z "$from" ]; then
            echo "No boot results were downloaded." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p out
          status=0
          "$RUNNER_TEMP/rb/rb" baseline "$RB_PIN_NAME" --row amd64 --conf "$RB_CONF" --from "${from#,}" \
            --image "$RUNNER_TEMP/freebsd.img" --dir out/baselines > baseline.md || status=$?
          # Every run has the same published.json, so the first one is enough.
          for p in results/freebsd-results-*/published.json results/published.json; do
            if [ -f "$p" ]; then cp "$p" out/; break; fi
          done
          python3 -I scripts/freebsd/baseline-gap.py out/baselines out/published.json >> baseline.md || true
          {
            cat baseline.md
            echo
            echo "rb baseline exited with $status."
          } >> "$GITHUB_STEP_SUMMARY"
          cp baseline.md out/
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: freebsd-baseline-${{ env.RB_PIN }}-${{ env.RB_CONF }}
          path: out
          if-no-files-found: ignore
          retention-days: 90

  repro:
    name: compare the two builds
    needs: build
    if: always() && inputs.rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: freebsd-build-${{ env.RB_PIN }}-${{ env.RB_CONF }}*
          path: builds
      - name: compare
        run: |
          status=0
          python3 -I scripts/freebsd/repro.py builds/freebsd-build-"$RB_PIN-$RB_CONF" \
            builds/freebsd-build-"$RB_PIN-$RB_CONF"-rebuild --out repro > /dev/null || status=$?
          cat repro/repro.md >> "$GITHUB_STEP_SUMMARY"
          echo "repro.py exited with $status." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: freebsd-repro-${{ env.RB_PIN }}-${{ env.RB_CONF }}
          path: repro
          if-no-files-found: ignore
          retention-days: 90
