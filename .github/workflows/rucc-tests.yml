# The rucc test suite on the FreeBSD 15.1 builder (milestone B1, docs/plan 16).
#
# tamnd/rucc runs its tests on FreeBSD in its own freebsd.yml, in the CI VM image of the
# vmactions action. B1 asks for the builder of this repository: the official 15.1-RELEASE
# BASIC-CI image of conf/freebsd/builder.conf, booted by scripts/freebsd/builder.sh and set up by
# scripts/freebsd/provision.sh, as in freebsd-g and freebsd-r. The packages that rucc's tests use
# (gcc, binutils, bash, git and zip, as in rucc's freebsd.yml) are installed on top. rustup
# installs the Rust of rucc's rust-toolchain.toml. The job then runs the same build and test
# commands as rucc's freebsd.yml, with the same skip list, and puts the counts and the failed
# tests in the step summary.

name: rucc-tests

on:
  workflow_dispatch:
    inputs:
      rucc:
        description: A branch or commit of tamnd/rucc
        required: false
        default: main
      skip:
        description: Test names to skip, separated by spaces
        required: false
        default: the_lock_free_questions_are_answered_as_constants

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RB_CACHE: /mnt/rb-cache
  RB_VM_DIR: /mnt/rb-builder

jobs:
  test:
    name: rucc tests on the FreeBSD 15.1 builder
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$RB_CACHE" "$RB_VM_DIR"
          sudo chown "$USER" "$RB_CACHE" "$RB_VM_DIR"
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: install QEMU
        run: |
          scripts/ci/apt-install.sh qemu-system-x86 qemu-utils sshpass zstd
      - name: cache the builder image
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/FreeBSD-*.raw.xz
          key: freebsd-builder-${{ hashFiles('conf/freebsd/builder.conf') }}
      - name: the commit of tamnd/rucc
        run: |
          sha=$(gh api "repos/tamnd/rucc/commits/$REF" -q .sha)
          echo "RUCC_COMMIT=$sha" >> "$GITHUB_ENV"
          echo "rucc from tamnd/rucc $REF, commit $sha." >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.rucc || 'main' }}
      - name: boot the builder VM
        run: |
          scripts/freebsd/builder.sh up
          tar --exclude=./.git --exclude=./target -cf - . \
            | scripts/freebsd/builder.sh ssh 'mkdir -p /root/harness && tar -xf - -C /root/harness'
      - name: provision
        run: scripts/freebsd/builder.sh ssh 'sh /root/harness/scripts/freebsd/provision.sh /root/out'
      - name: the test packages, rustup and the source of rucc
        run: |
          # shellcheck disable=SC2016
          scripts/freebsd/builder.sh ssh "set -e
            env ASSUME_ALWAYS_YES=yes pkg install -q -y bash curl git gcc binutils zip
            mkdir -p /build/rust /build/rucc
            fetch -q -o /build/rust/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-freebsd/rustup-init
            want=\$(fetch -q -o - https://static.rust-lang.org/rustup/dist/x86_64-unknown-freebsd/rustup-init.sha256 | awk '{ print \$1 }')
            test \"\$(sha256 -q /build/rust/rustup-init)\" = \"\$want\"
            chmod +x /build/rust/rustup-init
            RUSTUP_HOME=/build/rust/rustup CARGO_HOME=/build/rust/cargo /build/rust/rustup-init -y -q \
              --no-modify-path --profile minimal --default-toolchain none
            fetch -q -o - https://codeload.github.com/tamnd/rucc/tar.gz/$RUCC_COMMIT \
              | tar -xzf - -C /build/rucc --strip-components 1
            cat > /root/ci.env <<'EOF'
          export RUSTUP_HOME=/build/rust/rustup CARGO_HOME=/build/rust/cargo
          export PATH=/build/rust/cargo/bin:\$PATH
          export CARGO_TERM_COLOR=never CARGO_INCREMENTAL=0 RUSTFLAGS='-D warnings'
          export CARGO_TARGET_DIR=/build/target
          EOF
            . /root/ci.env
            cd /build/rucc && rustup toolchain install && rustc -vV
            freebsd-version; uname -a; sysctl -n hw.ncpu hw.physmem"
      - name: cargo build
        run: scripts/freebsd/builder.sh ssh '. /root/ci.env && cd /build/rucc && cargo build --workspace --all-features'
      - name: cargo test
        id: test
        run: |
          set -o pipefail
          skip=""
          for name in $SKIP; do skip="$skip --skip $name"; done
          scripts/freebsd/builder.sh ssh ". /root/ci.env && cd /build/rucc && \
            cargo test --workspace --all-features --no-fail-fast -- $skip" 2>&1 | tee "$RUNNER_TEMP/test.log"
        env:
          SKIP: ${{ inputs.skip }}
      - name: summary
        if: always()
        run: |
          log="$RUNNER_TEMP/test.log"
          {
            echo "### rucc tests on the FreeBSD 15.1 builder"
            echo
            if [ -f "$log" ]; then
              awk '/^test result:/ { p += $4; f += $6; i += $8 } END { printf "passed %d, failed %d, ignored %d\n\n", p, f, i }' "$log"
              echo "Failed tests:"
              echo
              echo '```'
              grep -E '^test .* \.\.\. FAILED$' "$log" || echo none
              echo '```'
            else
              echo "The tests did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: rucc-tests-log
          path: ${{ runner.temp }}/test.log
          if-no-files-found: ignore
          retention-days: 30
