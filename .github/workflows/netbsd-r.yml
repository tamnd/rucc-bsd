# R for the NetBSD trunk amd64 kernel (milestone B3): the GENERIC kernel of the pinned tree built
# by build.sh with rucc in the C compiler slot of TOOLDIR. The pin, the tools and the paths are
# those of netbsd-g.yml. The pin input picks conf/netbsd/PIN.pin, trunk by default. A g_run must
# be a netbsd-g run of the same pin.
#
# scripts/netbsd/overlay.sh copies the G TOOLDIR and replaces bin/x86_64--netbsd-gcc and
# bin/x86_64--netbsd-cpp with the shims in conf/netbsd/toolchain. Every other tool, the C++ slot
# among them, stays the reference. The kernel job runs twice:
#   ref    the control. The shims run the renamed reference GCC with the arguments unchanged. This
#          build must succeed, or the overlay is broken and the rucc result means nothing.
#   rucc   the shims run rucc with --target, -fgnuc-version and --sysroot. This build may fail
#          until B3 is done. When it fails, "make -k" goes on with the units that do not depend on
#          the failure, and scripts/netbsd/r-report.sh puts the first failed file, its error and
#          the counts in the step summary.
#
# The rucc binary is the [rucc] pin of toolchains.toml (scripts/netbsd/rucc.sh): a commit built
# from source, or a release tarball checked against its hash. The step summary gives the commit
# or the release and the SHA-256 of the binary. A manual run can name a branch or commit of
# tamnd/rucc instead, which is built from source and named by its commit in the step summary. A manual run can also name
# another --target, to see how far rucc gets before it knows the NetBSD triple (tamnd/rucc#4088).
#
# A manual run that names a G run (g_run) also boots the rucc kernel and tests it. The world is
# G's: the sets of that run, with kern-GENERIC made from the rucc kernel by kernset.sh. The G run
# must be of the same pin. The image, boot and atf jobs then do what they do in netbsd-g.yml, and
# the report job compares the ATF counts with the G counts of the pin in results/netbsd. The
# rucc kernel job then also builds RB-TEST (conf/netbsd/kernel/RB-TEST), and the image and boot
# jobs run once for GENERIC and once for RB-TEST. The ATF shards boot GENERIC.
#
# With a release pin, such as 11.1, the image, boot and atf jobs also make and test the official
# image: the official binary sets of the release (conf/netbsd/PIN.binary, scripts/netbsd/official.sh)
# with kern-GENERIC made from the rucc GENERIC kernel. This is the official userland, which the
# project built with GCC, on R's kernel, part 1 of rb foreign (plan 12.8). The report job compares
# its ATF shards with the GG shards of g_run with rb test, so a case counts only when GG passes it.
#
# With modules, the rucc kernel job also builds the kernel modules (build.sh modules), and the
# image job also makes an image with G's kernel, the G image, from the same sets with the same rb.
# The cross-modules job runs rb cross-modules for the four cells of plan 09.3, where the first
# letter names the kernel and the second the modules: GG and GR boot the G image, RG and RR the
# rucc GENERIC image, and GR and RR load the rucc modules in place of the modules of the sets.
# The cross-modules-report job compares the cells with GG.
#
# With mixed, a case that fails with the rucc kernel and passes with G's, the mixed job runs rb
# mixed (plan 12.7) to find the object of the rucc kernel that makes the case fail. It builds
# the GENERIC kernel with the ref TOOLDIR, so that the kernel's object directory is complete, and
# puts G's sets in place. Then each step of rb mixed puts the rucc object of the first k units
# and the ref object of the rest in that directory, links the kernel, makes the image and runs
# the case's ATF directory three times (scripts/netbsd/mixed.sh). The case is good when it passed
# at least once. A step takes about 10 minutes, and a search of the GENERIC kernel about 14 steps.
#
# A manual run with build=world does none of the above. Its world job builds "build.sh
# distribution" through the control TOOLDIR, then compiles every unit of that build again with
# rucc (scripts/netbsd/world-replay.sh, after the replay of freebsd-r.yml). So every unit of the
# world gets a rucc result, also the units that an earlier failure would hide in a rucc build.
# scripts/netbsd/replay-report.py puts the counts and the failed units by cause in the step
# summary. Then scripts/netbsd/stand.sh builds the boot code of sys/arch/i386/stand again with
# rucc and gives the size of each file of /usr/mdec beside the size from the control. The rucc and
# target inputs apply as for the kernel, and g_run and atf do not apply.
# The control build takes about 100 minutes and is the same for each run of the same pin. The run
# that builds it keeps it as an artifact (scripts/netbsd/control.sh), and a later run with the
# same pin and scripts restores that artifact and goes straight to the replay.
#
# A manual run with build=rr builds the RR world: "build.sh distribution", the GENERIC kernel and
# the sets, all through the rucc TOOLDIR of overlay.sh. The shims hand the directories of
# RB_SHIM_REF to the reference, each for an open rucc issue named in the rr job. rb census reads
# the shim log (scripts/netbsd/shim-records.py) and says which compiler made each object. The rr
# job then makes the RR image from these sets with rb image, and the rr-boot job boots it with
# SeaBIOS and with OVMF, with the smoke suite. With g_run, rb abi-diff compares the libraries of
# the R sets with those of the G sets of that run (scripts/netbsd/libs.sh), the compat -m32
# libraries of usr/lib/i386 among them. The rr-foreign job runs rb foreign (plan 12.8): it boots
# the RR image with the pkgsrc packages of conf/netbsd/foreign.toml and checks each one. With
# g_run, the G image of that run does the same, and a package counts only when it passes on G.
# The G image must come from a netbsd-g run whose rb-rc has the foreign suite. The rucc and
# target inputs apply as for the kernel, and modules and mixed do not apply.
# With c_only, the c-only job builds the same world again with MKCXX=no (plan 10.5). That turns
# off ATF and kyua too, so the c-only-image job borrows the tests set, ATF and kyua from the RR
# sets (scripts/netbsd/borrow.sh), lists each borrowed path, and boots the image as rr-boot does.
#
# With atf, the rr-atf job runs the ATF shards of the atf job on the RR image, and with c_only
# also on the c-only image. The rr-report job grades them with rb test: RR against GG, the c-only
# image against GG, and the c-only image against RR. GG is the shards of g_run, or of the newest
# netbsd-g run whose counts results/netbsd keeps for the pin. The counts go beside the G counts.
#
# The ref leg of the kernel and the ref build of the world also run rb syntax: every C unit of
# that build, which is G, through the front end of rucc (scripts/netbsd/syntax.sh). shim-ref.sh
# keeps the standard error of G, so the report counts only the diagnostics G did not give.
#
# The bisect input only goes into the title. bisect.yml sets it to its own run, so that a probe
# run of a bisection does not count as a nightly run.

name: netbsd-r

# The title names the build, the rucc commit and the G run, so that bisect.yml can find the
# nightly runs and the runs it starts itself (bisect=RUN).
run-name: netbsd-r ${{ inputs.build }} ${{ inputs.pin }} rucc=${{ inputs.rucc || 'pin' }} g_run=${{ inputs.g_run || 'none' }}${{ inputs.bisect && format(' bisect={0}', inputs.bisect) || '' }}

# The paths leave out the files that only the image, the boot and the tests use.
on:
  workflow_dispatch:
    inputs:
      pin:
        description: The pin, conf/netbsd/PIN.pin, and so the pin netbsd-PIN of pins.toml
        type: choice
        options: [trunk, "11.1"]
        default: trunk
      build:
        description: What to build, the GENERIC kernel, the world replay, or the RR world, kernel and image
        type: choice
        options: [kernel, world, rr]
        default: kernel
      rucc:
        description: A branch or commit of tamnd/rucc to build instead of the rucc pin of toolchains.toml
        required: false
        default: ""
      target:
        description: The --target the shims give rucc, or empty for x86_64--netbsd
        required: false
        default: ""
      g_run:
        description: A netbsd-g run of the same pin whose sets to boot the rucc kernel with, or empty for the kernel only
        required: false
        default: ""
      atf:
        description: Run the ATF shards after the smoke boot, when g_run is given or build=rr
        type: boolean
        default: true
      modules:
        description: Build the kernel modules with rucc and run rb cross-modules, when g_run is given
        type: boolean
        default: false
      mixed:
        description: An ATF case, DIR/PROGRAM:CASE, for rb mixed to find the rucc object that makes it fail, when g_run is given
        required: false
        default: ""
      c_only:
        description: Also build the c-only row (MKCXX=no) and boot it with the tests set, ATF and kyua of the RR sets, when build=rr
        type: boolean
        default: false
      bisect:
        description: The bisect.yml run that started this run as a probe, or empty. It only goes into the title
        required: false
        default: ""

# A manual run is its own group, so that a push to the branch does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

# actions: read lets the image job download the sets of another run.
permissions:
  contents: read
  actions: read

env:
  NB_ROOT: /mnt/nb
  # The pin of the run. scripts/netbsd/common.sh reads NB_PIN_FILE, and rb takes RB_PIN. The tools
  # cache and the control artifact are keyed by the pin file. The sets, images and results of a
  # pin other than trunk carry NB_PIN_TAG in their names, so a run of another pin cannot give them.
  NB_PIN_FILE: ${{ inputs.pin || 'trunk' }}.pin
  RB_PIN: netbsd-${{ inputs.pin || 'trunk' }}
  NB_PIN_TAG: ${{ (inputs.pin || 'trunk') != 'trunk' && format('-{0}', inputs.pin) || '' }}

jobs:
  tools:
    name: build.sh tools
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache@v6.1.0
        id: tools
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles(format('conf/netbsd/{0}', env.NB_PIN_FILE), 'scripts/netbsd/common.sh') }}
          lookup-only: true
      - name: host packages
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          scripts/ci/apt-install.sh zlib1g-dev
      - name: fetch the pinned tree
        if: steps.tools.outputs.cache-hit != 'true'
        run: scripts/netbsd/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: build.sh tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: scripts/netbsd/phase.sh tools tools

  kernel:
    name: GENERIC kernel with ${{ matrix.cc }}
    needs: [tools, rb]
    if: inputs.build == 'kernel'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    continue-on-error: ${{ matrix.cc == 'rucc' }}
    strategy:
      fail-fast: false
      matrix:
        cc: [ref, rucc]
    env:
      CC_NAME: ${{ matrix.cc }}
      RB_RUCC_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles(format('conf/netbsd/{0}', env.NB_PIN_FILE), 'scripts/netbsd/common.sh') }}
          fail-on-cache-miss: true
      - name: host packages
        run: |
          scripts/ci/apt-install.sh zlib1g-dev
      - name: fetch the pinned tree
        run: scripts/netbsd/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      # The ref leg needs rucc too, for rb syntax.
      - name: rucc ${{ inputs.rucc || 'of toolchains.toml' }}
        run: scripts/netbsd/rucc.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.rucc }}
      - name: the R TOOLDIR
        run: |
          scripts/netbsd/overlay.sh "$CC_NAME"
          gcc="$NB_ROOT/tools-r/bin/x86_64--netbsd-gcc"
          {
            echo "### The C compiler slot"
            echo
            echo '```'
            RB_SHIM_LOG="" "$gcc" --version 2>&1 | head -5 || true
            echo 'int main(void) { return __NetBSD__ + __GNUC__; }' > "$RUNNER_TEMP/probe.c"
            RB_SHIM_LOG="" "$gcc" -c -o "$RUNNER_TEMP/probe.o" "$RUNNER_TEMP/probe.c" 2>&1 | head -10 \
              && echo "probe: a NetBSD object compiled" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: build.sh kernel=GENERIC
        id: kernel
        run: NB_TOOLDIR="$NB_ROOT/tools-r" NB_NOISE=2 scripts/netbsd/phase.sh "kernel-$CC_NAME" -u kernel=GENERIC
      - name: make -k in the kernel's object directory
        if: failure() && steps.kernel.outcome == 'failure'
        run: |
          dir="$NB_ROOT/obj/sys/arch/amd64/compile/GENERIC"
          if [ -f "$dir/Makefile" ]; then
            NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh "kernel-$CC_NAME-k" -- \
              "$NB_ROOT/tools-r/bin/nbmake-amd64" -k -j "$(nproc)" -C "$dir" || true
          fi
      # A link whose nbctfmerge failed leaves netbsd as the plain ld output. This finds why and
      # does the steps after nbctfmerge, so the kernel can still be booted.
      - name: nbctfmerge after the link
        if: always() && matrix.cc == 'rucc'
        run: |
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/ctfmerge-check.sh GENERIC \
            "$NB_ROOT/logs/kernel-$CC_NAME.log" >> "$GITHUB_STEP_SUMMARY"
      - name: summary
        if: always()
        run: |
          kernel="$NB_ROOT/obj/sys/arch/amd64/compile/GENERIC/netbsd"
          {
            echo "### GENERIC kernel with $CC_NAME"
            echo
            if [ -f "$NB_ROOT/logs/phases.tsv" ]; then scripts/netbsd/summary.sh "$NB_ROOT/logs/phases.tsv"; fi
            echo
            if [ -f "$kernel" ]; then
              echo "The kernel linked: \`netbsd\`, $(stat -c %s "$kernel") bytes."
              echo
              echo '```'
              "$NB_ROOT/tools/bin/x86_64--netbsd-size" "$kernel"
              echo '```'
            else
              echo "No kernel linked."
            fi
            echo
            scripts/netbsd/r-report.sh "$NB_ROOT/logs/kernel-$CC_NAME.log" "$NB_ROOT/logs/kernel-$CC_NAME-k.log"
          } >> "$GITHUB_STEP_SUMMARY"
      # Each leg keeps its objects, the .su files of -fstack-usage and a compile.jsonl made from the
      # shim log, with /mnt/nb/obj moved to /mnt/cmp/LEG/obj, so that the compare job can unpack
      # both legs side by side.
      - name: the objects and the compile log for rb
        if: always()
        run: |
          out="$NB_ROOT/cmp"
          mkdir -p "$out"
          side=G
          if [ "$CC_NAME" = rucc ]; then side=R; fi
          python3 scripts/netbsd/shim-records.py "$NB_ROOT/logs/shim.tsv" "$side" \
            "$NB_ROOT/obj" "/mnt/cmp/$CC_NAME/obj" > "$out/compile.jsonl"
          (cd "$NB_ROOT" && find obj/sys/arch/amd64/compile/GENERIC \( -name '*.o' -o -name '*.su' \) \
            -print0 | tar --null -T - -cf - | xz -T0 > "$out/objects.tar.xz")
          ls -l "$out"
      # rb mk-diff needs both TOOLDIRs and the kernel's build directory, so it runs in the rucc
      # leg. RB_SHIM_LOG is empty so that its probes stay out of shim.tsv. rb syntax runs in the
      # ref leg.
      - uses: actions/download-artifact@v8.0.1
        if: always()
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: rb mk-diff
        if: always() && matrix.cc == 'rucc'
        run: |
          rb="$RUNNER_TEMP/rb/rb"
          chmod +x "$rb"
          out="$NB_ROOT/cmp"
          kernel="$NB_ROOT/obj/sys/arch/amd64/compile/GENERIC"
          args=()
          if [ -f "$kernel/Makefile" ]; then args=(--kernel "$kernel"); fi
          "$rb" mk-diff "$RB_PIN" --g "$NB_ROOT/tools" --r "$NB_ROOT/tools-r" --src "$NB_ROOT/src" \
            "${args[@]}" --work "$out/mk-diff" > "$out/mk-diff.txt" 2>&1 \
            || echo "rb mk-diff exited $?" >> "$out/mk-diff.txt"
          { echo "### rb mk-diff"; echo; echo '```'; head -3 "$out/mk-diff.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          RB_SHIM_LOG: ""
      # Every C unit of the ref leg, which is G, through the front end of rucc (scripts/netbsd/syntax.sh).
      - name: rb syntax over the ref kernel
        if: always() && matrix.cc == 'ref' && steps.kernel.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        run: |
          chmod +x "$RUNNER_TEMP/rb/rb"
          scripts/netbsd/syntax.sh "$RUNNER_TEMP/rb/rb" kernel
          { echo "### rb syntax over the ref kernel"; echo; echo '```'; head -60 "$NB_ROOT/logs/syntax-kernel.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-objects-${{ matrix.cc }}
          path: /mnt/nb/cmp
          if-no-files-found: ignore
          retention-days: 7
      - name: the kern-GENERIC set from the rucc kernel
        if: always() && matrix.cc == 'rucc' && inputs.g_run != ''
        run: |
          kernel="$NB_ROOT/obj/sys/arch/amd64/compile/GENERIC/netbsd"
          if [ ! -f "$kernel" ]; then
            echo "No kernel linked, so there is no set to boot."
            exit 0
          fi
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/kernset.sh GENERIC
          mkdir -p "$NB_ROOT/r-kernel"
          cp "$NB_ROOT"/release/amd64/binary/sets/kern-GENERIC.* "$kernel" "$NB_ROOT/r-kernel/"
      - name: build.sh kernel=RB-TEST
        if: matrix.cc == 'rucc' && inputs.g_run != '' && steps.kernel.outcome == 'success'
        run: |
          conf="$GITHUB_WORKSPACE/conf/netbsd/kernel/RB-TEST"
          NB_TOOLDIR="$NB_ROOT/tools-r" NB_NOISE=2 scripts/netbsd/phase.sh "kernel-$CC_NAME-rb-test" -u "kernel=$conf"
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/kernset.sh "$conf"
          cp "$NB_ROOT"/release/amd64/binary/sets/kern-RB-TEST.* "$NB_ROOT/r-kernel/"
          cp "$NB_ROOT/obj/sys/arch/amd64/compile/RB-TEST/netbsd" "$NB_ROOT/r-kernel/netbsd-RB-TEST"
      # The kernel modules with rucc, for rb cross-modules. When build.sh stops at a failed module,
      # "make -k" goes on with the others, and the tree comes from the object directory.
      - name: build.sh modules
        id: modules
        if: matrix.cc == 'rucc' && inputs.g_run != '' && inputs.modules && steps.kernel.outcome == 'success'
        run: NB_TOOLDIR="$NB_ROOT/tools-r" NB_NOISE=2 scripts/netbsd/phase.sh "modules-$CC_NAME" -u modules
      - name: make -k in sys/modules
        if: failure() && steps.modules.outcome == 'failure'
        run: |
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh "modules-$CC_NAME-k" -- \
            "$NB_ROOT/tools-r/bin/nbmake-amd64" -k -j "$(nproc)" -C "$NB_ROOT/src/sys/modules" dependall || true
      - name: the modules tree
        if: always() && (steps.modules.outcome == 'success' || steps.modules.outcome == 'failure')
        run: |
          out="$NB_ROOT/r-modules/modules"
          mkdir -p "$out"
          from=$(find "$NB_ROOT/destdir/stand" -mindepth 3 -maxdepth 3 -type d -name modules 2>/dev/null | head -1)
          if [ "$MODULES" = success ] && [ -n "$from" ]; then
            cp -R "$from/." "$out/"
          else
            from="$NB_ROOT/obj/sys/modules"
            find "$from" -name '*.kmod' | while read -r f; do
              n=$(basename "$f" .kmod)
              mkdir -p "$out/$n"
              cp "$f" "$out/$n/"
            done
          fi
          tar -C "$NB_ROOT/r-modules" -cJf "$NB_ROOT/r-modules.tar.xz" modules
          {
            echo "### The kernel modules with rucc"
            echo
            echo "build.sh modules: $MODULES. $(find "$out" -name '*.kmod' | wc -l) modules from $from."
            echo
            logs=("$NB_ROOT/logs/modules-$CC_NAME.log")
            if [ -f "$NB_ROOT/logs/modules-$CC_NAME-k.log" ]; then logs+=("$NB_ROOT/logs/modules-$CC_NAME-k.log"); fi
            scripts/netbsd/r-report.sh "${logs[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MODULES: ${{ steps.modules.outcome }}
      - uses: actions/upload-artifact@v7.0.1
        if: always() && (steps.modules.outcome == 'success' || steps.modules.outcome == 'failure')
        with:
          name: netbsd-r-modules
          path: /mnt/nb/r-modules.tar.xz
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.1
        if: always() && matrix.cc == 'rucc' && inputs.g_run != ''
        with:
          name: netbsd-r-kernel
          path: /mnt/nb/r-kernel
          if-no-files-found: ignore
          retention-days: 14
      - name: compress the logs
        if: always()
        run: |
          if [ -d "$NB_ROOT/logs/shim.tsv.err" ]; then
            tar -cf - -C "$NB_ROOT/logs" shim.tsv.err | xz -T0 > "$NB_ROOT/logs/shim-stderr.tar.xz"
            rm -rf "$NB_ROOT/logs/shim.tsv.err"
          fi
          xz -T0 "$NB_ROOT"/logs/*.log "$NB_ROOT"/logs/*.jsonl "$NB_ROOT"/logs/shim.tsv 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-logs-kernel-${{ matrix.cc }}
          path: /mnt/nb/logs
          retention-days: 14

  world:
    name: world with rucc
    needs: [tools, rb]
    if: inputs.build == 'world'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      RB_RUCC_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles(format('conf/netbsd/{0}', env.NB_PIN_FILE), 'scripts/netbsd/common.sh') }}
          fail-on-cache-miss: true
      - name: host packages
        run: |
          scripts/ci/apt-install.sh zlib1g-dev
      - name: fetch the pinned tree
        run: scripts/netbsd/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: rucc ${{ inputs.rucc || 'of toolchains.toml' }}
        run: scripts/netbsd/rucc.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.rucc }}
      # The control depends only on the tools, the pinned tree and the scripts that build and keep
      # it. A run that built it keeps it as an artifact named by the hash of those scripts
      # (scripts/netbsd/control.sh), and a later run restores it in place of the build.
      - name: the control of an earlier run
        id: control
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=10" \
            -q '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then
            echo "The control build is that of run $run, from the artifact $NAME." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: netbsd-r-control-amd64-${{ hashFiles(format('conf/netbsd/{0}', env.NB_PIN_FILE), 'conf/netbsd/toolchain/shim-ref.sh', 'scripts/netbsd/common.sh', 'scripts/netbsd/fetch.sh', 'scripts/netbsd/overlay.sh', 'scripts/netbsd/control.sh', 'scripts/netbsd/stand.sh') }}
      - uses: actions/download-artifact@v8.0.1
        if: steps.control.outputs.run != ''
        with:
          name: ${{ steps.control.outputs.name }}
          path: /mnt/nb/control
          run-id: ${{ steps.control.outputs.run }}
          github-token: ${{ github.token }}
      - name: restore the control
        id: restore
        if: steps.control.outputs.run != ''
        run: |
          scripts/netbsd/control.sh restore "$NB_ROOT/control/control.tar.zst"
          rm -rf "$NB_ROOT/control"
      - name: build.sh distribution with ref, the control
        id: ref
        if: steps.control.outputs.run == ''
        run: |
          scripts/netbsd/overlay.sh ref
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh distribution-ref -u distribution
          scripts/netbsd/control.sh save "$NB_ROOT/control/control.tar.zst"
      - uses: actions/upload-artifact@v7.0.1
        if: steps.ref.outcome == 'success'
        with:
          name: ${{ steps.control.outputs.name }}
          path: /mnt/nb/control/control.tar.zst
          compression-level: 0
          retention-days: 30
      - name: remove the kept control
        if: steps.ref.outcome == 'success'
        run: rm -rf "$NB_ROOT/control"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      # Every C unit of the ref build, which is G, through the front end of rucc
      # (scripts/netbsd/syntax.sh).
      - name: rb syntax over the ref build
        continue-on-error: true
        timeout-minutes: 90
        run: |
          chmod +x "$RUNNER_TEMP/rb/rb"
          scripts/netbsd/syntax.sh "$RUNNER_TEMP/rb/rb" world
          { echo "### rb syntax over the ref build"; echo; echo '```'; head -60 "$NB_ROOT/logs/syntax-world.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: compile every unit of the ref build with rucc
        # A unit stops after 300 s. The step stops after its limit, and the steps after it still run.
        timeout-minutes: 220
        continue-on-error: true
        run: NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh replay -- scripts/netbsd/world-replay.sh rucc
      - name: the result of the replay
        if: always()
        run: |
          units=$(awk 'NR == 1 { print $1 }' "$NB_ROOT/logs/replay.txt" 2>/dev/null || true)
          {
            if [ -f "$NB_ROOT/logs/phases.tsv" ]; then scripts/netbsd/summary.sh "$NB_ROOT/logs/phases.tsv"; fi
            echo
            python3 -I scripts/netbsd/replay-report.py "${units:-0}" "$NB_ROOT/logs/shim.tsv" \
              "$NB_ROOT/logs/replay-timeouts.txt" "$NB_ROOT/logs/replay-failed.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
          # The standard error of each failed unit, for the causes the summary leaves out.
          if [ -s "$NB_ROOT/logs/replay-failed.tsv" ]; then
            cut -f5 "$NB_ROOT/logs/replay-failed.tsv" | tar -T - -cf - 2>/dev/null \
              | xz -T0 > "$NB_ROOT/logs/replay-errors.tar.xz" || true
          fi
      - name: the boot code with rucc
        if: always() && (steps.ref.outcome == 'success' || steps.restore.outcome == 'success')
        continue-on-error: true
        run: NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/stand.sh >> "$GITHUB_STEP_SUMMARY"
      - name: compress the logs
        if: always()
        run: |
          rm -f "$NB_ROOT"/logs/compile-ref.jsonl
          xz -T0 "$NB_ROOT"/logs/*.log "$NB_ROOT"/logs/*.tsv "$NB_ROOT"/logs/*.jsonl 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-logs-world
          path: /mnt/nb/logs
          retention-days: 14

  # build=rr: the RR world, see the top of the file. RB_SHIM_REF names the directories whose calls
  # still go to the reference. The first two are Objective-C, which rucc does not compile, and each
  # other is for an open rucc issue:
  #   external/gpl3/gcc/lib/libobjc  the Makefile runs cc1obj and the sources include .m files;
  #   tests/lib/libobjc              t_threads.m, the ATF test of libobjc, is Objective-C;
  #   tests/lib/libc/misc            t_ubsan.c asks for -fsanitize=undefined (tamnd/rucc#4391);
  #   sys/arch/i386/stand/bootxx     each bootxx program is over its size limit (tamnd/rucc#4097);
  #   sys/arch/i386/stand/dosboot    the link of dosboot.com fails with R_386_16 (tamnd/rucc#4498).
  rr:
    name: distribution, kernel and sets with rucc
    needs: [tools, rb]
    if: inputs.build == 'rr'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      image: ${{ steps.image.outcome }}
      sets: ${{ steps.sets.outcome }}
    env:
      RB_RUCC_TARGET: ${{ inputs.target }}
      RB_SHIM_REF: external/gpl3/gcc/lib/libobjc,tests/lib/libobjc,tests/lib/libc/misc,sys/arch/i386/stand/bootxx,sys/arch/i386/stand/dosboot
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles(format('conf/netbsd/{0}', env.NB_PIN_FILE), 'scripts/netbsd/common.sh') }}
          fail-on-cache-miss: true
      - name: host packages
        run: |
          scripts/ci/apt-install.sh zlib1g-dev
      - name: fetch the pinned tree
        run: scripts/netbsd/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: rucc ${{ inputs.rucc || 'of toolchains.toml' }}
        run: scripts/netbsd/rucc.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.rucc }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: the R TOOLDIR
        run: |
          chmod +x "$RUNNER_TEMP/rb/rb"
          scripts/netbsd/overlay.sh rucc
      - name: build.sh distribution with rucc
        id: distribution
        run: NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh distribution-rucc -u distribution
      - name: build.sh kernel=GENERIC with rucc
        id: kernel
        run: |
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh kernel-rucc -u kernel=GENERIC
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh releasekernel-rucc -u releasekernel=GENERIC
      - name: build.sh sets
        id: sets
        run: |
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh sets-rucc -u sets
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh kernset -- scripts/netbsd/kernset.sh GENERIC
          tar -C "$NB_ROOT/destdir" -cf "$NB_ROOT/release/destdir-meta.tar" METALOG etc/mtree
      - uses: actions/upload-artifact@v7.0.1
        if: steps.sets.outcome == 'success'
        with:
          name: netbsd-r-amd64-sets-rr${{ env.NB_PIN_TAG }}
          path: |
            /mnt/nb/release/amd64/binary
            /mnt/nb/release/destdir-meta.tar
          compression-level: 0
          retention-days: 7
      - name: the result of the build
        if: always()
        run: |
          shim="$NB_ROOT/logs/shim.tsv"
          touch "$shim"
          {
            echo "### distribution, kernel and sets with rucc"
            echo
            if [ -f "$NB_ROOT/logs/phases.tsv" ]; then scripts/netbsd/summary.sh "$NB_ROOT/logs/phases.tsv"; fi
            echo
            echo "rucc ran $(awk -F '\t' '$3 == "cc"' "$shim" | wc -l) calls of the C compiler slot." \
              "The reference ran $(awk -F '\t' '$3 == "cc-ref"' "$shim" | wc -l) calls in the directories of RB_SHIM_REF, \`$RB_SHIM_REF\`."
            if [ "$DISTRIBUTION" = failure ]; then
              echo
              scripts/netbsd/r-report.sh "$NB_ROOT/logs/distribution-rucc.log"
            elif [ "$KERNEL" = failure ]; then
              echo
              scripts/netbsd/r-report.sh "$NB_ROOT/logs/kernel-rucc.log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DISTRIBUTION: ${{ steps.distribution.outcome }}
          KERNEL: ${{ steps.kernel.outcome }}
      # rb census over the records of the shim log: which compiler made each object of the RR build.
      # An object of the object tree that no record wrote is "other": the C++ slot, which is not
      # shimmed, the host tools of the build, ld -r and objcopy.
      - name: rb census of the RR build
        if: always() && steps.distribution.outcome != 'skipped'
        continue-on-error: true
        run: |
          logs="$NB_ROOT/logs"
          touch "$logs/shim.tsv"
          python3 -I scripts/netbsd/shim-records.py "$logs/shim.tsv" R "$NB_ROOT/obj" "$NB_ROOT/obj" \
            > "$RUNNER_TEMP/compile.jsonl"
          status=0
          "$RUNNER_TEMP/rb/rb" census "$RUNNER_TEMP/compile.jsonl" --objdir "$NB_ROOT/obj" \
            --skip "$NB_ROOT/obj/tools" --objects "$logs/census-objects.tsv" > "$logs/census.txt" 2>&1 || status=$?
          {
            echo "### rb census of the RR build"
            echo
            head -60 "$logs/census.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: rb image
        id: image
        if: steps.sets.outcome == 'success'
        run: |
          scripts/netbsd/phase.sh image -- "$RUNNER_TEMP/rb/rb" image --build "$NB_ROOT/tools" \
            --out "$NB_ROOT/netbsd-amd64-serial.img" --work "$NB_ROOT/image-work"
          cp "$NB_ROOT"/image-work/logs/* "$NB_ROOT/logs/" 2>/dev/null || true
          rm -rf "$NB_ROOT/image-work"
          gzip -1 "$NB_ROOT/netbsd-amd64-serial.img"
          sha256sum "$NB_ROOT/netbsd-amd64-serial.img.gz" | tee "$NB_ROOT/logs/images.sha256"
      - uses: actions/upload-artifact@v7.0.1
        if: steps.image.outcome == 'success'
        with:
          name: netbsd-r-amd64-serial-image-rr${{ env.NB_PIN_TAG }}
          path: /mnt/nb/netbsd-amd64-serial.img.gz
          compression-level: 0
          retention-days: 7
      # The libraries of the R sets against those of the G sets of g_run (scripts/netbsd/libs.sh),
      # the compat -m32 libraries of usr/lib/i386 among them.
      - uses: actions/download-artifact@v8.0.1
        if: steps.sets.outcome == 'success' && inputs.g_run != ''
        with:
          name: netbsd-amd64-sets${{ env.NB_PIN_TAG }}
          path: /mnt/nb/g-sets
          run-id: ${{ inputs.g_run }}
          github-token: ${{ github.token }}
      - name: rb abi-diff of the libraries of G and R
        if: steps.sets.outcome == 'success' && inputs.g_run != ''
        continue-on-error: true
        run: |
          logs="$NB_ROOT/logs"
          g=$(find "$NB_ROOT/g-sets" -type d -name sets | head -1)
          scripts/netbsd/libs.sh "$g" "$NB_ROOT/abi/g" > "$logs/libs-g.txt"
          scripts/netbsd/libs.sh "$NB_ROOT/release/amd64/binary/sets" "$NB_ROOT/abi/r" > "$logs/libs-r.txt"
          status=0
          "$RUNNER_TEMP/rb/rb" abi-diff --g "$NB_ROOT/abi/g" --r "$NB_ROOT/abi/r" --limit 40 \
            > "$logs/abi-diff.txt" 2>&1 || status=$?
          echo "rb abi-diff exited $status" >> "$logs/abi-diff.txt"
          "$RUNNER_TEMP/rb/rb" abi-diff --g "$NB_ROOT/abi/g" --r "$NB_ROOT/abi/r" --limit 100000 \
            > "$logs/abi-diff-all.txt" 2>&1 || true
          {
            echo "### rb abi-diff of the libraries of the G sets of run $G_RUN and of the R sets"
            echo
            echo '```'
            cat "$logs/libs-g.txt" "$logs/libs-r.txt"
            echo
            head -60 "$logs/abi-diff.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          G_RUN: ${{ inputs.g_run }}
      - name: compress the logs
        if: always()
        run: xz -T0 "$NB_ROOT"/logs/*.log "$NB_ROOT"/logs/*.tsv 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-logs-rr
          path: /mnt/nb/logs
          retention-days: 14

  rr-boot:
    name: boot and smoke of the RR image
    needs: [rb, rr]
    if: ${{ !cancelled() && inputs.build == 'rr' && needs.rr.outputs.image == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU and OVMF
        run: |
          scripts/ci/apt-install.sh qemu-system-x86 qemu-utils ovmf
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-r-amd64-serial-image-rr${{ env.NB_PIN_TAG }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: rb boot
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/rb/rb"
          gzip -d "$RUNNER_TEMP/netbsd-amd64-serial.img.gz"
          truncate -s 12G "$RUNNER_TEMP/netbsd-amd64-serial.img"
          status=0
          "$RUNNER_TEMP/rb/rb" boot --image "$RUNNER_TEMP/netbsd-amd64-serial.img" \
            --out "$RUNNER_TEMP/boot/seabios" --firmware seabios --suite boot \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          "$RUNNER_TEMP/rb/rb" boot --image "$RUNNER_TEMP/netbsd-amd64-serial.img" \
            --out "$RUNNER_TEMP/boot/ovmf" --suite boot,smoke \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"
      - name: summary
        if: always()
        run: |
          {
            echo "### boot and smoke of the RR image: the console's RB- lines"
            echo
            echo '```'
            grep -a '^RB-' "$RUNNER_TEMP"/boot/*/console.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-boot-smoke-rr
          path: ${{ runner.temp }}/boot
          retention-days: 14

  # rb foreign (plan 12.8): the pkgsrc packages of conf/netbsd/foreign.toml, which GCC built, on
  # the RR image, each with its check. With g_run, the G image of that run runs them too, and a
  # package that fails on RR counts only when it passes on G.
  rr-foreign:
    name: rb foreign on the RR image
    needs: [rb, rr]
    if: ${{ !cancelled() && inputs.build == 'rr' && needs.rr.outputs.image == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU and OVMF
        run: |
          scripts/ci/apt-install.sh qemu-system-x86 qemu-utils ovmf
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-r-amd64-serial-image-rr${{ env.NB_PIN_TAG }}
          path: ${{ runner.temp }}/r
      - uses: actions/download-artifact@v8.0.1
        if: inputs.g_run != ''
        with:
          name: netbsd-amd64-serial-image${{ env.NB_PIN_TAG }}
          path: ${{ runner.temp }}/g
          run-id: ${{ inputs.g_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: rb foreign
        run: |
          set -o pipefail
          rb="$RUNNER_TEMP/rb/rb"
          chmod +x "$rb"
          "$rb" foreign --conf conf/netbsd/foreign.toml --out "$RUNNER_TEMP/pkgs" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          g=()
          for side in r g; do
            img="$RUNNER_TEMP/$side/netbsd-amd64-serial.img"
            [ -f "$img.gz" ] || continue
            gzip -d "$img.gz"
            truncate -s 12G "$img"
            "$rb" boot --image "$img" --out "$RUNNER_TEMP/boot/$side" --suite foreign \
              --pkgs "$RUNNER_TEMP/pkgs" | tee -a "$GITHUB_STEP_SUMMARY" || true
            rm -f "$img"
          done
          if [ -f "$RUNNER_TEMP/boot/g/results/foreign/foreign.tsv" ]; then
            g=(--g "$RUNNER_TEMP/boot/g")
          fi
          {
            echo '```'
            "$rb" foreign --r "$RUNNER_TEMP/boot/r" "${g[@]}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-foreign-rr
          path: |
            ${{ runner.temp }}/boot/*/console.log
            ${{ runner.temp }}/boot/*/boot.json
            ${{ runner.temp }}/boot/*/results
          retention-days: 14

  # The c-only row (plan 10.5): the RR build again with MKCXX=no, which also turns off ATF, kyua,
  # the GCC commands, GDB and groff. The shims and RB_SHIM_REF are those of the rr job.
  # CHECKFLIST_FLAGS=-m lets checkflist pass with files of the flists that MKCXX=no does not
  # install. distrib/sets/lists/comp/md.amd64 gives the two c++config.h of usr/include/g++/bits
  # the tags gcc,compat and no cxx, so a MKCXX=no world misses them. checkflist still lists the
  # missing files in the log.
  c-only:
    name: c-only distribution, kernel and sets with rucc
    needs: [tools, rb]
    if: inputs.build == 'rr' && inputs.c_only
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      RB_RUCC_TARGET: ${{ inputs.target }}
      RB_SHIM_REF: external/gpl3/gcc/lib/libobjc,tests/lib/libobjc,tests/lib/libc/misc,sys/arch/i386/stand/bootxx,sys/arch/i386/stand/dosboot
      NB_VARS: MKCXX=no CHECKFLIST_FLAGS=-m
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles(format('conf/netbsd/{0}', env.NB_PIN_FILE), 'scripts/netbsd/common.sh') }}
          fail-on-cache-miss: true
      - name: host packages
        run: |
          scripts/ci/apt-install.sh zlib1g-dev
      - name: fetch the pinned tree
        run: scripts/netbsd/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: rucc ${{ inputs.rucc || 'of toolchains.toml' }}
        run: scripts/netbsd/rucc.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.rucc }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: the R TOOLDIR
        run: |
          chmod +x "$RUNNER_TEMP/rb/rb"
          scripts/netbsd/overlay.sh rucc
      - name: build.sh distribution with rucc and MKCXX=no
        id: distribution
        run: NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh distribution-c-only -u distribution
      - name: build.sh kernel=GENERIC with rucc
        id: kernel
        run: |
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh kernel-c-only -u kernel=GENERIC
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh releasekernel-c-only -u releasekernel=GENERIC
      - name: build.sh sets
        id: sets
        run: |
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh sets-c-only -u sets
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh kernset -- scripts/netbsd/kernset.sh GENERIC
          tar -C "$NB_ROOT/destdir" -cf "$NB_ROOT/release/destdir-meta.tar" METALOG etc/mtree
      - uses: actions/upload-artifact@v7.0.1
        if: steps.sets.outcome == 'success'
        with:
          name: netbsd-r-amd64-sets-c-only${{ env.NB_PIN_TAG }}
          path: |
            /mnt/nb/release/amd64/binary
            /mnt/nb/release/destdir-meta.tar
          compression-level: 0
          retention-days: 7
      - name: the result of the build
        if: always()
        run: |
          shim="$NB_ROOT/logs/shim.tsv"
          touch "$shim"
          {
            echo "### c-only distribution, kernel and sets with rucc"
            echo
            if [ -f "$NB_ROOT/logs/phases.tsv" ]; then scripts/netbsd/summary.sh "$NB_ROOT/logs/phases.tsv"; fi
            echo
            echo "rucc ran $(awk -F '\t' '$3 == "cc"' "$shim" | wc -l) calls of the C compiler slot." \
              "The reference ran $(awk -F '\t' '$3 == "cc-ref"' "$shim" | wc -l) calls in the directories of RB_SHIM_REF."
            if [ "$DISTRIBUTION" = failure ]; then
              echo
              scripts/netbsd/r-report.sh "$NB_ROOT/logs/distribution-c-only.log"
            elif [ "$KERNEL" = failure ]; then
              echo
              scripts/netbsd/r-report.sh "$NB_ROOT/logs/kernel-c-only.log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DISTRIBUTION: ${{ steps.distribution.outcome }}
          KERNEL: ${{ steps.kernel.outcome }}
      # The share of rucc is largest in this row (plan 10.5), so the census is the number to read.
      - name: rb census of the c-only build
        if: always() && steps.distribution.outcome != 'skipped'
        continue-on-error: true
        run: |
          logs="$NB_ROOT/logs"
          touch "$logs/shim.tsv"
          python3 -I scripts/netbsd/shim-records.py "$logs/shim.tsv" R "$NB_ROOT/obj" "$NB_ROOT/obj" \
            > "$RUNNER_TEMP/compile.jsonl"
          status=0
          "$RUNNER_TEMP/rb/rb" census "$RUNNER_TEMP/compile.jsonl" --objdir "$NB_ROOT/obj" \
            --skip "$NB_ROOT/obj/tools" --objects "$logs/census-objects.tsv" > "$logs/census.txt" 2>&1 || status=$?
          {
            echo "### rb census of the c-only build"
            echo
            head -60 "$logs/census.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: compress the logs
        if: always()
        run: xz -T0 "$NB_ROOT"/logs/*.log "$NB_ROOT"/logs/*.tsv 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-logs-c-only
          path: /mnt/nb/logs
          retention-days: 14

  # The c-only image (plan 10.5): the c-only sets, with the tests set, ATF and kyua borrowed from
  # the sets of the rr job (scripts/netbsd/borrow.sh). The borrowed paths are listed in
  # borrowed.txt of the artifact. The image boots with SeaBIOS, then with OVMF and the smoke suite.
  c-only-image:
    name: c-only image, boot and smoke
    needs: [tools, rb, rr, c-only]
    if: ${{ !cancelled() && inputs.build == 'rr' && inputs.c_only && needs.rr.outputs.sets == 'success' && needs.c-only.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT/logs"
          sudo chown -R "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles(format('conf/netbsd/{0}', env.NB_PIN_FILE), 'scripts/netbsd/common.sh') }}
          fail-on-cache-miss: true
      - name: fetch the pinned tree
        run: scripts/netbsd/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU and OVMF
        run: |
          scripts/ci/apt-install.sh qemu-system-x86 qemu-utils ovmf
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-r-amd64-sets-rr${{ env.NB_PIN_TAG }}
          path: /mnt/nb/rr
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-r-amd64-sets-c-only${{ env.NB_PIN_TAG }}
          path: /mnt/nb/release
      # As in the image job: DESTDIR's metadata, and the object directory of etc, which the
      # live-image target needs.
      - name: borrow the tests set, ATF and kyua of the RR sets
        id: borrow
        run: |
          mkdir -p "$NB_ROOT/destdir"
          tar -C "$NB_ROOT/destdir" -xf "$NB_REL/destdir-meta.tar"
          rm "$NB_REL/destdir-meta.tar"
          "$NB_ROOT/tools/bin/nbmake-amd64" -C "$NB_ROOT/src/etc" obj
          sets=$(scripts/netbsd/borrow.sh "$NB_ROOT/rr/amd64/binary/sets" "$NB_REL/amd64/binary/sets" \
            "$NB_ROOT/logs/borrowed.txt")
          echo "sets=$sets" >> "$GITHUB_OUTPUT"
          {
            echo "### c-only image"
            echo
            echo "The live image has the sets \`$sets\`. It borrows" \
              "$(grep -c '^tests' "$NB_ROOT/logs/borrowed.txt") paths of the tests set and" \
              "$(grep -c '^base' "$NB_ROOT/logs/borrowed.txt") of the base set of the RR build."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NB_REL: /mnt/nb/release
      - name: rb image
        run: |
          chmod +x "$RUNNER_TEMP/rb/rb"
          SETS="$SETS" scripts/netbsd/phase.sh image-c-only -- "$RUNNER_TEMP/rb/rb" image --build "$NB_ROOT/tools" \
            --out "$NB_ROOT/netbsd-amd64-serial.img" --work "$NB_ROOT/image-work"
          cp "$NB_ROOT"/image-work/logs/* "$NB_ROOT/logs/" 2>/dev/null || true
          rm -rf "$NB_ROOT/image-work" "$NB_ROOT/rr"
          # The boot below writes to the image, so the ATF shards of rr-atf get a copy of it from
          # before the boot.
          gzip -1 -k "$NB_ROOT/netbsd-amd64-serial.img"
        env:
          SETS: ${{ steps.borrow.outputs.sets }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: netbsd-r-amd64-serial-image-c-only${{ env.NB_PIN_TAG }}
          path: /mnt/nb/netbsd-amd64-serial.img.gz
          compression-level: 0
          retention-days: 7
      - name: rb boot
        run: |
          set -o pipefail
          img="$NB_ROOT/netbsd-amd64-serial.img"
          truncate -s 12G "$img"
          status=0
          "$RUNNER_TEMP/rb/rb" boot --image "$img" --out "$NB_ROOT/boot/seabios" --firmware seabios \
            --suite boot | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          "$RUNNER_TEMP/rb/rb" boot --image "$img" --out "$NB_ROOT/boot/ovmf" --suite boot,smoke \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"
      - name: summary
        if: always()
        run: |
          {
            echo "### boot and smoke of the c-only image: the console's RB- lines"
            echo
            echo '```'
            grep -a '^RB-' "$NB_ROOT"/boot/*/console.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-c-only-image
          path: |
            /mnt/nb/logs
            /mnt/nb/boot/*/console.log
            /mnt/nb/boot/*/boot.json
            /mnt/nb/boot/*/results
          retention-days: 14

  # ATF on the RR image and, with c_only, on the c-only image (plans 12.6 and 10.5), in the three
  # shards of the atf job. Each shard boots a fresh copy of the image with OVMF, as in the atf
  # job, and a boot that panics in a known NetBSD race is made again. The rr-report job grades
  # the shards.
  rr-atf:
    name: ATF ${{ matrix.shard }} on the ${{ matrix.image }} image
    needs: [rb, rr, c-only-image]
    if: ${{ !cancelled() && inputs.build == 'rr' && inputs.atf && needs.rb.result == 'success' && needs.rr.outputs.image == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.c_only && '["rr","c-only"]' || '["rr"]') }}
        shard: ["only:net", "only:lib", "except:net,lib"]
        include:
          - shard: "only:net"
            tests: --tests-only net
          - shard: "only:lib"
            tests: --tests-only lib
          - shard: "except:net,lib"
            tests: --tests-except net,lib
    steps:
      - uses: actions/checkout@v7.0.1
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU and OVMF
        run: |
          scripts/ci/apt-install.sh qemu-system-x86 qemu-utils ovmf
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-r-amd64-serial-image-${{ matrix.image }}${{ env.NB_PIN_TAG }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: shard name
        run: echo "SHARD_NAME=$(echo "$SHARD" | tr ':,' '--')" >> "$GITHUB_ENV"
        env:
          SHARD: ${{ matrix.shard }}
      - name: rb boot with the tests suite
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/rb/rb"
          gzip -d "$RUNNER_TEMP/netbsd-amd64-serial.img.gz"
          truncate -s 12G "$RUNNER_TEMP/netbsd-amd64-serial.img"
          out="$RUNNER_TEMP/atf-$SHARD_NAME"
          boot() {
            # shellcheck disable=SC2086
            "$RUNNER_TEMP/rb/rb" boot --image "$RUNNER_TEMP/netbsd-amd64-serial.img" \
              --out "$out" --suite boot,smoke,tests $TESTS --timeout 18000 \
              | tee -a "$GITHUB_STEP_SUMMARY"
          }
          status=0
          boot || status=$?
          # The races of the atf job (#65 and #170). A boot that panics in one of these ways is made
          # again, at most two more times. Each boot that panicked goes to panic-N in the shard's
          # directory.
          tries=0
          kept=()
          while [ "$status" -ne 0 ] && [ "$tries" -lt 2 ] &&
            issue=$(python3 scripts/netbsd/known-panic.py "$out"); do
            tries=$((tries + 1))
            echo "The boot panicked as in #$issue. It is made again." | tee -a "$GITHUB_STEP_SUMMARY"
            mv "$out" "$out.panic-$tries"
            kept+=("$tries")
            status=0
            boot || status=$?
          done
          for n in "${kept[@]}"; do
            mkdir -p "$out"
            mv "$out.panic-$n" "$out/panic-$n"
          done
          exit "$status"
        env:
          TESTS: ${{ matrix.tests }}
      - name: counts
        if: always()
        run: |
          out="$RUNNER_TEMP/atf-$SHARD_NAME"
          shopt -s nullglob
          tps=("$out"/results/tests/atf/*.tps)
          if [ ${#tps[@]} -gt 0 ]; then
            python3 scripts/netbsd/atf-counts.py count --out "$out/shard.counts" \
              --cases "$out/shard.cases.tsv" --set "shard=$SHARD" "${tps[@]}"
          fi
          {
            echo "### ATF $SHARD on the $IMAGE image"
            echo
            echo '```'
            cat "$out/results/tests/atf/status" "$out/shard.counts" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP"/netbsd-amd64-serial.img
        env:
          SHARD: ${{ matrix.shard }}
          IMAGE: ${{ matrix.image }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-${{ matrix.image }}-atf-${{ env.SHARD_NAME }}${{ env.NB_PIN_TAG }}
          path: ${{ runner.temp }}/atf-${{ env.SHARD_NAME }}
          retention-days: 30

  # The shards of rr-atf, graded with rb test (plan 12.6). GG is the shards of g_run when it has
  # them, else of the newest netbsd-g run whose counts results/netbsd keeps for the pin. RR is
  # graded against GG. The c-only image is graded against GG, and also against RR: a case that RR
  # passes and the c-only image does not is a difference in a c-only file, because the two images
  # have the same test programs (plan 10.5). The counts of each image go beside the G counts.
  rr-report:
    name: report of the RR and c-only ATF shards
    needs: [rb, rr-atf]
    if: ${{ !cancelled() && inputs.build == 'rr' && inputs.atf && needs.rb.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: the G run of GG and the G counts
        id: gg
        run: |
          # shellcheck source=conf/netbsd/trunk.pin
          . "conf/netbsd/$NB_PIN_FILE"
          results="results/netbsd/$NB_PIN_NAME-$NB_PIN_SHORT/amd64"
          shards() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts?per_page=100" \
              --jq '[.artifacts[] | select((.name | startswith("netbsd-atf-")) and (.expired | not))] | length'
          }
          newest=$(find "$results" -name 'g-*.counts' 2>/dev/null | sed 's|.*/g-||; s|\.counts$||' | sort -n | tail -n 1)
          run=
          for r in "$G_RUN" "$newest"; do
            if [ -n "$r" ] && [ "$(shards "$r")" -gt 0 ]; then
              run=$r
              break
            fi
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$newest" ]; then
            echo "counts=$results/g-$newest.counts" >> "$GITHUB_OUTPUT"
          fi
        env:
          G_RUN: ${{ inputs.g_run }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: netbsd-r-rr-atf-*${{ env.NB_PIN_TAG }}
          path: rr-atf
      - uses: actions/download-artifact@v8.0.1
        if: inputs.c_only
        with:
          pattern: netbsd-r-c-only-atf-*${{ env.NB_PIN_TAG }}
          path: c-only-atf
      - uses: actions/download-artifact@v8.0.1
        if: steps.gg.outputs.run != ''
        with:
          pattern: netbsd-atf-*
          path: gg-atf
          run-id: ${{ steps.gg.outputs.run }}
          github-token: ${{ github.token }}
      - name: ATF counts against G
        run: |
          # shellcheck source=conf/netbsd/trunk.pin
          . "conf/netbsd/$NB_PIN_FILE"
          mkdir -p out
          shopt -s nullglob
          {
            echo "### ATF of the RR and c-only images"
            echo
            counts=()
            for image in rr c-only; do
              tps=("$image"-atf/*/results/tests/atf/*.tps)
              if [ ${#tps[@]} -eq 0 ]; then
                echo "There are no ATF results for the $image image."
                echo
                continue
              fi
              name="$NB_PIN_NAME-$NB_PIN_SHORT-amd64-$image-$GITHUB_RUN_ID"
              python3 scripts/netbsd/atf-counts.py count --out "out/$name.counts" \
                --cases "out/$name.cases.tsv" --set "label=$image" --set system=netbsd \
                --set "pin=$NB_PIN_NAME" --set "commit=$NB_PIN_COMMIT" --set row=amd64 --set cc=rucc \
                --set "rucc=$(scripts/netbsd/rucc.sh name)" --set kernel=GENERIC --set "world=$image" \
                --set image=live-image --set host=github-ubuntu-24.04-kvm --set vm=2-vcpu-8g \
                --set "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                --set "date=$(date -u +%Y-%m-%d)" "${tps[@]}" > /dev/null
              awk -F '\t' '$3 == "failed" { print $1 "\t" $2 }' "out/$name.cases.tsv" > "out/$name.failed"
              counts+=("out/$name.counts")
            done
            if [ ${#counts[@]} -eq 0 ]; then
              exit 0
            fi
            if [ -z "$BASE" ]; then
              echo "There are no G counts for $RB_PIN in results/netbsd. The counts:"
              echo
              echo '```'
              cat "${counts[@]}"
              echo '```'
              exit 0
            fi
            echo "G: \`$BASE\`"
            echo
            python3 scripts/netbsd/atf-counts.py compare "$BASE" "${counts[@]}"
            for c in "${counts[@]}"; do
              echo
              echo "Failed on the $(sed -n 's/^label=//p' "$c") image and not in G:"
              echo
              echo '```'
              sort "${c%.counts}.failed" | comm -23 - <(sort "${BASE%.counts}.failed")
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE: ${{ steps.gg.outputs.counts }}
          REF: ${{ inputs.rucc }}
      - name: rb test, RR and c-only against GG, and c-only against RR
        run: |
          chmod +x "$RUNNER_TEMP/rb/rb"
          shopt -s nullglob
          gg=(gg-atf/*/)
          rr=(rr-atf/*/)
          c=(c-only-atf/*/)
          join() { local IFS=+; echo "$*"; }
          # grade TITLE OUT REFERENCE... -- CLAIM...
          grade() {
            local title=$1 out=$2 ref=() claim=()
            shift 2
            while [ "$1" != -- ]; do
              ref+=("$1")
              shift
            done
            shift
            claim=("$@")
            echo "### rb test: $title"
            echo
            if [ ${#ref[@]} -eq 0 ] || [ ${#claim[@]} -eq 0 ]; then
              echo "There are no ATF shards for one of the two (${#ref[@]} and ${#claim[@]})."
              echo
              return
            fi
            "$RUNNER_TEMP/rb/rb" test --gg "$(join "${ref[@]%/}")" --rr "$(join "${claim[@]%/}")" \
              --out "$out" || true
            echo
          }
          {
            echo "GG: the shards of netbsd-g run ${GG_RUN:-(none)}."
            echo
            grade "RR against GG" out/rr-test "${gg[@]}" -- "${rr[@]}"
            if [ "$C_ONLY" = true ]; then
              grade "the c-only image against GG" out/c-only-test "${gg[@]}" -- "${c[@]}"
              grade "the c-only image against RR. A case here is a difference in a c-only file." \
                out/c-only-rr-test "${rr[@]}" -- "${c[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GG_RUN: ${{ steps.gg.outputs.run }}
          C_ONLY: ${{ inputs.c_only }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-rr-results${{ env.NB_PIN_TAG }}
          path: out
          if-no-files-found: ignore
          retention-days: 90

  # The B3 gate: rb build makes the rucc kernel by itself, with its own shim TOOLDIR and checks,
  # and with no RB_BRINGUP. The kernel job above makes the kernel that the other jobs use.
  rb-build:
    name: rb build netbsd-${{ inputs.pin || 'trunk' }} --targets kernel
    needs: [tools]
    if: inputs.build == 'kernel'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles(format('conf/netbsd/{0}', env.NB_PIN_FILE), 'scripts/netbsd/common.sh') }}
          fail-on-cache-miss: true
      - name: host packages
        run: |
          scripts/ci/apt-install.sh zlib1g-dev
      - name: fetch the pinned tree
        run: scripts/netbsd/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo build rb and rb-cc
        run: cargo build --release --locked -p rb --bin rb -p rb-shim --bin rb-cc
      - name: rucc ${{ inputs.rucc || 'of toolchains.toml' }}
        run: scripts/netbsd/rucc.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.rucc }}
      - name: rb build
        run: |
          unset RB_BRINGUP RB_BRINGUP_UNITS
          # The rucc input is not the pinned rucc of toolchains.toml, and rb build refuses it in
          # a graded build. Such a run passes --ungraded and says so.
          ungraded=()
          note="The rucc is the pin of toolchains.toml, $(scripts/netbsd/rucc.sh name)."
          if [ -n "$REF" ]; then
            ungraded=(--ungraded)
            note="The rucc is $REF from source, not the pin, so the build is ungraded."
          fi
          status=0
          target/release/rb build "$RB_PIN" --row amd64 --conf graded --cc rucc "${ungraded[@]}" \
            --root "$NB_ROOT" --targets kernel > "$RUNNER_TEMP/rb-build.md" 2>&1 || status=$?
          {
            echo "### rb build $RB_PIN --row amd64 --conf graded --cc rucc ${ungraded[*]} --targets kernel"
            echo
            echo "Exit status: $status. RB_BRINGUP is not set. $note"
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/rb-build.md"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          REF: ${{ inputs.rucc }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-rb-build
          path: |
            ${{ runner.temp }}/rb-build.md
            /mnt/nb/logs/*.log
            /mnt/nb/logs/phases.tsv
          if-no-files-found: ignore
          retention-days: 7

  rb:
    name: cargo build rb
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo build
        run: cargo build --release --locked -p rb --bin rb
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rb-linux-x86_64
          path: target/release/rb
          retention-days: 7

  # rb flags-diff, sections-diff, symbols-diff, vec-audit and frames of the rucc leg against the
  # ref leg, which is G's compiler through the same shims. The objects of the ref leg are under
  # /mnt/cmp/ref and those of the rucc leg under /mnt/cmp/rucc. sections-diff takes the statics
  # of conf/netbsd/sections-allow.toml as allowed. None of them fails the run.
  compare:
    name: rb compares the rucc kernel with the ref kernel
    needs: [kernel, rb]
    if: always() && inputs.build == 'kernel' && needs.rb.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p /mnt/cmp
          sudo chown "$(id -u):$(id -g)" /mnt/cmp
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-r-objects-ref
          path: /mnt/cmp/ref
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-r-objects-rucc
          path: /mnt/cmp/rucc
      - name: rb flags-diff, sections-diff, symbols-diff, vec-audit and frames
        run: |
          rb="$RUNNER_TEMP/rb/rb"
          chmod +x "$rb"
          for leg in ref rucc; do tar -xJf "/mnt/cmp/$leg/objects.tar.xz" -C "/mnt/cmp/$leg"; done
          out=/mnt/cmp/record
          mkdir -p "$out"
          cp /mnt/cmp/rucc/mk-diff.txt "$out/" 2>/dev/null || true
          g=(--g /mnt/cmp/ref/compile.jsonl --g-root /mnt/cmp/ref)
          r=(--r /mnt/cmp/rucc/compile.jsonl --r-root /mnt/cmp/rucc)
          run() { "$rb" "$@" > "$out/$1.txt" 2>&1 || echo "rb $1 exited $?" >> "$out/$1.txt"; }
          run flags-diff "$RB_PIN" "${g[@]}" "${r[@]}" --paired-only
          # The statics of conf/netbsd/sections-allow.toml are allowed in sections-diff only.
          allow=(--allow conf/netbsd/sections-allow.toml)
          run sections-diff "${g[@]}" "${r[@]}" "${allow[@]}"
          "$rb" sections-diff "${g[@]}" "${r[@]}" "${allow[@]}" --limit 100000 \
            > "$out/sections-diff-all.txt" 2>&1 || true
          run symbols-diff "${g[@]}" "${r[@]}"
          "$rb" symbols-diff "${g[@]}" "${r[@]}" --limit 100000 > "$out/symbols-diff-all.txt" 2>&1 || true
          run vec-audit "${g[@]}" "${r[@]}" --limit 100000
          run frames "${g[@]}" "${r[@]}" --limit 100000 --top 100
          {
            echo "### rb compares the rucc kernel with the ref kernel"
            echo
            echo '```'
            for f in mk-diff flags-diff sections-diff symbols-diff vec-audit frames; do
              if [ -f "$out/$f.txt" ]; then echo "rb $f:"; head -4 "$out/$f.txt"; echo; fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-compare
          path: /mnt/cmp/record
          retention-days: 14

  # G's sets with the rucc kernel in kern-GENERIC, made into the live image as in netbsd-g.yml.
  # The RB-TEST leg puts the rucc RB-TEST kernel in kern-GENERIC.
  image:
    name: ${{ matrix.kernel == 'G' && 'rb image with the G kernel' || format('rb image with the rucc {0} kernel{1}', matrix.kernel, matrix.suffix == '-official' && ' and the official sets' || '') }}
    needs: [rb, kernel]
    # The kernel job fails when any step of build.sh fails, also after the link. The kernel
    # artifact is there when a kernel linked, and the download below fails when it is not.
    if: always() && inputs.build == 'kernel' && inputs.g_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # With modules, a third image keeps G's kernel, for the GG and GR cells of rb cross-modules.
      # With a release pin, the official image has the official sets and the rucc GENERIC kernel.
      matrix:
        include: ${{ fromJSON(format('[{0}{1}{2}]', '{"kernel":"GENERIC","suffix":"","file":"netbsd"},{"kernel":"RB-TEST","suffix":"-RB-TEST","file":"netbsd-RB-TEST"}', inputs.modules && ',{"kernel":"G","suffix":"-G","file":""}' || '', (inputs.pin || 'trunk') != 'trunk' && ',{"kernel":"GENERIC","suffix":"-official","file":"netbsd"}' || '')) }}
    env:
      KERNEL: ${{ matrix.kernel }}
      KERNEL_FILE: ${{ matrix.file }}
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles(format('conf/netbsd/{0}', env.NB_PIN_FILE), 'scripts/netbsd/common.sh') }}
          fail-on-cache-miss: true
      - name: fetch the pinned tree
        run: scripts/netbsd/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.1
        if: matrix.suffix != '-official'
        with:
          name: netbsd-amd64-sets${{ env.NB_PIN_TAG }}
          path: /mnt/nb/release
          run-id: ${{ inputs.g_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.1
        if: matrix.kernel != 'G'
        with:
          name: netbsd-r-kernel
          path: ${{ runner.temp }}/r-kernel
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: put the sets, the rucc kernel and DESTDIR's metadata in place
        run: |
          mkdir -p "$NB_ROOT/release/amd64" "$NB_ROOT/destdir"
          if [ "$SUFFIX" = -official ]; then
            # The official sets of the release, with kern-GENERIC made from the rucc kernel. The
            # live image takes the spec and the boot code from the sets, so DESTDIR stays empty.
            # SETS names the fetched sets, so that the live image looks for no other set.
            sets=$(scripts/netbsd/official.sh)
            echo "SETS=$sets" >> "$GITHUB_ENV"
            binary="$NB_ROOT/release/amd64/binary"
            scripts/netbsd/kern-into-sets.sh "$binary" "$RUNNER_TEMP/r-kernel/kern-GENERIC.tar.xz"
            {
              echo "### The sets"
              echo
              echo "The official sets of $RB_PIN ($sets), with kern-GENERIC made from the rucc GENERIC kernel."
              echo
              echo '```'
              ls -l "$binary/sets"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            "$NB_ROOT/tools/bin/nbmake-amd64" -C "$NB_ROOT/src/etc" obj
            exit 0
          fi
          if [ -d "$NB_ROOT/release/binary" ]; then mv "$NB_ROOT/release/binary" "$NB_ROOT/release/amd64/"; fi
          tar -C "$NB_ROOT/destdir" -xf "$NB_ROOT/release/destdir-meta.tar"
          rm "$NB_ROOT/release/destdir-meta.tar"
          binary="$NB_ROOT/release/amd64/binary"
          if [ "$KERNEL" = G ]; then
            echo "The sets of G run $G_RUN, with G's kernel." >> "$GITHUB_STEP_SUMMARY"
            "$NB_ROOT/tools/bin/nbmake-amd64" -C "$NB_ROOT/src/etc" obj
            exit 0
          fi
          # The CTF of the rucc kernel against the CTF of G's kernel of the same configuration,
          # with rb ctf-diff (plan 09.6). The full lists go to the logs artifact.
          # Allowed, so not counted:
          # - struct response: two units declare a struct response in a function. ctfmerge keeps
          #   the first it reads, and rucc writes them in another order than gcc (rucc#4385).
          # - store_num: lib/kern/libkern.o is made with ld -r, so its .SUNW_ctf is the CTF of its
          #   first member only, and ctfmerge gives that CTF's one function type to the first
          #   function symbol of libkern.o. G's kernel has the wrong type int (int) for
          #   store_num. With rucc, store_eol of snprintb.c is not inlined and comes first.
          chmod +x "$RUNNER_TEMP/rb/rb"
          {
            echo "### CTF: the rucc $KERNEL kernel against G's"
            echo
            if [ -f "$binary/sets/kern-$KERNEL.tar.xz" ]; then
              tar -xJOf "$binary/sets/kern-$KERNEL.tar.xz" ./netbsd > "$RUNNER_TEMP/g-netbsd"
              "$RUNNER_TEMP/rb/rb" ctf-diff --g "$RUNNER_TEMP/g-netbsd" \
                --r "$RUNNER_TEMP/r-kernel/$KERNEL_FILE" --out "$NB_ROOT/logs/ctf" \
                --allow-types response --allow-symbols store_num || true
              rm "$RUNNER_TEMP/g-netbsd"
            else
              echo "G run $G_RUN has no kern-$KERNEL set."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # The kern-GENERIC set of G is replaced with the set of the rucc kernel.
          scripts/netbsd/kern-into-sets.sh "$binary" "$RUNNER_TEMP/r-kernel/kern-$KERNEL.tar.xz"
          {
            echo "### The sets"
            echo
            echo "The sets of G run $G_RUN, with kern-GENERIC made from the rucc $KERNEL kernel."
            echo
            echo '```'
            ls -l "$binary/sets"
            "$NB_ROOT/tools/bin/x86_64--netbsd-size" "$RUNNER_TEMP/r-kernel/$KERNEL_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The live-image target runs make in etc and in distrib/amd64/liveimage. Their object
          # directories must exist, or make writes into the tree. rb image makes the second.
          "$NB_ROOT/tools/bin/nbmake-amd64" -C "$NB_ROOT/src/etc" obj
        env:
          G_RUN: ${{ inputs.g_run }}
      - name: rb image
        run: |
          chmod +x "$RUNNER_TEMP/rb/rb"
          scripts/netbsd/phase.sh image -- "$RUNNER_TEMP/rb/rb" image --build "$NB_ROOT/tools" \
            --out "$NB_ROOT/netbsd-amd64-serial.img" --work "$NB_ROOT/image-work"
          cp "$NB_ROOT"/image-work/logs/* "$NB_ROOT/logs/" 2>/dev/null || true
          gzip -1 "$NB_ROOT/netbsd-amd64-serial.img"
          sha256sum "$NB_ROOT/netbsd-amd64-serial.img.gz" | tee "$NB_ROOT/logs/images.sha256"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: netbsd-r-amd64-serial-image${{ matrix.suffix }}${{ env.NB_PIN_TAG }}
          path: /mnt/nb/netbsd-amd64-serial.img.gz
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-logs-image${{ matrix.suffix }}
          path: /mnt/nb/logs
          retention-days: 14

  boot:
    name: boot and smoke with the rucc ${{ matrix.kernel }} kernel${{ matrix.suffix == '-official' && ' and the official sets' || '' }}
    needs: [rb, image]
    # Each leg needs only its own image, so a failed image of the other kernel does not skip it.
    if: ${{ !cancelled() && inputs.build == 'kernel' && inputs.g_run != '' && needs.rb.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(format('[{0}{1}]', '{"kernel":"GENERIC","suffix":"","file":"netbsd"},{"kernel":"RB-TEST","suffix":"-RB-TEST","file":"netbsd-RB-TEST"}', (inputs.pin || 'trunk') != 'trunk' && ',{"kernel":"GENERIC","suffix":"-official","file":"netbsd"}' || '')) }}
    env:
      KERNEL: ${{ matrix.kernel }}
      KERNEL_FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU and OVMF
        run: |
          scripts/ci/apt-install.sh qemu-system-x86 qemu-utils ovmf
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-r-amd64-serial-image${{ matrix.suffix }}${{ env.NB_PIN_TAG }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: rb boot
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/rb/rb"
          gzip -d "$RUNNER_TEMP/netbsd-amd64-serial.img.gz"
          truncate -s 12G "$RUNNER_TEMP/netbsd-amd64-serial.img"
          status=0
          "$RUNNER_TEMP/rb/rb" boot --image "$RUNNER_TEMP/netbsd-amd64-serial.img" \
            --out "$RUNNER_TEMP/boot/seabios" --firmware seabios --suite boot \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          "$RUNNER_TEMP/rb/rb" boot --image "$RUNNER_TEMP/netbsd-amd64-serial.img" \
            --out "$RUNNER_TEMP/boot/ovmf" --suite boot,smoke \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"
      # A boot that did not reach rb-rc tells only that the guest reset. This boots once more
      # under TCG with QEMU's interrupt log and names the kernel functions at the last exceptions.
      - uses: actions/download-artifact@v8.0.1
        if: failure()
        with:
          name: netbsd-r-kernel
          path: ${{ runner.temp }}/kernel
      - name: where the kernel stopped
        if: failure()
        run: |
          if grep -qs '"result": "no-ready"' "$RUNNER_TEMP"/boot/*/boot.json; then
            scripts/netbsd/boot-fault.sh "$RUNNER_TEMP/netbsd-amd64-serial.img" \
              "$RUNNER_TEMP/kernel/$KERNEL_FILE" "$RUNNER_TEMP/boot/fault" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: summary
        if: always()
        run: |
          {
            echo "### boot and smoke with the rucc $KERNEL kernel: the console's RB- lines"
            echo
            echo '```'
            grep -a '^RB-' "$RUNNER_TEMP"/boot/*/console.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-boot-smoke${{ matrix.suffix }}
          path: ${{ runner.temp }}/boot
          retention-days: 14

  atf:
    name: ATF ${{ matrix.shard }} with the rucc kernel${{ matrix.sets == 'official' && ' and the official sets' || '' }}
    needs: [rb, image]
    # The shards boot the GENERIC image only, so a failed RB-TEST image does not skip them.
    if: ${{ !cancelled() && inputs.build == 'kernel' && inputs.g_run != '' && inputs.atf && needs.rb.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # sets is g for G's sets, and official for the official sets of a release pin.
      matrix:
        sets: ${{ fromJSON((inputs.pin || 'trunk') != 'trunk' && '["g","official"]' || '["g"]') }}
        shard: ["only:net", "only:lib", "except:net,lib"]
        include:
          - shard: "only:net"
            tests: --tests-only net
          - shard: "only:lib"
            tests: --tests-only lib
          - shard: "except:net,lib"
            tests: --tests-except net,lib
    steps:
      - uses: actions/checkout@v7.0.1
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU and OVMF
        run: |
          scripts/ci/apt-install.sh qemu-system-x86 qemu-utils ovmf
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-r-amd64-serial-image${{ matrix.sets == 'official' && '-official' || '' }}${{ env.NB_PIN_TAG }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: shard name
        run: echo "SHARD_NAME=$(echo "$SHARD" | tr ':,' '--')" >> "$GITHUB_ENV"
        env:
          SHARD: ${{ matrix.shard }}
      - name: rb boot with the tests suite
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/rb/rb"
          gzip -d "$RUNNER_TEMP/netbsd-amd64-serial.img.gz"
          truncate -s 12G "$RUNNER_TEMP/netbsd-amd64-serial.img"
          out="$RUNNER_TEMP/atf-$SHARD_NAME"
          boot() {
            # shellcheck disable=SC2086
            "$RUNNER_TEMP/rb/rb" boot --image "$RUNNER_TEMP/netbsd-amd64-serial.img" \
              --out "$out" --suite boot,smoke,tests $TESTS --timeout 18000 \
              | tee -a "$GITHUB_STEP_SUMMARY"
          }
          status=0
          boot || status=$?
          # Two races in NetBSD can panic the G and the R kernel: the x86_xstate ptrace cases in
          # fpu_lwp_area (#65) and the aio cases in aio_job_mark_complete (#170). They are not
          # rucc differences. A boot that panics in one of these ways is made again, at most two
          # more times. Each boot that panicked goes to panic-N in the shard's directory.
          tries=0
          kept=()
          while [ "$status" -ne 0 ] && [ "$tries" -lt 2 ] &&
            issue=$(python3 scripts/netbsd/known-panic.py "$out"); do
            tries=$((tries + 1))
            echo "The boot panicked as in #$issue. It is made again." | tee -a "$GITHUB_STEP_SUMMARY"
            mv "$out" "$out.panic-$tries"
            kept+=("$tries")
            status=0
            boot || status=$?
          done
          for n in "${kept[@]}"; do
            mkdir -p "$out"
            mv "$out.panic-$n" "$out/panic-$n"
          done
          exit "$status"
        env:
          TESTS: ${{ matrix.tests }}
      - name: counts
        if: always()
        run: |
          out="$RUNNER_TEMP/atf-$SHARD_NAME"
          shopt -s nullglob
          tps=("$out"/results/tests/atf/*.tps)
          if [ ${#tps[@]} -gt 0 ]; then
            python3 scripts/netbsd/atf-counts.py count --out "$out/shard.counts" \
              --cases "$out/shard.cases.tsv" --set "shard=$SHARD" "${tps[@]}"
          fi
          {
            echo "### ATF $SHARD with the rucc kernel and the $SETS sets"
            echo
            echo '```'
            cat "$out/results/tests/atf/status" "$out/shard.counts" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP"/netbsd-amd64-serial.img
        env:
          SHARD: ${{ matrix.shard }}
          SETS: ${{ matrix.sets }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r${{ matrix.sets == 'official' && '-official' || '' }}-atf-${{ env.SHARD_NAME }}
          path: ${{ runner.temp }}/atf-${{ env.SHARD_NAME }}
          retention-days: 30

  # The ATF counts of the rucc kernel against the G counts of the same pin in results/netbsd.
  cross-modules:
    name: rb cross-modules ${{ matrix.cell }}
    needs: [rb, kernel, image]
    # GG needs only the G image, so it runs also when the rucc kernel or modules are missing.
    if: ${{ !cancelled() && inputs.build == 'kernel' && inputs.g_run != '' && inputs.modules && needs.rb.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: GG
            image: -G
          - cell: GR
            image: -G
          - cell: RG
            image: ""
          - cell: RR
            image: ""
    env:
      CELL: ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU and OVMF
        run: |
          scripts/ci/apt-install.sh qemu-system-x86 qemu-utils ovmf
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-r-amd64-serial-image${{ matrix.image }}${{ env.NB_PIN_TAG }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8.0.1
        if: endsWith(matrix.cell, 'R')
        with:
          name: netbsd-r-modules
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      # Each boot has a run limit of 40 minutes, so a module that hangs the kernel costs one boot.
      - name: rb cross-modules
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/rb/rb"
          gzip -d "$RUNNER_TEMP/netbsd-amd64-serial.img.gz"
          truncate -s 12G "$RUNNER_TEMP/netbsd-amd64-serial.img"
          args=()
          if [ -f "$RUNNER_TEMP/r-modules.tar.xz" ]; then
            tar -C "$RUNNER_TEMP" -xJf "$RUNNER_TEMP/r-modules.tar.xz"
            args=(--modules "$RUNNER_TEMP/modules")
          fi
          echo "### rb cross-modules $CELL" >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/rb/rb" cross-modules --image "$RUNNER_TEMP/netbsd-amd64-serial.img" \
            --out "$RUNNER_TEMP/cell-$CELL" --timeout 2400 --attempts 6 --disk-size 2G "${args[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          test -f "$RUNNER_TEMP/cell-$CELL/modules.tsv"
      - name: summary
        if: always()
        run: |
          {
            echo "### rb cross-modules $CELL: the console's RB- lines but RB-CASE"
            echo
            echo '```'
            grep -a '^RB-' "$RUNNER_TEMP"/cell-"$CELL"/boot-*/console.log 2>/dev/null | grep -v RB-CASE
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-cross-modules-${{ matrix.cell }}
          path: ${{ runner.temp }}/cell-${{ matrix.cell }}
          retention-days: 14

  cross-modules-report:
    name: rb cross-modules, the four cells
    needs: [rb, cross-modules]
    if: ${{ !cancelled() && inputs.build == 'kernel' && inputs.g_run != '' && inputs.modules && needs.rb.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: netbsd-r-cross-modules-*
          path: ${{ runner.temp }}/cells
      - name: rb cross-modules --gg
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/rb/rb"
          cells="$RUNNER_TEMP/cells"
          args=()
          for c in RG GR RR; do
            d="$cells/netbsd-r-cross-modules-$c"
            if [ -f "$d/modules.tsv" ]; then args+=("--${c,,}" "$d"); fi
          done
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/rb/rb" cross-modules --gg "$cells/netbsd-r-cross-modules-GG" "${args[@]}" \
            | tee "$RUNNER_TEMP/out/cross-modules.md" >> "$GITHUB_STEP_SUMMARY" || true
          for c in GG GR RG RR; do
            if [ -f "$cells/netbsd-r-cross-modules-$c/modules.tsv" ]; then
              cp "$cells/netbsd-r-cross-modules-$c/modules.tsv" "$RUNNER_TEMP/out/$c.tsv"
            fi
          done
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-cross-modules
          path: ${{ runner.temp }}/out
          retention-days: 14

  # rb mixed over the objects of the two kernel legs. The objects of the ref leg are under
  # /mnt/cmp/ref and those of the rucc leg under /mnt/cmp/rucc, as in the compare job, and the
  # link takes them from /mnt/nb/obj. The CTF of the rucc kernel must have the layout of every
  # named type of G's kernel. response, the struct of sys/dev/ic/tpm.c, is allowed: tpm.c has two
  # structs of that name, and G's CTF and rucc's keep a different one (tamnd/rucc#4385).
  mixed:
    name: rb mixed ${{ inputs.mixed }}
    needs: [rb, kernel]
    if: ${{ !cancelled() && inputs.build == 'kernel' && inputs.g_run != '' && inputs.mixed != '' && needs.rb.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CASE: ${{ inputs.mixed }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT" /mnt/cmp
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT" /mnt/cmp
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-amd64-${{ hashFiles(format('conf/netbsd/{0}', env.NB_PIN_FILE), 'scripts/netbsd/common.sh') }}
          fail-on-cache-miss: true
      - name: host packages, QEMU and OVMF
        run: |
          scripts/ci/apt-install.sh zlib1g-dev qemu-system-x86 qemu-utils ovmf
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: fetch the pinned tree
        run: scripts/netbsd/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: build.sh kernel=GENERIC with the ref TOOLDIR
        run: |
          scripts/netbsd/overlay.sh ref
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh kernel-ref -u kernel=GENERIC > /dev/null
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-r-objects-ref
          path: /mnt/cmp/ref
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-r-objects-rucc
          path: /mnt/cmp/rucc
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-r-kernel
          path: ${{ runner.temp }}/r-kernel
      - uses: actions/download-artifact@v8.0.1
        with:
          name: netbsd-amd64-sets${{ env.NB_PIN_TAG }}
          path: /mnt/nb/release
          run-id: ${{ inputs.g_run }}
          github-token: ${{ github.token }}
      - name: the objects, G's sets and G's kernel
        run: |
          for leg in ref rucc; do tar -xJf "/mnt/cmp/$leg/objects.tar.xz" -C "/mnt/cmp/$leg"; done
          mkdir -p "$NB_ROOT/release/amd64" "$NB_ROOT/destdir"
          if [ -d "$NB_ROOT/release/binary" ]; then mv "$NB_ROOT/release/binary" "$NB_ROOT/release/amd64/"; fi
          tar -C "$NB_ROOT/destdir" -xf "$NB_ROOT/release/destdir-meta.tar"
          rm "$NB_ROOT/release/destdir-meta.tar"
          tar -xJOf "$NB_ROOT/release/amd64/binary/sets/kern-GENERIC.tar.xz" ./netbsd > "$RUNNER_TEMP/g-netbsd"
          "$NB_ROOT/tools/bin/nbmake-amd64" -C "$NB_ROOT/src/etc" obj
      - name: rb mixed
        run: |
          chmod +x "$RB"
          mkdir -p "$OUT"
          status=0
          # rb mixed runs the link and the test with sh -c, which expands their variables.
          # shellcheck disable=SC2016
          "$RB" mixed --g /mnt/cmp/ref/compile.jsonl --g-root /mnt/cmp/ref \
            --r /mnt/cmp/rucc/compile.jsonl --r-root /mnt/cmp/rucc --into "$NB_ROOT" \
            --ctf-g "$RUNNER_TEMP/g-netbsd" --ctf-r "$RUNNER_TEMP/r-kernel/netbsd" --allow-types response \
            --link 'scripts/netbsd/mixed.sh link' --test 'scripts/netbsd/mixed.sh test "$RB" "$OUT" "$CASE" 3' \
            > "$OUT/mixed.md" || status=$?
          { echo "### rb mixed $CASE"; echo; cat "$OUT/mixed.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          RB: ${{ runner.temp }}/rb/rb
          OUT: ${{ runner.temp }}/mixed
      - name: the logs
        if: always()
        run: cp "$NB_ROOT"/logs/mixed-* "$NB_ROOT/logs/phases.tsv" "$RUNNER_TEMP/mixed/" 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-mixed
          path: ${{ runner.temp }}/mixed
          retention-days: 14

  report:
    name: report
    needs: [kernel, image, boot, atf]
    if: always() && inputs.build == 'kernel' && inputs.g_run != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: netbsd-r-atf-*
          path: atf
      - name: ATF counts against G
        run: |
          # shellcheck source=conf/netbsd/trunk.pin
          . "conf/netbsd/$NB_PIN_FILE"
          mkdir -p out
          shopt -s nullglob
          tps=(atf/*/results/tests/atf/*.tps)
          if [ ${#tps[@]} -eq 0 ]; then
            echo "No ATF results." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dirs=$(cat atf/*/results/tests/dirs | tr ' ' '\n' | sed '/^$/d' | sort | tr '\n' ' ')
          name="$NB_PIN_NAME-$NB_PIN_SHORT-amd64-r-$GITHUB_RUN_ID"
          python3 scripts/netbsd/atf-counts.py count --out "out/$name.counts" --cases "out/$name.cases.tsv" \
            --set label=R --set system=netbsd --set "pin=$NB_PIN_NAME" --set "commit=$NB_PIN_COMMIT" \
            --set row=amd64 --set cc=rucc --set "rucc=$(scripts/netbsd/rucc.sh name)" --set kernel=GENERIC \
            --set "world=g-$G_RUN" --set image=live-image --set host=github-ubuntu-24.04-kvm \
            --set vm=2-vcpu-8g --set "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --set "date=$(date -u +%Y-%m-%d)" --set "dirs=$dirs" "${tps[@]}"
          awk -F '\t' '$3 == "failed" { print $1 "\t" $2 }' "out/$name.cases.tsv" > "out/$name.failed"
          # With nullglob, a pin with no G counts gives an empty array, and bash refuses
          # an index into an empty array. So the length is tested first.
          results="results/netbsd/$NB_PIN_NAME-$NB_PIN_SHORT/amd64"
          bases=("$results/"g-*.counts)
          base=
          if [ ${#bases[@]} -gt 0 ]; then
            base=${bases[${#bases[@]}-1]}
          fi
          {
            echo "### ATF: R (the rucc kernel on G's world) against G"
            echo
            echo "Directories run: $dirs"
            echo
            if [ -z "$base" ]; then
              echo "There are no G counts for $RB_PIN in \`$results\`, so this step compares the R counts with nothing."
              echo "The rb test steps below compare the ATF shards of this run with the GG shards of g_run."
              echo
              echo "R counts:"
              echo
              echo '```'
              cat "out/$name.counts"
              echo '```'
              exit 0
            fi
            echo "G: \`$base\`"
            echo
            python3 scripts/netbsd/atf-counts.py compare "$base" "out/$name.counts"
            echo
            echo "Failed here and not in G:"
            echo
            echo '```'
            sort "out/$name.failed" | comm -23 - <(sort "${base%.counts}.failed")
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          G_RUN: ${{ inputs.g_run }}
          REF: ${{ inputs.rucc }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: netbsd-atf-*
          path: g-atf
          run-id: ${{ inputs.g_run }}
          github-token: ${{ github.token }}
      # The 2x2 of plan 12.6 for the cells this run has: GG from G run g_run and RG from the
      # shards above. rb test writes the attribution of each case RG does not pass.
      - name: rb test, RG against GG
        run: |
          chmod +x "$RUNNER_TEMP/rb/rb"
          shopt -s nullglob
          gg=(g-atf/*/)
          rg=(atf/*/)
          {
            echo "### rb test: RG against GG"
            echo
            if [ ${#gg[@]} -eq 0 ] || [ ${#rg[@]} -eq 0 ]; then
              echo "There are no ATF shards for GG (${#gg[@]}) or RG (${#rg[@]})."
              exit 0
            fi
            join() { local IFS=+; echo "$*"; }
            "$RUNNER_TEMP/rb/rb" test --gg "$(join "${gg[@]%/}")" --rg "$(join "${rg[@]%/}")" \
              --out out/test || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8.0.1
        if: (inputs.pin || 'trunk') != 'trunk'
        with:
          pattern: netbsd-r-official-atf-*
          path: official-atf
      # Part 1 of rb foreign (plan 12.8): the official userland of the release on the rucc kernel.
      # It is RG with the official sets for G's world, so a case counts only when GG passes it.
      - name: rb test, the official sets on the rucc kernel against GG
        if: (inputs.pin || 'trunk') != 'trunk'
        run: |
          chmod +x "$RUNNER_TEMP/rb/rb"
          shopt -s nullglob
          gg=(g-atf/*/)
          off=(official-atf/*/)
          {
            echo "### rb test: the official sets of $RB_PIN on the rucc kernel against GG"
            echo
            if [ ${#gg[@]} -eq 0 ] || [ ${#off[@]} -eq 0 ]; then
              echo "There are no ATF shards for GG (${#gg[@]}) or the official sets (${#off[@]})."
              exit 0
            fi
            join() { local IFS=+; echo "$*"; }
            "$RUNNER_TEMP/rb/rb" test --gg "$(join "${gg[@]%/}")" --rg "$(join "${off[@]%/}")" \
              --out out/official-test || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: netbsd-r-results${{ env.NB_PIN_TAG }}
          path: out
          if-no-files-found: ignore
          retention-days: 90
