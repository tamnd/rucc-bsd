# Some kyua cases many times with the G kernel and with the R kernel (milestones B5 and B9), to tell
# a kernel difference from a case that fails only at times.
#
# Both sides boot an image of an earlier run, with the same G world:
#   G  freebsd-image-PIN-graded of the freebsd-g run g_run.
#   R  freebsd-r-image of the freebsd-r run r_run, which took its world from g_run. Its name ends in
#      -PIN unless the pin is 15.1-release.
# Each side boots twice, on two runners, by UEFI with the kyua suite only. scripts/freebsd/boot.sh
# puts the filters and the repeat count into rb.conf, and guest/kyua.sh runs the filters repeat
# times in each boot. The suite scripts come on the rb disk, so an older image runs them too.
#
# The report job puts the table of scripts/freebsd/kyua-repeat.py in the step summary: for each
# case, how many rounds gave each result on each side.

name: freebsd-loop

on:
  workflow_dispatch:
    inputs:
      pin:
        description: The pin of both images, such as 15.1-release or stable-14
        default: 15.1-release
      g_run:
        description: The freebsd-g run whose image to boot
        required: true
      r_run:
        description: A freebsd-r run with the world of g_run, whose image to boot
        required: true
      filters:
        description: kyua filters, separated by spaces, such as sys/netinet6/frag6/frag6_07:frag6_07
        required: true
      repeat:
        description: How many times each boot runs the filters
        default: "10"

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}

# actions: read lets the jobs download the artifacts of the other runs.
permissions:
  contents: read
  actions: read

env:
  RB_ART: ${{ (inputs.pin || '15.1-release') != '15.1-release' && format('-{0}', inputs.pin) || '' }}

jobs:
  boot:
    name: ${{ matrix.side }} kernel, boot ${{ matrix.boot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        side: [G, R]
        boot: [1, 2]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: install QEMU
        run: scripts/ci/apt-install.sh qemu-system-x86 qemu-utils ovmf zstd
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ matrix.side == 'G' && format('freebsd-image-{0}-graded', inputs.pin) || format('freebsd-r-image{0}', env.RB_ART) }}
          path: image
          run-id: ${{ matrix.side == 'G' && inputs.g_run || inputs.r_run }}
          github-token: ${{ github.token }}
      - name: boot by UEFI and run the filters, repeat times
        timeout-minutes: 130
        run: |
          sudo mkdir -p /mnt/rb && sudo chown "$USER" /mnt/rb
          zstd -d -q image/freebsd.img.zst -o /mnt/rb/freebsd.img
          rm -rf image
          status=0
          RB_KYUA_FILTERS="$FILTERS" RB_KYUA_REPEAT="$REPEAT" RB_RUN_LIMIT=7200 \
            scripts/freebsd/boot.sh /mnt/rb/freebsd.img uefi kyua loop || status=$?
          echo "boot.sh exited with $status: $(cat loop/boot.json 2>/dev/null)" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f loop/disk.qcow2 loop/rb.tar
        env:
          FILTERS: ${{ inputs.filters }}
          REPEAT: ${{ inputs.repeat }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: freebsd-loop-${{ matrix.side }}-${{ matrix.boot }}
          path: loop
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: report
    needs: boot
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: freebsd-loop-*
          path: loop
      - name: the results of each case
        run: |
          shopt -s nullglob
          g=(loop/freebsd-loop-G-*)
          r=(loop/freebsd-loop-R-*)
          {
            echo "### $FILTERS, $REPEAT times in each boot (pin $PIN, G run $G_RUN, R run $R_RUN)"
            echo
            python3 -I scripts/freebsd/kyua-repeat.py --side G "${g[@]}" --side R "${r[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          FILTERS: ${{ inputs.filters }}
          REPEAT: ${{ inputs.repeat }}
          PIN: ${{ inputs.pin }}
          G_RUN: ${{ inputs.g_run }}
          R_RUN: ${{ inputs.r_run }}
