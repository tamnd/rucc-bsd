# The TCG cadence of plan 11.5: the aarch64 and riscv64 rows of FreeBSD and NetBSD, under QEMU
# with TCG on the amd64 runner.
#
#   nightly  the boot and smoke suites on each of the four rows, Monday to Saturday. One boot job
#            per row, so the night costs the rb job and four boot jobs.
#   weekly   on Sunday, the full suite of each row, sharded by top-level test directory as in
#            netbsd-baseline.yml. Each shard is one boot with the boot, smoke and tests suites, so
#            Sunday has its boot and smoke too. At most six shards run at a time, so that the
#            weekly run does not take every runner.
#
# The images are the release images of conf/tcg/images.conf, checked by their published digests.
# They have no rb-rc, so rb boot logs in as root at the login prompt (--login) and starts rb-rc from
# the results disk. The row in rows.toml gives the QEMU machine, the CPU, the firmware and the boot
# limit: riscv64 boots for longer than the 1800 s that rb boot gives a TCG boot by default.
#
# The weekly run also builds R for each NetBSD row of the run, at the NetBSD 11.1 pin
# (conf/netbsd/11.1.pin), with the rucc of tamnd/rucc main or of the rucc input. The netbsd-r job
# builds the row's kernel through the shims of scripts/netbsd/overlay.sh, once with the reference
# GCC and once with rucc (scripts/netbsd/r-kernel.sh), and rb compares the two: flags-diff,
# sections-diff and symbols-diff. The rucc leg does not fail the run.
#
# For each FreeBSD row of the run, the freebsd-r job does what the kernel run of freebsd-r.yml does,
# at the FreeBSD 15.1 pin, or at the stable-14 pin for a row of series 14 such as i386, in the
# builder VM under KVM: the row's GENERIC kernel with rucc (make -k) and with the reference, the
# {TARGET_ARCH}-gcc15 package, such as aarch64-gcc15, then every unit of
# the reference build compiled again with rucc (scripts/freebsd/replay.py), and rb's comparison:
# mk-diff, flags-diff, warnings, sections-diff and symbols-diff. Both R jobs use the same commit of
# tamnd/rucc.
#
# The NetBSD kernel is GENERIC64, or GENERIC on i386, and the FreeBSD kernel is GENERIC. The kernel
# input names another configuration of the tree, such as GENERIC_PAE of NetBSD i386.
#
# When the rucc kernel of a row links, its R job puts it into the release image of the row, and the
# r-boot job boots that image to the smoke suite: the R kernel with the G world (plan 12.6). A row
# with no image in conf/tcg/images.conf, such as i386, gets no R image.
# scripts/freebsd/r-image.sh installs the kernel into the root file system, and
# scripts/netbsd/r-image.sh puts it into the EFI system partition.
#
# Each R row also has a world job, beside its kernel job: the world of the row built with the
# reference, the control, then every unit of that build compiled again with rucc. netbsd-r-world
# does what the world job of netbsd-r.yml does, and freebsd-r-world what the world run of
# freebsd-r.yml does. The step summary gives the failed units by cause.
#
# A manual run takes the cadence, the rows, the rucc ref, the kernel, and whether to build the R
# world. The r cadence builds R only.

name: tcg

on:
  schedule:
    - cron: "23 1 * * 1-6"
    - cron: "23 1 * * 0"
  workflow_dispatch:
    inputs:
      cadence:
        description: nightly (boot and smoke), weekly (the full suite, sharded, and R) or r (R only)
        type: choice
        options: [nightly, weekly, r]
        default: nightly
      rows:
        description: The system-row pairs, separated by spaces
        default: freebsd-aarch64 freebsd-riscv64 netbsd-aarch64 netbsd-riscv64
      rucc:
        description: The branch or commit of tamnd/rucc that the weekly R builds use
        default: main
      kernel:
        description: The kernel configuration of the R builds, or empty for the GENERIC of each row
        default: ""
      world:
        description: Build the R world of each row beside its kernel
        type: boolean
        default: true

# One run of each cadence at a time. A scheduled run waits for the one before it, and is not
# cancelled, so the queue holds at most one more.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.schedule }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rb:
    name: cargo build rb
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      r: ${{ steps.plan.outputs.r }}
      any_r: ${{ steps.plan.outputs.any_r }}
      fr: ${{ steps.plan.outputs.fr }}
      any_fr: ${{ steps.plan.outputs.any_fr }}
      images: ${{ steps.plan.outputs.images }}
      any_image: ${{ steps.plan.outputs.any_image }}
      rucc_commit: ${{ steps.rucc.outputs.commit }}
      any_boot: ${{ steps.plan.outputs.any_boot }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: the boots of this run
        id: plan
        env:
          CADENCE: ${{ inputs.cadence || (github.event.schedule == '23 1 * * 0' && 'weekly' || 'nightly') }}
          ROWS: ${{ inputs.rows || 'freebsd-aarch64 freebsd-riscv64 netbsd-aarch64 netbsd-riscv64' }}
          KERNEL: ${{ inputs.kernel }}
          WORLD: ${{ inputs.world }}
        run: |
          python3 -I - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, tomllib
          cadence = os.environ["CADENCE"]
          with open("rows.toml", "rb") as f:
              rows = tomllib.load(f)["row"]
          # The shards of the full suite. Each system's two largest top-level directories are a
          # shard of their own, and the rest is the third.
          shards = {
              "freebsd": [["only", "sys"], ["only", "lib"], ["except", "sys,lib"]],
              "netbsd": [["only", "net"], ["only", "lib"], ["except", "net,lib"]],
          }
          # The GENERIC kernel of each NetBSD machine, and the FreeBSD pin of each series: the pin
          # of conf/freebsd/pins.conf and its name in pins.toml. The i386 row is of stable/14.
          nb_kernels = {"i386": "GENERIC"}
          fb_pins = {"14": ("stable-14", "freebsd-stable-14"), "15": ("15.1-release", "freebsd-15.1")}
          # The rows with a release image in conf/tcg/images.conf. Only they get an R image.
          with open("conf/tcg/images.conf") as f:
              images = {line.split()[0] for line in f if line.strip() and not line.startswith("#")}
          kernel = os.environ["KERNEL"]
          include = []
          r = []
          fr = []
          for name in os.environ["ROWS"].split():
              system, row = name.split("-", 1)
              if cadence in ("weekly", "r") and system == "netbsd":
                  nb = rows[row]["netbsd"]
                  r.append({"name": name, "row": row, "machine": nb["machine"],
                            "arch": nb["machine_arch"], "vars": " ".join(nb.get("make", [])),
                            "kernel": kernel or nb_kernels.get(row, "GENERIC64"),
                            "image": name in images})
              if cadence in ("weekly", "r") and system == "freebsd":
                  fb = rows[row]["freebsd"]
                  # gcc cannot build the arm64 modules: they are -fPIC, and there the "i"
                  # operand of the asm goto of sys/sdt.h is an impossible constraint. gcc cannot
                  # link the i386 modules: they are -fPIC, so a function with a stack protector
                  # calls the hidden __stack_chk_fail_local, which the kernel does not define. So
                  # both builds of the aarch64 and the i386 kernel leave the modules out.
                  pin, pin_name = fb_pins[fb.get("series", ["15"])[0]]
                  fr.append({"name": name, "row": row, "target": fb["target"],
                             "target_arch": fb["target_arch"],
                             "triple": f"{rows[row]['rucc_arch']}-unknown-freebsd15.1",
                             "vars": "NO_MODULES=yes" if row in ("aarch64", "i386") else "",
                             "kernel": kernel or "GENERIC", "pin": pin, "pin_name": pin_name,
                             "image": name in images})
              if cadence == "r":
                  continue
              if cadence == "nightly":
                  include.append({"name": name, "system": system, "row": row,
                                  "shard": "smoke", "suite": "boot,smoke", "tests": "",
                                  "minutes": 150 if row == "riscv64" else 60})
                  continue
              for how, dirs in shards[system]:
                  include.append({"name": name, "system": system, "row": row,
                                  "shard": f"{how}-{dirs.replace(',', '-')}",
                                  "suite": "boot,smoke,tests",
                                  "tests": f"--tests-{how} {dirs}", "minutes": 355})
          matrix = {"include": include}
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps(matrix)}\n")
              out.write(f"r={json.dumps({'include': r})}\n")
              out.write(f"any_r={'true' if r else 'false'}\n")
              out.write(f"fr={json.dumps({'include': fr})}\n")
              out.write(f"any_fr={'true' if fr else 'false'}\n")
              images = [{"name": b["name"], "row": b["row"]} for b in r + fr if b["image"]]
              out.write(f"images={json.dumps({'include': images})}\n")
              out.write(f"any_image={'true' if images else 'false'}\n")
              out.write(f"any_boot={'true' if include else 'false'}\n")
          print(f"### {cadence}: {len(include)} boots, {len(r) + len(fr)} R builds\n")
          for b in include:
              print(f"- {b['name']} {b['shard']}")
          for b in r + fr:
              print(f"- {b['name']} R kernel {b['kernel']}")
          if r + fr and os.environ.get("WORLD", "true") == "false":
              print("\nNo R world: the world input is false.")
          EOF
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo build
        run: cargo build --release --locked -p rb --bin rb
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rb-linux-x86_64
          path: target/release/rb
          retention-days: 7
      - name: the commit of tamnd/rucc
        id: rucc
        if: steps.plan.outputs.any_r == 'true' || steps.plan.outputs.any_fr == 'true'
        env:
          REF: ${{ inputs.rucc || 'main' }}
        run: |
          git clone -q https://github.com/tamnd/rucc "$RUNNER_TEMP/rucc-src"
          git -C "$RUNNER_TEMP/rucc-src" checkout -q "$REF"
          echo "commit=$(git -C "$RUNNER_TEMP/rucc-src" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: rucc ${{ inputs.rucc || 'main' }} from source
        if: steps.plan.outputs.any_r == 'true'
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/rucc-tgt" cargo build --release \
            --manifest-path "$RUNNER_TEMP/rucc-src/Cargo.toml" -p rucc
          echo "rucc built from tamnd/rucc $(git -C "$RUNNER_TEMP/rucc-src" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: steps.plan.outputs.any_r == 'true'
        with:
          name: rucc-linux-x86_64
          path: ${{ runner.temp }}/rucc-tgt/release/rucc
          retention-days: 7

  boot:
    name: ${{ matrix.name }} ${{ matrix.shard }}
    needs: rb
    if: needs.rb.outputs.any_boot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.rb.outputs.matrix) }}
    env:
      NAME: ${{ matrix.name }}
      ROW: ${{ matrix.row }}
      SHARD: ${{ matrix.shard }}
      SUITE: ${{ matrix.suite }}
      TESTS: ${{ matrix.tests }}
      MINUTES: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@v7.0.1
      # ipxe-qemu has efi-virtio.rom, the option ROM that QEMU loads for virtio-net-pci on the
      # aarch64 virt machine. qemu-system-arm only recommends it, and QEMU does not start without it.
      - name: QEMU and the firmware
        run: |
          scripts/ci/apt-install.sh qemu-utils xz-utils \
            qemu-system-arm qemu-efi-aarch64 ipxe-qemu qemu-system-misc opensbi u-boot-qemu
          qemu-system-aarch64 --version | head -n 1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: the release image
        run: |
          image=$(scripts/tcg/image.sh "$NAME" "$RUNNER_TEMP/image" 16G)
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          ls -l "$image"
      # rb's own limit ends ten minutes before the job's, so that the results are kept.
      - name: rb boot
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/rb/rb"
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/rb/rb" boot --image "$IMAGE" --out "$RUNNER_TEMP/out" --row "$ROW" \
            --login --suite "$SUITE" $TESTS --timeout $(((MINUTES - 10) * 60)) \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # A boot that did not get far has no console log or no counts, and a nightly boot has no
      # tests suite. None of that fails this step, which only reports: rb boot has the result.
      - name: summary
        if: always()
        run: |
          {
            echo "### $NAME $SHARD: the console's RB- lines"
            echo
            echo '```'
            grep -a '^RB-' "$RUNNER_TEMP/out/console.log" 2>/dev/null || true
            for suite in smoke tests; do
              cat "$RUNNER_TEMP/out/results/$suite/counts" 2>/dev/null || true
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$RUNNER_TEMP/image"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tcg-${{ matrix.name }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 14

  # R for the NetBSD rows of a weekly run: the row's kernel with the reference GCC and with rucc,
  # each through the shims, and rb's comparison of the two. TOOLDIR is cached for each row and pin.
  netbsd-r:
    name: ${{ matrix.name }} R kernel ${{ matrix.kernel }}
    needs: rb
    if: needs.rb.outputs.any_r == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rb.outputs.r) }}
    env:
      NB_ROOT: /mnt/nb
      NB_PIN_FILE: 11.1.pin
      NB_MACHINE: ${{ matrix.machine }}
      NB_MACHINE_ARCH: ${{ matrix.arch }}
      NB_VARS: ${{ matrix.vars }}
      KERNEL: ${{ matrix.kernel }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache@v6.1.0
        id: tools
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-${{ matrix.machine }}-${{ matrix.arch }}-${{ hashFiles('conf/netbsd/11.1.pin', 'scripts/netbsd/common.sh') }}
      - name: host packages
        run: |
          scripts/ci/apt-install.sh zlib1g-dev mtools zstd
      - name: fetch the source sets
        run: scripts/netbsd/fetch.sh
      - name: build.sh tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: scripts/netbsd/phase.sh tools tools
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rucc-linux-x86_64
          path: ${{ runner.temp }}/rucc
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: the kernel with ref and with rucc
        run: |
          chmod +x "$RUNNER_TEMP/rucc/rucc" "$RUNNER_TEMP/rb/rb"
          PATH="$RUNNER_TEMP/rucc:$PATH" scripts/netbsd/r-kernel.sh "$KERNEL"
      - name: rb flags-diff, sections-diff and symbols-diff
        if: always()
        run: |
          rb="$RUNNER_TEMP/rb/rb"
          out="$NB_ROOT/cmp/record"
          mkdir -p "$out"
          g=(--g "$NB_ROOT/cmp/ref/compile.jsonl" --g-root "$NB_ROOT/cmp/ref")
          r=(--r "$NB_ROOT/cmp/rucc/compile.jsonl" --r-root "$NB_ROOT/cmp/rucc")
          run() { "$rb" "$@" > "$out/$1.txt" 2>&1 || echo "rb $1 exited $?" >> "$out/$1.txt"; }
          run flags-diff netbsd-11.1 "${g[@]}" "${r[@]}" --paired-only
          for tool in sections-diff symbols-diff; do
            run "$tool" "${g[@]}" "${r[@]}"
            "$rb" "$tool" "${g[@]}" "${r[@]}" --limit 100000 > "$out/$tool-all.txt" 2>&1 || true
          done
          cp "$NB_ROOT/cmp/rucc/report.md" "$out/" 2>/dev/null || true
          {
            echo "### $NAME R kernel $KERNEL with rucc"
            echo
            cat "$NB_ROOT/cmp/rucc/report.md" 2>/dev/null || echo "No rucc leg."
            echo
            echo '```'
            for f in flags-diff sections-diff symbols-diff; do
              if [ -f "$out/$f.txt" ]; then echo "rb $f:"; head -4 "$out/$f.txt"; echo; fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NAME: ${{ matrix.name }}
      # The R image, R kernel with G world (plan 12.6): when the rucc leg linked the kernel, it
      # goes into the release image of the row, as scripts/netbsd/r-image.sh says.
      - name: put the kernel into the release image
        if: always() && matrix.image
        continue-on-error: true
        run: |
          kernel="$NB_ROOT/cmp/rucc/obj/sys/arch/$NB_MACHINE/compile/$KERNEL/netbsd"
          if [ ! -f "$kernel" ]; then
            echo "The rucc leg did not link the kernel, so this run has no R image." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          g=$(scripts/tcg/image.sh "$NAME" "$RUNNER_TEMP/g" 16G)
          scripts/netbsd/r-image.sh "$g" "$kernel"
          mkdir -p image
          zstd -q -T0 --rm "$g" -o image/netbsd.img.zst
          rm -rf "$RUNNER_TEMP/g"
          ls -l image
        env:
          NAME: ${{ matrix.name }}
      - name: compress the logs and the objects
        if: always()
        run: |
          xz -T0 "$NB_ROOT"/logs/*.log "$NB_ROOT"/cmp/*/shim.tsv 2>/dev/null || true
          for leg in ref rucc; do
            if [ -d "$NB_ROOT/cmp/$leg/obj" ]; then
              (cd "$NB_ROOT/cmp/$leg" && find obj -name '*.o' -print0 | tar --null -T - -cf - \
                | xz -T0 > objects.tar.xz)
            fi
          done
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tcg-${{ matrix.name }}-r-kernel
          path: |
            /mnt/nb/cmp/record
            /mnt/nb/cmp/*/compile.jsonl
            /mnt/nb/cmp/*/shim.tsv.xz
            /mnt/nb/cmp/*/objects.tar.xz
            /mnt/nb/logs
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.1
        if: always() && hashFiles('image/netbsd.img.zst') != ''
        with:
          name: tcg-${{ matrix.name }}-r-image
          path: image/netbsd.img.zst
          compression-level: 0
          retention-days: 7

  # R for the FreeBSD rows of a weekly run, in the builder VM of freebsd-r.yml: the row's kernel
  # with rucc (make -k) and with the reference, the replay of every unit of the reference build with
  # rucc, and rb's comparison of the reference objects with the replay objects.
  freebsd-r:
    name: ${{ matrix.name }} R kernel ${{ matrix.kernel }}
    needs: rb
    if: needs.rb.outputs.any_fr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rb.outputs.fr) }}
    env:
      NAME: ${{ matrix.name }}
      ROW: ${{ matrix.row }}
      TRIPLE: ${{ matrix.triple }}
      TARGET_ARCH: ${{ matrix.target_arch }}
      KERNCONF: ${{ matrix.kernel }}
      KOBJ: /build/obj/build/src/${{ matrix.target }}.${{ matrix.target_arch }}/sys/${{ matrix.kernel }}
      RUCC_COMMIT: ${{ needs.rb.outputs.rucc_commit }}
      RB_PIN: ${{ matrix.pin }}
      PIN_NAME: ${{ matrix.pin_name }}
      RB_CACHE: /mnt/rb-cache
      RB_VM_DIR: /mnt/rb-builder
      VM_ENV: >-
        RB_SRC=/build/src RB_OBJ=/build/obj RB_OUT=/root/out RB_JOBS=4
        RB_SRCCONF=/root/harness/conf/freebsd/graded.conf RB_HARNESS=/root/harness
        RB_KERNCONF=${{ matrix.kernel }} RB_PIN_NAME=${{ matrix.pin_name }}
        RB_COMPILE_JSONL=/build/out/compile.jsonl RB_ROW=${{ matrix.row }}
        RB_TARGET=${{ matrix.target }} RB_TARGET_ARCH=${{ matrix.target_arch }}
        RB_MAKEVARS=${{ matrix.vars }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$RB_CACHE" "$RB_VM_DIR"
          sudo chown "$USER" "$RB_CACHE" "$RB_VM_DIR"
          df -h / /mnt
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: install QEMU
        run: |
          scripts/ci/apt-install.sh qemu-system-x86 qemu-utils sshpass zstd
      - name: cache the builder image
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/FreeBSD-*.raw.xz
          key: freebsd-builder-${{ hashFiles('conf/freebsd/builder.conf') }}
      - name: cache the source
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/freebsd-src-*
          key: freebsd-src-${{ env.RB_PIN }}-${{ hashFiles('conf/freebsd/pins.conf') }}
      - name: boot the builder VM
        run: |
          echo "rucc built in the VM from tamnd/rucc commit $RUCC_COMMIT. The run is ungraded." >> "$GITHUB_STEP_SUMMARY"
          scripts/freebsd/builder.sh up
          tar --exclude=./.git --exclude=./target -cf - . \
            | scripts/freebsd/builder.sh ssh 'mkdir -p /root/harness && tar -xf - -C /root/harness'
      - name: provision
        run: scripts/freebsd/builder.sh ssh "$VM_ENV sh /root/harness/scripts/freebsd/provision.sh /root/out"
      - name: fetch the source of ${{ env.RB_PIN }}
        run: |
          mkdir -p record
          read -r archive strip < <(RB_OUT=record scripts/freebsd/fetch.sh "$RB_PIN")
          scripts/freebsd/builder.sh ssh "mkdir -p /build/src && tar -xf - -C /build/src --strip-components $strip" < "$archive"
          scripts/freebsd/builder.sh put record/source.txt /root/out/source.txt
      - name: rb, rb-cc, rucc and the shims
        run: scripts/freebsd/builder.sh ssh "$VM_ENV sh /root/harness/scripts/freebsd/rb-tools.sh /root/out rucc $RUCC_COMMIT"
      - name: make kernel-toolchain
        run: |
          scripts/freebsd/builder.sh ssh "$VM_ENV RB_TOOLCHAIN=$TARGET_ARCH-gcc15 \
            sh /root/harness/scripts/freebsd/build.sh toolchain"
      - name: make -k buildkernel with rucc
        continue-on-error: true
        run: |
          scripts/freebsd/builder.sh ssh "$VM_ENV RB_TOOLCHAIN=/build/toolchain/rucc.mk RB_MAKEFLAGS=-k \
            RB_PHASE=kernel-rucc RB_COMPILE_LOG=/build/out/compile-rucc.jsonl sh /root/harness/scripts/freebsd/build.sh kernel"
      - name: make buildkernel with ref, the control
        run: |
          scripts/freebsd/builder.sh ssh "$VM_ENV RB_TOOLCHAIN=/build/toolchain/ref.mk \
            RB_PHASE=kernel-ref RB_COMPILE_LOG=/build/out/compile-ref.jsonl sh /root/harness/scripts/freebsd/build.sh kernel"
      - name: compile every unit of the ref build with rucc
        timeout-minutes: 120
        continue-on-error: true
        run: |
          mkdir -p compile replay
          scripts/freebsd/builder.sh get /build/out/compile-ref.jsonl compile/compile-ref.jsonl
          python3 -I scripts/freebsd/replay.py compile/compile-ref.jsonl --out replay --objects /build/replay \
            --shim "/build/toolchain/bin/$TRIPLE-rb-cc-rucc" \
            --timeouts /root/out/replay-timeouts.txt | tee record/replay.txt
          tar -cf - replay | scripts/freebsd/builder.sh ssh 'tar -xf - -C /root'
          start=$(date +%s)
          # shellcheck disable=SC2016
          scripts/freebsd/builder.sh ssh 'export RB_COMPILE_LOG=/build/out/compile-replay.jsonl;
            for f in /root/replay/replay-*.sh; do sh "$f" & done; wait'
          echo "replay: $(($(date +%s) - start))s" | tee -a record/replay.txt
      - name: compare the builds with rb
        if: always()
        continue-on-error: true
        run: |
          # The ref objects are under /build/obj and the replay objects are at the same paths under
          # /build/replay, so the roots pair them.
          # shellcheck disable=SC2016
          scripts/freebsd/builder.sh ssh "cd /root/harness && export ROW=$ROW KOBJ=$KOBJ PIN_NAME=$PIN_NAME && "'
            rb=/build/rb/bin/rb; ref=/build/out/compile-ref.jsonl; out=/root/out
            run() { "$rb" "$@" > "$out/$1.txt" 2>&1 || echo "rb $1 exited $?" >> "$out/$1.txt"; }
            RB_COMPILE_LOG=/build/out/compile-mk-diff.jsonl; export RB_COMPILE_LOG
            run mk-diff $PIN_NAME --row "$ROW" --dir /build/toolchain --src /build/src \
              --work "$out/mk-diff" --kernel "$KOBJ"
            run flags-diff $PIN_NAME --row "$ROW" --g "$ref" --r /build/out/compile-rucc.jsonl --paired-only
            pair="--g $ref --r /build/out/compile-replay.jsonl --g-root /build/obj --r-root /build/replay/build/obj"
            for tool in warnings sections-diff symbols-diff; do
              run "$tool" $pair
            done
            for tool in sections-diff symbols-diff; do
              "$rb" "$tool" $pair --limit 100000 > "$out/$tool-all.txt" 2>&1 || true
            done'
      # The R image, R kernel with G world (plan 12.6). When the rucc build had no failed unit,
      # the kernel is built with rucc again, now with its modules, since the ref build overwrote
      # it, and installed into the release image of the row in place of the kernel there.
      - name: make buildkernel with rucc, for the image
        id: kernel
        if: always() && matrix.image
        continue-on-error: true
        run: |
          status=$(scripts/freebsd/builder.sh ssh 'cat /root/out/kernel-rucc.status' || true)
          if [ "$status" != 0 ]; then
            echo "The rucc kernel had failed units, so this run has no R image." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          scripts/freebsd/builder.sh ssh "$VM_ENV RB_MAKEVARS= RB_TOOLCHAIN=/build/toolchain/rucc.mk \
            RB_PHASE=kernel-r RB_COMPILE_LOG=/build/out/compile-r.jsonl sh /root/harness/scripts/freebsd/build.sh kernel"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: put the kernel into the release image
        if: always() && steps.kernel.outputs.built == 'true'
        continue-on-error: true
        run: |
          g=$(scripts/tcg/image.sh "$NAME" "$RUNNER_TEMP/g" 8G)
          qemu-img convert -f qcow2 -O raw "$g" "$RUNNER_TEMP/g/g.img"
          rm -f "$g"
          zstd -q -T0 --rm "$RUNNER_TEMP/g/g.img" -o "$RUNNER_TEMP/g/g.img.zst"
          scripts/freebsd/builder.sh ssh 'mkdir -p /build/image'
          scripts/freebsd/builder.sh put "$RUNNER_TEMP/g/g.img.zst" /build/image/g.img.zst
          rm -rf "$RUNNER_TEMP/g"
          scripts/freebsd/builder.sh ssh "$VM_ENV RB_TOOLCHAIN=/build/toolchain/rucc.mk RB_IMAGE=/build/image/r.img \
            sh /root/harness/scripts/freebsd/r-image.sh /build/image/g.img.zst"
          mkdir -p image
          scripts/freebsd/builder.sh get /build/image/r.img.zst image/freebsd.img.zst
          ls -l image
      - name: copy the record out
        if: always()
        run: |
          mkdir -p record compile
          scripts/freebsd/builder.sh ssh 'xz -T0 -f /build/out/*.jsonl; tar -cf - -C /root/out .' | tar -xf - -C record || true
          scripts/freebsd/builder.sh ssh 'tar -cf - -C /build/out .' | tar -xf - -C compile || true
          # The ref and replay objects, for sections-diff by hand.
          # shellcheck disable=SC2016
          scripts/freebsd/builder.sh ssh 'cd /build && find obj/build/src/*/sys replay/build/obj/build/src/*/sys -name "*.o" 2>/dev/null \
            | tar -cf - -T - | xz -T0' > compile/objects.tar.xz || true
          rm -f compile/compile-ref.jsonl
          scripts/freebsd/builder.sh down || true
          xz -T0 record/*.log 2>/dev/null || true
          ls -l record compile
      - name: summary
        if: always()
        run: |
          {
            echo "### $NAME R kernel $KERNCONF with rucc"
            echo
            if [ -f record/phases.tsv ]; then
              echo '```'
              echo "phase status seconds obj_kb disk_used_kb"
              cat record/phases.tsv
              echo '```'
              echo
            fi
            echo '```'
            sed -n '/^# rucc/,/^$/p' record/rb-tools.txt 2>/dev/null || true
            cat record/replay.txt 2>/dev/null || true
            if [ -f record/replay-timeouts.txt ]; then
              echo "units stopped by the timeout: $(wc -l < record/replay-timeouts.txt)"
              head -40 record/replay-timeouts.txt
            fi
            echo '```'
            for run in replay rucc; do
              f=compile/compile-$run.jsonl.xz
              [ -f "$f" ] || continue
              echo
              echo "#### The failed units of the $run build"
              echo
              python3 -I scripts/freebsd/r-report.py "$f" --tsv "record/failed-units-$run.tsv"
            done
            for tool in mk-diff flags-diff warnings sections-diff symbols-diff; do
              [ -f "record/$tool.txt" ] || continue
              echo
              echo "#### rb $tool"
              echo
              echo '```'
              head -60 "record/$tool.txt"
              echo '```'
            done
            for f in record/*-error.txt; do
              [ -f "$f" ] || continue
              echo
              echo "First error in $(basename "$f" -error.txt):"
              echo
              echo '```'
              tail -20 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tcg-${{ matrix.name }}-r-kernel
          path: |
            record
            compile
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.1
        if: always() && hashFiles('image/freebsd.img.zst') != ''
        with:
          name: tcg-${{ matrix.name }}-r-image
          path: image/freebsd.img.zst
          compression-level: 0
          retention-days: 7

  # The R image of each row, booted to the smoke suite. A row whose rucc kernel had failed units
  # has no image. Its boot stops after the download and fails, since nothing was booted. A NetBSD
  # R image boots its kernel from the EFI system partition through boot.cfg, and the step fails
  # when the console does not show the banner of that boot.cfg.
  r-boot:
    name: ${{ matrix.name }} R image boot
    needs: [rb, netbsd-r, freebsd-r]
    if: always() && needs.rb.outputs.any_image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rb.outputs.images) }}
    env:
      NAME: ${{ matrix.name }}
      ROW: ${{ matrix.row }}
      MINUTES: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - name: the R image
        id: image
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: tcg-${{ matrix.name }}-r-image
          path: ${{ runner.temp }}/image
      - name: QEMU and the firmware
        if: steps.image.outcome == 'success'
        run: |
          scripts/ci/apt-install.sh qemu-utils zstd \
            qemu-system-arm qemu-efi-aarch64 ipxe-qemu qemu-system-misc opensbi u-boot-qemu
      - uses: actions/download-artifact@v8.0.1
        if: steps.image.outcome == 'success'
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      # The image grows its root file system to the disk at its first boot.
      - name: rb boot
        if: steps.image.outcome == 'success'
        run: |
          set -o pipefail
          image="$RUNNER_TEMP/image/${NAME%%-*}.img"
          zstd -d -q --rm --sparse "$image.zst" -o "$image"
          truncate -s 16G "$image"
          chmod +x "$RUNNER_TEMP/rb/rb"
          "$RUNNER_TEMP/rb/rb" boot --image "$image" --out "$RUNNER_TEMP/out" --row "$ROW" \
            --login --suite boot,smoke --timeout $(((MINUTES - 10) * 60)) \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${NAME%%-*}" = netbsd ] && ! grep -aq 'rb R image: the rucc kernel' "$RUNNER_TEMP/out/console.log"; then
            echo "The console does not show the banner of the R boot.cfg, so the rucc kernel did not boot." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: summary
        if: always() && steps.image.outcome == 'success'
        run: |
          {
            echo "### $NAME R image: the console's RB- lines"
            echo
            echo '```'
            grep -a '^RB-' "$RUNNER_TEMP/out/console.log" 2>/dev/null || true
            cat "$RUNNER_TEMP/out/results/smoke/counts" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$RUNNER_TEMP/image"
      - uses: actions/upload-artifact@v7.0.1
        if: always() && steps.image.outcome == 'success'
        with:
          name: tcg-${{ matrix.name }}-r-boot
          path: ${{ runner.temp }}/out
          retention-days: 14
      # The steps above skip when there is no image, and the job would end green with no boot.
      - name: no R image to boot
        if: steps.image.outcome != 'success'
        run: |
          echo "There is no R image of $NAME, so nothing was booted: its rucc kernel did not link or had failed units." \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  # The R world of each NetBSD row, as the world job of netbsd-r.yml does it for amd64: "build.sh
  # distribution" through the control TOOLDIR, then every unit of that build compiled again with
  # rucc (scripts/netbsd/world-replay.sh). The control of an earlier run of the same row, pin and
  # scripts is restored from its artifact in place of the build (scripts/netbsd/control.sh).
  netbsd-r-world:
    name: ${{ matrix.name }} R world
    needs: rb
    if: needs.rb.outputs.any_r == 'true' && (github.event_name != 'workflow_dispatch' || inputs.world)
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rb.outputs.r) }}
    env:
      NB_ROOT: /mnt/nb
      NB_PIN_FILE: 11.1.pin
      NB_MACHINE: ${{ matrix.machine }}
      NB_MACHINE_ARCH: ${{ matrix.arch }}
      NB_VARS: ${{ matrix.vars }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache@v6.1.0
        id: tools
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-${{ matrix.machine }}-${{ matrix.arch }}-${{ hashFiles('conf/netbsd/11.1.pin', 'scripts/netbsd/common.sh') }}
      - name: host packages
        run: |
          scripts/ci/apt-install.sh zlib1g-dev
      - name: fetch the source sets
        run: scripts/netbsd/fetch.sh
      - name: build.sh tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: scripts/netbsd/phase.sh tools tools
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rucc-linux-x86_64
          path: ${{ runner.temp }}/rucc
      - name: rucc on PATH
        run: |
          chmod +x "$RUNNER_TEMP/rucc/rucc"
          echo "$RUNNER_TEMP/rucc" >> "$GITHUB_PATH"
      # The control depends only on the tools, the pinned tree and the scripts that build and keep
      # it. A run that built it keeps it as an artifact named by the hash of those scripts
      # (scripts/netbsd/control.sh), and a later run restores it in place of the build.
      - name: the control of an earlier run
        id: control
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=10" \
            -q '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then
            echo "The control build is that of run $run, from the artifact $NAME." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: tcg-netbsd-r-control-${{ matrix.machine }}-${{ matrix.arch }}-${{ hashFiles('conf/netbsd/11.1.pin', 'conf/netbsd/toolchain/shim-ref.sh', 'scripts/netbsd/common.sh', 'scripts/netbsd/fetch.sh', 'scripts/netbsd/overlay.sh', 'scripts/netbsd/control.sh', 'scripts/netbsd/stand.sh') }}
      - uses: actions/download-artifact@v8.0.1
        if: steps.control.outputs.run != ''
        with:
          name: ${{ steps.control.outputs.name }}
          path: /mnt/nb/control
          run-id: ${{ steps.control.outputs.run }}
          github-token: ${{ github.token }}
      - name: restore the control
        if: steps.control.outputs.run != ''
        run: |
          scripts/netbsd/control.sh restore "$NB_ROOT/control/control.tar.zst"
          rm -rf "$NB_ROOT/control"
      - name: build.sh distribution with ref, the control
        id: ref
        if: steps.control.outputs.run == ''
        run: |
          scripts/netbsd/overlay.sh ref
          NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh distribution-ref -u distribution
          scripts/netbsd/control.sh save "$NB_ROOT/control/control.tar.zst"
      - uses: actions/upload-artifact@v7.0.1
        if: steps.ref.outcome == 'success'
        with:
          name: ${{ steps.control.outputs.name }}
          path: /mnt/nb/control/control.tar.zst
          compression-level: 0
          retention-days: 30
      - name: remove the kept control
        if: steps.ref.outcome == 'success'
        run: rm -rf "$NB_ROOT/control"
      - name: compile every unit of the ref build with rucc
        # A unit stops after 300 s. The step stops after its limit, and the steps after it still run.
        timeout-minutes: 200
        continue-on-error: true
        run: NB_TOOLDIR="$NB_ROOT/tools-r" scripts/netbsd/phase.sh replay -- scripts/netbsd/world-replay.sh rucc
      - name: the result of the replay
        if: always()
        run: |
          units=$(awk 'NR == 1 { print $1 }' "$NB_ROOT/logs/replay.txt" 2>/dev/null || true)
          {
            echo "### $NAME R world with rucc"
            echo
            if [ -f "$NB_ROOT/logs/phases.tsv" ]; then scripts/netbsd/summary.sh "$NB_ROOT/logs/phases.tsv"; fi
            echo
            python3 -I scripts/netbsd/replay-report.py "${units:-0}" "$NB_ROOT/logs/shim.tsv" \
              "$NB_ROOT/logs/replay-timeouts.txt" "$NB_ROOT/logs/replay-failed.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
          # The standard error of each failed unit, for the causes the summary leaves out.
          if [ -s "$NB_ROOT/logs/replay-failed.tsv" ]; then
            cut -f5 "$NB_ROOT/logs/replay-failed.tsv" | tar -T - -cf - 2>/dev/null \
              | xz -T0 > "$NB_ROOT/logs/replay-errors.tar.xz" || true
          fi
        env:
          NAME: ${{ matrix.name }}
      - name: compress the logs
        if: always()
        run: |
          rm -f "$NB_ROOT"/logs/compile-ref.jsonl
          xz -T0 "$NB_ROOT"/logs/*.log "$NB_ROOT"/logs/*.tsv "$NB_ROOT"/logs/*.jsonl 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tcg-${{ matrix.name }}-r-world
          path: /mnt/nb/logs
          retention-days: 14

  # The R world of each FreeBSD row, as the world run of freebsd-r.yml does it for amd64, in the
  # builder VM: make buildworld with the reference, the control, then every unit of that build
  # compiled again with rucc (scripts/freebsd/replay.py).
  freebsd-r-world:
    name: ${{ matrix.name }} R world
    needs: rb
    if: needs.rb.outputs.any_fr == 'true' && (github.event_name != 'workflow_dispatch' || inputs.world)
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rb.outputs.fr) }}
    env:
      NAME: ${{ matrix.name }}
      TRIPLE: ${{ matrix.triple }}
      RUCC_COMMIT: ${{ needs.rb.outputs.rucc_commit }}
      RB_PIN: ${{ matrix.pin }}
      RB_CACHE: /mnt/rb-cache
      RB_VM_DIR: /mnt/rb-builder
      VM_ENV: >-
        RB_SRC=/build/src RB_OBJ=/build/obj RB_OUT=/root/out RB_JOBS=4
        RB_SRCCONF=/root/harness/conf/freebsd/graded.conf RB_HARNESS=/root/harness
        RB_KERNCONF=${{ matrix.kernel }} RB_PIN_NAME=${{ matrix.pin_name }}
        RB_COMPILE_JSONL=/build/out/compile.jsonl RB_ROW=${{ matrix.row }}
        RB_TARGET=${{ matrix.target }} RB_TARGET_ARCH=${{ matrix.target_arch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$RB_CACHE" "$RB_VM_DIR"
          sudo chown "$USER" "$RB_CACHE" "$RB_VM_DIR"
          df -h / /mnt
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: install QEMU
        run: |
          scripts/ci/apt-install.sh qemu-system-x86 qemu-utils sshpass zstd
      - name: cache the builder image
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/FreeBSD-*.raw.xz
          key: freebsd-builder-${{ hashFiles('conf/freebsd/builder.conf') }}
      - name: cache the source
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/freebsd-src-*
          key: freebsd-src-${{ env.RB_PIN }}-${{ hashFiles('conf/freebsd/pins.conf') }}
      - name: boot the builder VM
        run: |
          echo "rucc built in the VM from tamnd/rucc commit $RUCC_COMMIT. The run is ungraded." >> "$GITHUB_STEP_SUMMARY"
          scripts/freebsd/builder.sh up
          tar --exclude=./.git --exclude=./target -cf - . \
            | scripts/freebsd/builder.sh ssh 'mkdir -p /root/harness && tar -xf - -C /root/harness'
      - name: provision
        run: scripts/freebsd/builder.sh ssh "$VM_ENV sh /root/harness/scripts/freebsd/provision.sh /root/out"
      - name: fetch the source of ${{ env.RB_PIN }}
        run: |
          mkdir -p record
          read -r archive strip < <(RB_OUT=record scripts/freebsd/fetch.sh "$RB_PIN")
          scripts/freebsd/builder.sh ssh "mkdir -p /build/src && tar -xf - -C /build/src --strip-components $strip" < "$archive"
          scripts/freebsd/builder.sh put record/source.txt /root/out/source.txt
      - name: rb, rb-cc, rucc and the shims
        run: scripts/freebsd/builder.sh ssh "$VM_ENV sh /root/harness/scripts/freebsd/rb-tools.sh /root/out rucc $RUCC_COMMIT"
      - name: make buildworld with ref, the control
        run: |
          scripts/freebsd/builder.sh ssh "$VM_ENV RB_TOOLCHAIN=/build/toolchain/ref.mk \
            RB_PHASE=world-ref RB_COMPILE_LOG=/build/out/compile-ref.jsonl sh /root/harness/scripts/freebsd/build.sh world"
      - name: compile every unit of the ref build with rucc
        # A unit stops after 300 s. The step stops after its limit, and the steps after it still run.
        timeout-minutes: 200
        continue-on-error: true
        run: |
          mkdir -p compile replay
          scripts/freebsd/builder.sh get /build/out/compile-ref.jsonl compile/compile-ref.jsonl
          python3 -I scripts/freebsd/replay.py compile/compile-ref.jsonl --out replay --objects /build/replay \
            --shim "/build/toolchain/bin/$TRIPLE-rb-cc-rucc" \
            --timeouts /root/out/replay-timeouts.txt | tee record/replay.txt
          tar -cf - replay | scripts/freebsd/builder.sh ssh 'tar -xf - -C /root'
          start=$(date +%s)
          # shellcheck disable=SC2016
          scripts/freebsd/builder.sh ssh 'export RB_COMPILE_LOG=/build/out/compile-replay.jsonl;
            for f in /root/replay/replay-*.sh; do sh "$f" & done; wait'
          echo "replay: $(($(date +%s) - start))s" | tee -a record/replay.txt
      - name: copy the record out
        if: always()
        run: |
          mkdir -p record compile
          scripts/freebsd/builder.sh ssh 'xz -T0 -f /build/out/*.jsonl; tar -cf - -C /root/out .' | tar -xf - -C record || true
          scripts/freebsd/builder.sh ssh 'tar -cf - -C /build/out .' | tar -xf - -C compile || true
          rm -f compile/compile-ref.jsonl
          scripts/freebsd/builder.sh down || true
          xz -T0 record/*.log 2>/dev/null || true
          ls -l record compile
      - name: summary
        if: always()
        run: |
          {
            echo "### $NAME R world with rucc"
            echo
            if [ -f record/phases.tsv ]; then
              echo '```'
              echo "phase status seconds obj_kb disk_used_kb"
              cat record/phases.tsv
              echo '```'
              echo
            fi
            echo '```'
            sed -n '/^# rucc/,/^$/p' record/rb-tools.txt 2>/dev/null || true
            cat record/replay.txt 2>/dev/null || true
            if [ -f record/replay-timeouts.txt ]; then
              echo "units stopped by the timeout: $(wc -l < record/replay-timeouts.txt)"
              head -40 record/replay-timeouts.txt
            fi
            echo '```'
            if [ -f compile/compile-replay.jsonl.xz ]; then
              echo
              echo "#### The failed units of the replay"
              echo
              python3 -I scripts/freebsd/r-report.py compile/compile-replay.jsonl.xz --tsv record/failed-units-replay.tsv
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tcg-${{ matrix.name }}-r-world
          path: |
            record
            compile
          retention-days: 14
