# The TCG cadence of plan 11.5: the aarch64 and riscv64 rows of FreeBSD and NetBSD, under QEMU
# with TCG on the amd64 runner.
#
#   nightly  the boot and smoke suites on each of the four rows, Monday to Saturday. One boot job
#            per row, so the night costs the rb job and four boot jobs.
#   weekly   on Sunday, the full suite of each row, sharded by top-level test directory as in
#            netbsd-baseline.yml. Each shard is one boot with the boot, smoke and tests suites, so
#            Sunday has its boot and smoke too. At most six shards run at a time, so that the
#            weekly run does not take every runner.
#
# The images are the release images of conf/tcg/images.conf, checked by their published digests.
# They have no rb-rc, so rb boot logs in as root at the login prompt (--login) and starts rb-rc from
# the results disk. The row in rows.toml gives the QEMU machine, the CPU, the firmware and the boot
# limit: riscv64 boots for longer than the 1800 s that rb boot gives a TCG boot by default.
#
# The weekly run also builds R for each NetBSD row of the run, at the NetBSD 11.1 pin
# (conf/netbsd/11.1.pin), with the rucc of tamnd/rucc main or of the rucc input. The netbsd-r job
# builds the row's kernel through the shims of scripts/netbsd/overlay.sh, once with the reference
# GCC and once with rucc (scripts/netbsd/r-kernel.sh), and rb compares the two: flags-diff,
# sections-diff and symbols-diff. The rucc leg does not fail the run.
#
# A manual run takes the cadence, the rows and the rucc ref. The r cadence builds R only.

name: tcg

on:
  schedule:
    - cron: "23 1 * * 1-6"
    - cron: "23 1 * * 0"
  workflow_dispatch:
    inputs:
      cadence:
        description: nightly (boot and smoke), weekly (the full suite, sharded, and R) or r (R only)
        type: choice
        options: [nightly, weekly, r]
        default: nightly
      rows:
        description: The system-row pairs, separated by spaces
        default: freebsd-aarch64 freebsd-riscv64 netbsd-aarch64 netbsd-riscv64
      rucc:
        description: The branch or commit of tamnd/rucc that the weekly R builds use
        default: main

# One run of each cadence at a time. A scheduled run waits for the one before it, and is not
# cancelled, so the queue holds at most one more.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.schedule }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rb:
    name: cargo build rb
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      r: ${{ steps.plan.outputs.r }}
      any_r: ${{ steps.plan.outputs.any_r }}
      any_boot: ${{ steps.plan.outputs.any_boot }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: the boots of this run
        id: plan
        env:
          CADENCE: ${{ inputs.cadence || (github.event.schedule == '23 1 * * 0' && 'weekly' || 'nightly') }}
          ROWS: ${{ inputs.rows || 'freebsd-aarch64 freebsd-riscv64 netbsd-aarch64 netbsd-riscv64' }}
        run: |
          python3 -I - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, tomllib
          cadence = os.environ["CADENCE"]
          with open("rows.toml", "rb") as f:
              rows = tomllib.load(f)["row"]
          # The shards of the full suite. Each system's two largest top-level directories are a
          # shard of their own, and the rest is the third.
          shards = {
              "freebsd": [["only", "sys"], ["only", "lib"], ["except", "sys,lib"]],
              "netbsd": [["only", "net"], ["only", "lib"], ["except", "net,lib"]],
          }
          include = []
          r = []
          for name in os.environ["ROWS"].split():
              system, row = name.split("-", 1)
              if cadence in ("weekly", "r") and system == "netbsd":
                  nb = rows[row]["netbsd"]
                  r.append({"name": name, "row": row, "machine": nb["machine"],
                            "arch": nb["machine_arch"], "vars": " ".join(nb.get("make", [])),
                            "kernel": "GENERIC64"})
              if cadence == "r":
                  continue
              if cadence == "nightly":
                  include.append({"name": name, "system": system, "row": row,
                                  "shard": "smoke", "suite": "boot,smoke", "tests": "",
                                  "minutes": 150 if row == "riscv64" else 60})
                  continue
              for how, dirs in shards[system]:
                  include.append({"name": name, "system": system, "row": row,
                                  "shard": f"{how}-{dirs.replace(',', '-')}",
                                  "suite": "boot,smoke,tests",
                                  "tests": f"--tests-{how} {dirs}", "minutes": 355})
          matrix = {"include": include}
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps(matrix)}\n")
              out.write(f"r={json.dumps({'include': r})}\n")
              out.write(f"any_r={'true' if r else 'false'}\n")
              out.write(f"any_boot={'true' if include else 'false'}\n")
          print(f"### {cadence}: {len(include)} boots, {len(r)} R builds\n")
          for b in include:
              print(f"- {b['name']} {b['shard']}")
          for b in r:
              print(f"- {b['name']} R kernel {b['kernel']}")
          EOF
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo build
        run: cargo build --release --locked -p rb --bin rb
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rb-linux-x86_64
          path: target/release/rb
          retention-days: 7
      - name: rucc ${{ inputs.rucc || 'main' }} from source
        if: steps.plan.outputs.any_r == 'true'
        env:
          REF: ${{ inputs.rucc || 'main' }}
        run: |
          git clone -q https://github.com/tamnd/rucc "$RUNNER_TEMP/rucc-src"
          git -C "$RUNNER_TEMP/rucc-src" checkout -q "$REF"
          CARGO_TARGET_DIR="$RUNNER_TEMP/rucc-tgt" cargo build --release \
            --manifest-path "$RUNNER_TEMP/rucc-src/Cargo.toml" -p rucc
          echo "rucc built from tamnd/rucc $(git -C "$RUNNER_TEMP/rucc-src" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: steps.plan.outputs.any_r == 'true'
        with:
          name: rucc-linux-x86_64
          path: ${{ runner.temp }}/rucc-tgt/release/rucc
          retention-days: 7

  boot:
    name: ${{ matrix.name }} ${{ matrix.shard }}
    needs: rb
    if: needs.rb.outputs.any_boot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.rb.outputs.matrix) }}
    env:
      NAME: ${{ matrix.name }}
      ROW: ${{ matrix.row }}
      SHARD: ${{ matrix.shard }}
      SUITE: ${{ matrix.suite }}
      TESTS: ${{ matrix.tests }}
      MINUTES: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@v7.0.1
      # ipxe-qemu has efi-virtio.rom, the option ROM that QEMU loads for virtio-net-pci on the
      # aarch64 virt machine. qemu-system-arm only recommends it, and QEMU does not start without it.
      - name: QEMU and the firmware
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-utils xz-utils \
            qemu-system-arm qemu-efi-aarch64 ipxe-qemu qemu-system-misc opensbi u-boot-qemu
          qemu-system-aarch64 --version | head -n 1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: the release image
        run: |
          image=$(scripts/tcg/image.sh "$NAME" "$RUNNER_TEMP/image" 16G)
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          ls -l "$image"
      # rb's own limit ends ten minutes before the job's, so that the results are kept.
      - name: rb boot
        run: |
          set -o pipefail
          chmod +x "$RUNNER_TEMP/rb/rb"
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/rb/rb" boot --image "$IMAGE" --out "$RUNNER_TEMP/out" --row "$ROW" \
            --login --suite "$SUITE" $TESTS --timeout $(((MINUTES - 10) * 60)) \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # A boot that did not get far has no console log or no counts, and a nightly boot has no
      # tests suite. None of that fails this step, which only reports: rb boot has the result.
      - name: summary
        if: always()
        run: |
          {
            echo "### $NAME $SHARD: the console's RB- lines"
            echo
            echo '```'
            grep -a '^RB-' "$RUNNER_TEMP/out/console.log" 2>/dev/null || true
            for suite in smoke tests; do
              cat "$RUNNER_TEMP/out/results/$suite/counts" 2>/dev/null || true
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$RUNNER_TEMP/image"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tcg-${{ matrix.name }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 14

  # R for the NetBSD rows of a weekly run: the row's kernel with the reference GCC and with rucc,
  # each through the shims, and rb's comparison of the two. TOOLDIR is cached for each row and pin.
  netbsd-r:
    name: ${{ matrix.name }} R kernel ${{ matrix.kernel }}
    needs: rb
    if: needs.rb.outputs.any_r == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rb.outputs.r) }}
    env:
      NB_ROOT: /mnt/nb
      NB_PIN_FILE: 11.1.pin
      NB_MACHINE: ${{ matrix.machine }}
      NB_MACHINE_ARCH: ${{ matrix.arch }}
      NB_VARS: ${{ matrix.vars }}
      KERNEL: ${{ matrix.kernel }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: work directory on /mnt
        run: |
          sudo mkdir -p "$NB_ROOT"
          sudo chown "$(id -u):$(id -g)" "$NB_ROOT"
      - uses: actions/cache@v6.1.0
        id: tools
        with:
          path: |
            /mnt/nb/tools
            /mnt/nb/obj/tools
          key: netbsd-tools-${{ matrix.machine }}-${{ matrix.arch }}-${{ hashFiles('conf/netbsd/11.1.pin', 'scripts/netbsd/common.sh') }}
      - name: host packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends zlib1g-dev
      - name: fetch the source sets
        run: scripts/netbsd/fetch.sh
      - name: build.sh tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: scripts/netbsd/phase.sh tools tools
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rucc-linux-x86_64
          path: ${{ runner.temp }}/rucc
      - uses: actions/download-artifact@v8.0.1
        with:
          name: rb-linux-x86_64
          path: ${{ runner.temp }}/rb
      - name: the kernel with ref and with rucc
        run: |
          chmod +x "$RUNNER_TEMP/rucc/rucc" "$RUNNER_TEMP/rb/rb"
          PATH="$RUNNER_TEMP/rucc:$PATH" scripts/netbsd/r-kernel.sh "$KERNEL"
      - name: rb flags-diff, sections-diff and symbols-diff
        if: always()
        run: |
          rb="$RUNNER_TEMP/rb/rb"
          out="$NB_ROOT/cmp/record"
          mkdir -p "$out"
          g=(--g "$NB_ROOT/cmp/ref/compile.jsonl" --g-root "$NB_ROOT/cmp/ref")
          r=(--r "$NB_ROOT/cmp/rucc/compile.jsonl" --r-root "$NB_ROOT/cmp/rucc")
          run() { "$rb" "$@" > "$out/$1.txt" 2>&1 || echo "rb $1 exited $?" >> "$out/$1.txt"; }
          run flags-diff netbsd-11.1 "${g[@]}" "${r[@]}" --paired-only
          for tool in sections-diff symbols-diff; do
            run "$tool" "${g[@]}" "${r[@]}"
            "$rb" "$tool" "${g[@]}" "${r[@]}" --limit 100000 > "$out/$tool-all.txt" 2>&1 || true
          done
          cp "$NB_ROOT/cmp/rucc/report.md" "$out/" 2>/dev/null || true
          {
            echo "### $NAME R kernel $KERNEL with rucc"
            echo
            cat "$NB_ROOT/cmp/rucc/report.md" 2>/dev/null || echo "No rucc leg."
            echo
            echo '```'
            for f in flags-diff sections-diff symbols-diff; do
              if [ -f "$out/$f.txt" ]; then echo "rb $f:"; head -4 "$out/$f.txt"; echo; fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NAME: ${{ matrix.name }}
      - name: compress the logs and the objects
        if: always()
        run: |
          xz -T0 "$NB_ROOT"/logs/*.log "$NB_ROOT"/cmp/*/shim.tsv 2>/dev/null || true
          for leg in ref rucc; do
            if [ -d "$NB_ROOT/cmp/$leg/obj" ]; then
              (cd "$NB_ROOT/cmp/$leg" && find obj -name '*.o' -print0 | tar --null -T - -cf - \
                | xz -T0 > objects.tar.xz)
            fi
          done
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tcg-${{ matrix.name }}-r-kernel
          path: |
            /mnt/nb/cmp/record
            /mnt/nb/cmp/*/compile.jsonl
            /mnt/nb/cmp/*/shim.tsv.xz
            /mnt/nb/cmp/*/objects.tar.xz
            /mnt/nb/logs
          retention-days: 14
