# R for FreeBSD 15.1 amd64 (milestones B5 and B6): the pinned tree compiled with rucc in the C
# compiler slot through rb-cc. The pin, the builder VM and the paths are those of freebsd-g.yml.
# The input target picks the kernel (the GENERIC kernel and its modules, the default) or the world.
#
# The builder VM builds rb, rb-cc and rucc with rustup's Rust, and rb toolchain writes the shims,
# ref.mk and rucc.mk in /build/toolchain (scripts/freebsd/rb-tools.sh). For the kernel, make
# kernel-toolchain builds the host tools with the package's CROSS_TOOLCHAIN file, because the C
# compiler slot does not build them. Then the job builds the target these ways:
#   rucc     make -k buildkernel with rucc.mk (kernel only). XCC is the rb-cc-rucc shim, which runs
#            rucc with the persona of the pin. XCXX and XCPP stay the reference. This build may fail
#            until B5 is done. It shows the first unit that stops make.
#   ref      make buildkernel or buildworld with ref.mk, the control. XCC is the rb-cc-ref shim,
#            which runs amd64-gcc15 with the arguments unchanged. This build must succeed, or the
#            shims are broken and the rucc result means nothing.
#   replay   every unit of the C compiler slot of the ref build compiled again with rb-cc-rucc, in
#            its own directory and with its own arguments, after the ref build made the generated
#            headers. The objects go to the same paths under /build/replay
#            (scripts/freebsd/replay.py). So every unit gets a rucc result, also the units that a
#            failure stops make before. A unit stops after 300 seconds.
#
# For the kernel, the job then compares the builds with rb in the builder VM. rb mk-diff compares
# the make variables that depend on the compiler with ref.mk and with rucc.mk. rb flags-diff
# compares the command line of each unit that both the ref and the rucc build made. rb warnings
# compares the diagnostics of each unit of the ref build and of the replay, and rb sections-diff and
# rb symbols-diff compare their objects. None of them fails the run.
#
# After the ref build, rb syntax runs every C unit of it, which is G, through the front end of rucc,
# for the kernel and for the world. The report is syntax.txt in the record.
#
# When the replay of the kernel has no failed unit and no stopped unit, the job builds the kernel
# with rucc.mk (no -k), puts it into the image of the last good freebsd-g run in place of the G
# kernel (scripts/freebsd/r-image.sh), and the boot job boots that image by BIOS and by UEFI with
# the smoke suite and kyua, as freebsd-g does. The input boot changes this: ref puts the control
# kernel into the image, which tests the steps, and none boots nothing. The record has that kernel
# as kernel.xz, with its symbol table, so that the address of a panic gives a function.
#
# scripts/freebsd/r-report.py groups the failed units of a compile.jsonl by the first error line,
# and the step summary shows the groups. rucc is built from the head of tamnd/rucc main, or from the
# branch or commit a manual run names. It is not the pinned release, so the run is ungraded, and the
# step summary names the commit.

name: freebsd-r

on:
  workflow_dispatch:
    inputs:
      rucc:
        description: A branch or commit of tamnd/rucc
        required: false
        default: main
      kernconf:
        description: "The kernel configuration: one of the tree, or RB-TEST of conf/freebsd/kernel (plan 12.2)"
        required: false
        default: GENERIC
      target:
        description: kernel or world
        required: false
        default: kernel
      boot:
        description: "The kernel to boot: auto (rucc when the replay is clean), ref or none"
        required: false
        default: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  RB_PIN: 15.1-release
  RB_TARGET: ${{ inputs.target || 'kernel' }}
  RB_CACHE: /mnt/rb-cache
  RB_VM_DIR: /mnt/rb-builder
  VM_ENV: >-
    RB_SRC=/build/src RB_OBJ=/build/obj RB_OUT=/root/out RB_JOBS=4
    RB_SRCCONF=/root/harness/conf/freebsd/graded.conf RB_HARNESS=/root/harness
    RB_KERNCONF=${{ inputs.kernconf || 'GENERIC' }} RB_PIN_NAME=freebsd-15.1
    RB_COMPILE_JSONL=/build/out/compile.jsonl

jobs:
  build:
    name: ${{ inputs.target == 'world' && 'world' || inputs.kernconf || 'GENERIC' }} with rucc
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      side: ${{ steps.boot.outputs.side }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$RB_CACHE" "$RB_VM_DIR"
          sudo chown "$USER" "$RB_CACHE" "$RB_VM_DIR"
          df -h / /mnt
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils sshpass zstd
      - name: cache the builder image
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/FreeBSD-*.raw.xz
          key: freebsd-builder-${{ hashFiles('conf/freebsd/builder.conf') }}
      - name: cache the source
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/freebsd-src-*
          key: freebsd-src-${{ env.RB_PIN }}-${{ hashFiles('conf/freebsd/pins.conf') }}
      - name: the commit of tamnd/rucc
        run: |
          sha=$(gh api "repos/tamnd/rucc/commits/$REF" -q .sha)
          echo "RUCC_COMMIT=$sha" >> "$GITHUB_ENV"
          echo "rucc built in the VM from tamnd/rucc $REF, commit $sha. The run is ungraded." >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.rucc || 'main' }}
      - name: boot the builder VM
        run: |
          scripts/freebsd/builder.sh up
          tar --exclude=./.git --exclude=./target -cf - . \
            | scripts/freebsd/builder.sh ssh 'mkdir -p /root/harness && tar -xf - -C /root/harness'
      - name: provision
        run: scripts/freebsd/builder.sh ssh 'sh /root/harness/scripts/freebsd/provision.sh /root/out'
      - name: fetch the source of ${{ env.RB_PIN }}
        run: |
          mkdir -p record
          read -r archive strip < <(RB_OUT=record scripts/freebsd/fetch.sh "$RB_PIN")
          scripts/freebsd/builder.sh ssh "mkdir -p /build/src && tar -xf - -C /build/src --strip-components $strip" < "$archive"
          scripts/freebsd/builder.sh put record/source.txt /root/out/source.txt
      - name: rb, rb-cc, rucc and the shims
        run: scripts/freebsd/builder.sh ssh "$VM_ENV sh /root/harness/scripts/freebsd/rb-tools.sh /root/out rucc $RUCC_COMMIT"
      - name: make kernel-toolchain
        if: env.RB_TARGET == 'kernel'
        run: scripts/freebsd/builder.sh ssh "$VM_ENV RB_TOOLCHAIN=amd64-gcc15 sh /root/harness/scripts/freebsd/build.sh toolchain"
      - name: make -k buildkernel with rucc
        if: env.RB_TARGET == 'kernel'
        continue-on-error: true
        run: |
          scripts/freebsd/builder.sh ssh "$VM_ENV RB_TOOLCHAIN=/build/toolchain/rucc.mk RB_MAKEFLAGS=-k \
            RB_PHASE=kernel-rucc RB_COMPILE_LOG=/build/out/compile-rucc.jsonl sh /root/harness/scripts/freebsd/build.sh kernel"
      - name: make build${{ env.RB_TARGET }} with ref, the control
        run: |
          scripts/freebsd/builder.sh ssh "$VM_ENV RB_TOOLCHAIN=/build/toolchain/ref.mk \
            RB_PHASE=$RB_TARGET-ref RB_COMPILE_LOG=/build/out/compile-ref.jsonl sh /root/harness/scripts/freebsd/build.sh $RB_TARGET"
      - name: rb syntax over the ref build
        timeout-minutes: 90
        continue-on-error: true
        run: |
          # shellcheck disable=SC2016
          scripts/freebsd/builder.sh ssh 'cd /root/harness && out=/root/out &&
            /build/rb/bin/rb syntax freebsd-15.1 --log /build/out/compile-ref.jsonl --rucc /build/rb/bin/rucc \
              --jobs "$(sysctl -n hw.ncpu)" --limit 100 --out "$out/syntax.tsv" > "$out/syntax.txt" 2>&1
            echo "rb syntax exited $?" >> "$out/syntax.txt"; head -1 "$out/syntax.txt"'
      - name: compile every unit of the ref build with rucc
        # A unit stops after 300 s. The step stops after its limit, and the steps after it still run.
        timeout-minutes: ${{ (inputs.target || 'kernel') == 'world' && 200 || 120 }}
        continue-on-error: true
        run: |
          mkdir -p compile replay
          scripts/freebsd/builder.sh get /build/out/compile-ref.jsonl compile/compile-ref.jsonl
          python3 -I scripts/freebsd/replay.py compile/compile-ref.jsonl --out replay --objects /build/replay \
            --shim /build/toolchain/bin/x86_64-unknown-freebsd15.1-rb-cc-rucc \
            --timeouts /root/out/replay-timeouts.txt | tee record/replay.txt
          tar -cf - replay | scripts/freebsd/builder.sh ssh 'tar -xf - -C /root'
          start=$(date +%s)
          # shellcheck disable=SC2016
          scripts/freebsd/builder.sh ssh 'export RB_COMPILE_LOG=/build/out/compile-replay.jsonl;
            for f in /root/replay/replay-*.sh; do sh "$f" & done; wait'
          echo "replay: $(($(date +%s) - start))s" | tee -a record/replay.txt
      - name: the result of the replay
        id: replay
        if: always()
        run: |
          # Clean means: every unit of the replay has a record, and none failed or was stopped.
          scripts/freebsd/builder.sh get /build/out/compile-replay.jsonl compile/compile-replay.jsonl || true
          scripts/freebsd/builder.sh get /root/out/replay-timeouts.txt record/replay-timeouts.txt || true
          units=$(awk 'NR == 1 { print $1 }' record/replay.txt 2>/dev/null || true)
          python3 -I - "${units:-0}" compile/compile-replay.jsonl record/replay-timeouts.txt <<'EOF' | tee -a record/replay.txt
          import json, os, sys
          units, log, stopped = int(sys.argv[1]), sys.argv[2], sys.argv[3]
          ran = failed = 0
          if os.path.exists(log):
              for line in open(log, encoding="utf-8", errors="replace"):
                  try:
                      r = json.loads(line)
                  except ValueError:
                      continue
                  if r.get("slot") not in (None, "cc") or r.get("probe"):
                      continue
                  ran += 1
                  failed += r.get("exit") != 0 or bool(r.get("signal"))
          n = sum(1 for _ in open(stopped)) if os.path.exists(stopped) else 0
          clean = units > 0 and ran == units and failed == 0 and n == 0
          print(f"replay result: {units} units, {ran} ran, {failed} failed, {n} stopped, clean={str(clean).lower()}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"clean={str(clean).lower()}\n")
          EOF
          rm -f compile/compile-replay.jsonl
      - name: compare the builds with rb
        if: always() && env.RB_TARGET == 'kernel'
        continue-on-error: true
        run: |
          # The ref objects are under /build/obj and the replay objects are at the same paths under
          # /build/replay, so the roots pair them. The probes of rb mk-diff go to their own log.
          # sections-diff-all.txt and symbols-diff-all.txt have every line of each list.
          # shellcheck disable=SC2016
          scripts/freebsd/builder.sh ssh "cd /root/harness && export KERNCONF=$KERNCONF && "'
            rb=/build/rb/bin/rb; ref=/build/out/compile-ref.jsonl; out=/root/out
            run() { "$rb" "$@" > "$out/$1.txt" 2>&1 || echo "rb $1 exited $?" >> "$out/$1.txt"; }
            RB_COMPILE_LOG=/build/out/compile-mk-diff.jsonl; export RB_COMPILE_LOG
            run mk-diff freebsd-15.1 --dir /build/toolchain --src /build/src --work "$out/mk-diff" \
              --kernel "/build/obj/build/src/amd64.amd64/sys/$KERNCONF"
            run flags-diff freebsd-15.1 --g "$ref" --r /build/out/compile-rucc.jsonl --paired-only
            pair="--g $ref --r /build/out/compile-replay.jsonl --g-root /build/obj --r-root /build/replay/build/obj"
            for tool in warnings sections-diff symbols-diff; do
              run "$tool" $pair
            done
            for tool in sections-diff symbols-diff; do
              "$rb" "$tool" $pair --limit 100000 > "$out/$tool-all.txt" 2>&1 || true
            done'
        env:
          KERNCONF: ${{ inputs.kernconf || 'GENERIC' }}
      - name: the kernel to boot
        id: boot
        if: always() && env.RB_TARGET == 'kernel'
        run: |
          case "$MODE" in
          ref) side=ref ;;
          none) side=none ;;
          *) if [ "$CLEAN" = true ]; then side=rucc; else side=none; fi ;;
          esac
          echo "side=$side" >> "$GITHUB_OUTPUT"
          echo "RB_SIDE=$side" >> "$GITHUB_ENV"
          echo "boot: $MODE, replay clean: ${CLEAN:-false}, kernel to boot: $side" | tee -a record/replay.txt
        env:
          MODE: ${{ inputs.boot || 'auto' }}
          CLEAN: ${{ steps.replay.outputs.clean }}
      - name: make buildkernel with rucc, for the image
        if: env.RB_SIDE == 'rucc'
        run: |
          scripts/freebsd/builder.sh ssh "$VM_ENV RB_TOOLCHAIN=/build/toolchain/rucc.mk \
            RB_PHASE=kernel-r RB_COMPILE_LOG=/build/out/compile-r.jsonl sh /root/harness/scripts/freebsd/build.sh kernel"
      - name: the image of the last good freebsd-g run
        if: env.RB_SIDE == 'rucc' || env.RB_SIDE == 'ref'
        run: |
          # freebsd-g also runs for other pins, and a run of another pin has no image of this one.
          # So take the newest good run on main that has an image of this pin.
          name="freebsd-image-$RB_PIN-graded"
          id=
          for run in $(gh run list -R "$GITHUB_REPOSITORY" -w freebsd-g.yml -b main -s success -L 30 --json databaseId -q '.[].databaseId'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=$name" \
              -q '.artifacts[] | select(.expired | not) | .name' | grep -qx "$name"; then
              id=$run
              break
            fi
          done
          if [ -z "$id" ]; then
            echo "No good freebsd-g run on main has the artifact $name." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "The image has the world of freebsd-g run $id and the kernel of $RB_SIDE." | tee record/g-image.txt >> "$GITHUB_STEP_SUMMARY"
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$name" -D g-image
          scripts/freebsd/builder.sh ssh 'mkdir -p /build/image'
          scripts/freebsd/builder.sh put g-image/freebsd.img.zst /build/image/g.img.zst
          rm -rf g-image
        env:
          GH_TOKEN: ${{ github.token }}
      - name: put the kernel into the image
        if: env.RB_SIDE == 'rucc' || env.RB_SIDE == 'ref'
        run: |
          scripts/freebsd/builder.sh ssh "$VM_ENV RB_TOOLCHAIN=/build/toolchain/$RB_SIDE.mk RB_IMAGE=/build/image/r.img \
            sh /root/harness/scripts/freebsd/r-image.sh /build/image/g.img.zst"
          mkdir -p image
          scripts/freebsd/builder.sh get /build/image/r.img.zst image/freebsd.img.zst
          ls -l image
          # The kernel of the image with its symbol table, so that an address of a panic gives a
          # function also without DDB. The debug information is in kernel.debug and is not taken.
          mkdir -p record
          scripts/freebsd/builder.sh ssh "xz -T0 -c /build/obj/build/src/amd64.amd64/sys/$KERNCONF/kernel" \
            > record/kernel.xz || rm -f record/kernel.xz
          ls -l record/kernel.xz || true
        env:
          KERNCONF: ${{ inputs.kernconf || 'GENERIC' }}
      - name: copy the record out
        if: always()
        run: |
          mkdir -p record compile
          scripts/freebsd/builder.sh ssh 'xz -T0 -f /build/out/*.jsonl; tar -cf - -C /root/out .' | tar -xf - -C record || true
          scripts/freebsd/builder.sh ssh 'tar -cf - -C /build/out .' | tar -xf - -C compile || true
          rm -f compile/compile-ref.jsonl
          scripts/freebsd/builder.sh down || true
          xz -T0 record/*.log 2>/dev/null || true
          ls -l record compile
      - name: summary
        if: always()
        run: |
          {
            echo "### The FreeBSD $RB_TARGET with rucc"
            echo
            if [ -f record/phases.tsv ]; then
              echo '```'
              echo "phase status seconds obj_kb disk_used_kb"
              cat record/phases.tsv
              echo '```'
              echo
            fi
            echo '```'
            sed -n '/^# rucc/,/^$/p' record/rb-tools.txt 2>/dev/null || true
            cat record/replay.txt 2>/dev/null || true
            if [ -f record/replay-timeouts.txt ]; then
              echo "units stopped by the timeout: $(wc -l < record/replay-timeouts.txt)"
              head -40 record/replay-timeouts.txt
            fi
            cat record/r-image.txt 2>/dev/null || true
            echo '```'
            for run in replay rucc r; do
              f=compile/compile-$run.jsonl.xz
              [ -f "$f" ] || continue
              echo
              echo "#### The failed units of the $run build"
              echo
              python3 -I scripts/freebsd/r-report.py "$f" --tsv "record/failed-units-$run.tsv"
            done
            for tool in syntax mk-diff flags-diff warnings sections-diff symbols-diff; do
              [ -f "record/$tool.txt" ] || continue
              echo
              echo "#### rb $tool"
              echo
              echo '```'
              head -60 "record/$tool.txt"
              echo '```'
            done
            for f in record/*-error.txt; do
              [ -f "$f" ] || continue
              echo
              echo "First error in $(basename "$f" -error.txt):"
              echo
              echo '```'
              tail -20 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: freebsd-r-${{ env.RB_TARGET }}
          path: |
            record
            compile
          retention-days: 14
      - name: upload the image
        if: env.RB_SIDE == 'rucc' || env.RB_SIDE == 'ref'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: freebsd-r-image
          path: image/freebsd.img.zst
          compression-level: 0
          retention-days: 7

  boot:
    name: boot the kernel of ${{ needs.build.outputs.side }}
    needs: build
    if: always() && (needs.build.outputs.side == 'rucc' || needs.build.outputs.side == 'ref')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf zstd
      - name: download the image and the build record
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: freebsd-r-*
          path: artifacts
      - name: unpack the image
        run: |
          sudo mkdir -p /mnt/rb && sudo chown "$USER" /mnt/rb
          zstd -d -q artifacts/freebsd-r-image/freebsd.img.zst -o /mnt/rb/freebsd.img
          ls -ls /mnt/rb/freebsd.img
      - name: boot by BIOS, boot suite
        run: scripts/freebsd/boot.sh /mnt/rb/freebsd.img bios boot boots/bios
        env:
          RB_RUN_LIMIT: 900
      - name: boot by UEFI, boot, smoke and kyua
        if: always()
        run: scripts/freebsd/boot.sh /mnt/rb/freebsd.img uefi "boot smoke kyua" boots/uefi
        env:
          RB_RUN_LIMIT: 14400
      - name: summary
        if: always()
        run: |
          b=artifacts/freebsd-r-kernel/record
          cp "$b/r-image.txt" "$b/image.txt" 2>/dev/null || true
          python3 -I scripts/freebsd/published.py FreeBSD-stable-15-amd64-test published.json || true
          python3 -I scripts/freebsd/summarize.py --build "$b" --boot bios=boots/bios --boot uefi=boots/uefi \
            --published published.json --conf graded --side "R, the kernel of $SIDE and the world of G" --out summary
          cat summary/summary.md >> "$GITHUB_STEP_SUMMARY"
          for b in bios uefi; do
            { echo; echo "Console of the $b boot, last 30 lines:"; echo; echo '```'; tail -30 "boots/$b/console.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          done
        env:
          SIDE: ${{ needs.build.outputs.side }}
      - name: upload the results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: freebsd-r-results
          path: |
            boots
            summary
            published.json
          retention-days: 14
