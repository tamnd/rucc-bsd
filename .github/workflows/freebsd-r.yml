# R for the FreeBSD 15.1 amd64 kernel (milestone B5): the GENERIC kernel and its modules of the
# pinned tree, built by make buildkernel with rucc in the C compiler slot through rb-cc. The world,
# the image and the tests come later. The pin, the builder VM and the paths are those of
# freebsd-g.yml.
#
# The builder VM builds rb and rb-cc with rustup's Rust, and rb toolchain writes the shims, ref.mk
# and rucc.mk in /build/toolchain (scripts/freebsd/rb-tools.sh). make kernel-toolchain builds the
# host tools with the package's CROSS_TOOLCHAIN file, because they are not compiled by the C
# compiler slot. Then make -k buildkernel runs with one of the two files. The job runs twice:
#   ref    the control. XCC is the rb-cc-ref shim, which runs amd64-gcc15 with the arguments
#          unchanged. This build must succeed, or the shims are broken and the rucc result means
#          nothing.
#   rucc   XCC is the rb-cc-rucc shim, which runs rucc with the persona of the pin. XCXX and XCPP
#          stay the reference. This build may fail until B5 is done. With -k, make goes on with the
#          units that do not depend on a failure, so compile.jsonl has every unit that fails.
#
# scripts/freebsd/r-report.py groups the failed units of compile.jsonl by the first error line and
# puts the groups in the step summary. rucc is built in the VM from the head of tamnd/rucc main, or
# from the branch or commit a manual run names. It is not the pinned release, so the run is
# ungraded, and the step summary names the commit.

name: freebsd-r

on:
  pull_request:
    paths:
      - .github/workflows/freebsd-r.yml
      - scripts/freebsd/rb-tools.sh
      - scripts/freebsd/build.sh
      - scripts/freebsd/r-report.py
  workflow_dispatch:
    inputs:
      rucc:
        description: A branch or commit of tamnd/rucc
        required: false
        default: main
      kernconf:
        description: The kernel configuration
        required: false
        default: GENERIC

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RB_PIN: 15.1-release
  RB_CACHE: /mnt/rb-cache
  RB_VM_DIR: /mnt/rb-builder
  VM_ENV: >-
    RB_SRC=/build/src RB_OBJ=/build/obj RB_OUT=/root/out RB_JOBS=4
    RB_SRCCONF=/root/harness/conf/freebsd/graded.conf RB_HARNESS=/root/harness
    RB_KERNCONF=${{ inputs.kernconf || 'GENERIC' }} RB_PIN_NAME=freebsd-15.1
    RB_COMPILE_JSONL=/build/out/compile.jsonl

jobs:
  kernel:
    name: ${{ inputs.kernconf || 'GENERIC' }} kernel with ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    continue-on-error: ${{ matrix.cc == 'rucc' }}
    strategy:
      fail-fast: false
      matrix:
        cc: [ref, rucc]
    env:
      CC_NAME: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$RB_CACHE" "$RB_VM_DIR"
          sudo chown "$USER" "$RB_CACHE" "$RB_VM_DIR"
          df -h / /mnt
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils sshpass zstd
      - name: cache the builder image
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/FreeBSD-*.raw.xz
          key: freebsd-builder-${{ hashFiles('conf/freebsd/builder.conf') }}
      - name: cache the source
        uses: actions/cache@v6.1.0
        with:
          path: /mnt/rb-cache/freebsd-src-*
          key: freebsd-src-${{ env.RB_PIN }}-${{ hashFiles('conf/freebsd/pins.conf') }}
      - name: the commit of tamnd/rucc
        if: matrix.cc == 'rucc'
        run: |
          sha=$(gh api "repos/tamnd/rucc/commits/$REF" -q .sha)
          echo "RUCC_COMMIT=$sha" >> "$GITHUB_ENV"
          echo "rucc built in the VM from tamnd/rucc $REF, commit $sha. The run is ungraded." >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.rucc || 'main' }}
      - name: boot the builder VM
        run: |
          scripts/freebsd/builder.sh up
          tar --exclude=./.git --exclude=./target -cf - . \
            | scripts/freebsd/builder.sh ssh 'mkdir -p /root/harness && tar -xf - -C /root/harness'
      - name: provision
        run: scripts/freebsd/builder.sh ssh 'sh /root/harness/scripts/freebsd/provision.sh /root/out'
      - name: fetch the source of ${{ env.RB_PIN }}
        run: |
          mkdir -p record
          read -r archive strip < <(RB_OUT=record scripts/freebsd/fetch.sh "$RB_PIN")
          scripts/freebsd/builder.sh ssh "mkdir -p /build/src && tar -xf - -C /build/src --strip-components $strip" < "$archive"
          scripts/freebsd/builder.sh put record/source.txt /root/out/source.txt
      - name: rb, rb-cc and the shims of ${{ matrix.cc }}
        run: scripts/freebsd/builder.sh ssh "$VM_ENV sh /root/harness/scripts/freebsd/rb-tools.sh /root/out $CC_NAME ${RUCC_COMMIT:-}"
      - name: make kernel-toolchain
        run: scripts/freebsd/builder.sh ssh "$VM_ENV RB_TOOLCHAIN=amd64-gcc15 sh /root/harness/scripts/freebsd/build.sh toolchain"
      - name: make -k buildkernel
        id: kernel
        run: |
          scripts/freebsd/builder.sh ssh "$VM_ENV RB_TOOLCHAIN=/build/toolchain/$CC_NAME.mk RB_MAKEFLAGS=-k \
            RB_PHASE=kernel-$CC_NAME sh /root/harness/scripts/freebsd/build.sh kernel"
      - name: rb census
        if: always()
        continue-on-error: true
        run: |
          scripts/freebsd/builder.sh ssh "cd /root/harness && /build/rb/bin/rb census /build/out/compile.jsonl \
            --objdir /build/obj/build/src/amd64.amd64/sys > /root/out/census.txt 2>&1; \
            ls -l /build/obj/build/src/amd64.amd64/sys/*/kernel > /root/out/kernel-ls.txt 2>&1; \
            xz -T0 -k -f /build/out/compile.jsonl"
      - name: copy the record out
        if: always()
        run: |
          mkdir -p record compile
          scripts/freebsd/builder.sh ssh 'tar -cf - -C /root/out .' | tar -xf - -C record || true
          scripts/freebsd/builder.sh get /build/out/compile.jsonl.xz compile/compile.jsonl.xz || true
          scripts/freebsd/builder.sh down || true
          xz -T0 record/*.log 2>/dev/null || true
          ls -l record compile
      - name: summary
        if: always()
        run: |
          {
            echo "### ${KERNCONF} kernel with $CC_NAME"
            echo
            if [ -f record/phases.tsv ]; then
              echo '```'
              echo "phase status seconds obj_kb disk_used_kb"
              cat record/phases.tsv
              echo '```'
            fi
            if grep -q '/kernel$' record/kernel-ls.txt 2>/dev/null; then
              echo "The kernel linked:"
            else
              echo "No kernel linked."
            fi
            echo
            echo '```'
            cat record/kernel-ls.txt 2>/dev/null || true
            sed -n '/^# rucc/,/^$/p' record/rb-tools.txt 2>/dev/null || true
            echo '```'
            echo
            if [ -f compile/compile.jsonl.xz ]; then
              python3 -I scripts/freebsd/r-report.py compile/compile.jsonl.xz --tsv record/failed-units.tsv
            else
              echo "No compile.jsonl."
            fi
            if [ -f record/census.txt ]; then
              echo
              echo '```'
              head -40 record/census.txt
              echo '```'
            fi
            for f in record/*-error.txt; do
              [ -f "$f" ] || continue
              echo
              echo "First error in $(basename "$f" -error.txt):"
              echo
              echo '```'
              tail -40 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          KERNCONF: ${{ inputs.kernconf || 'GENERIC' }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: freebsd-r-kernel-${{ matrix.cc }}
          path: |
            record
            compile
          retention-days: 14
