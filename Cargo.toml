[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/tamnd/rucc-bsd"

# The shared harness crates come from tamnd/rucc-harness by tag (plan 15.6). A new tag there is a
# change here, reviewed like any other.
[workspace.dependencies]
harness-agent = { git = "https://github.com/tamnd/rucc-harness", tag = "v0.1.0" }
harness-elf = { git = "https://github.com/tamnd/rucc-harness", tag = "v0.1.0" }
harness-shim = { git = "https://github.com/tamnd/rucc-harness", tag = "v0.1.0" }
harness-stats = { git = "https://github.com/tamnd/rucc-harness", tag = "v0.1.0" }
# zlib, for the CTF sections that ctfmerge compresses.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# The version harness-elf reads with, so that both read objects the same way.
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = true
