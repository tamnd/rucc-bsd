# FreeBSD source pins (plan 04.5). One pin per line: name, kind, source and the hash that checks it.
# A txz pin is a release's src.txz, checked by the SHA-256 in the release's MANIFEST.
# A git pin is a commit of the GitHub mirror of git.freebsd.org/src.git, checked by its full hash.
# A fifth field, when present, holds src.conf lines of this pin only, separated by commas. fetch.sh
# writes them to pin.conf, and freebsd-g and freebsd-r add them to the SRCCONF of G and R alike.
# 15.1-release: GITBRANCH releng/15.1, REVISION 96841ea08dcf, BUILDDATE 20260612.
15.1-release	txz	https://download.freebsd.org/releases/amd64/15.1-RELEASE/src.txz	cf5762da53fd52e1eaf0f9ceee9bf58cbe314c821031d0d9ffa76823185a89e1
# main: the pin of 7 November 2026. ci.freebsd.org ran FreeBSD-main-amd64-test build 29902 on this commit.
# Since 60d78908f5 of 2 September 2026, cddl/usr.sbin/dtrace/tests/common/uctf builds tst.aouttype.c with
# -g and WITH_CTF=YES. GCC writes DWARF 5 by default, and ctfconvert stops on it with "Unsupported version".
# The clang of FreeBSD writes DWARF 4 by default, and kern.mk adds -gdwarf-4 only to the kernel. The line
# of this pin adds -gdwarf-4 where DEBUG_FLAGS has -g. bmake expands it when it compiles, after the
# Makefile sets DEBUG_FLAGS. It applies to G and R alike (#237).
# GNU as writes a DW_TAG_subprogram only for a function symbol with a .size. The entry points of
# amd64 exception.S and of vmbus_vector.S (hv_vmbus.ko) have none, so the compile unit has no children,
# and ctfconvert stops with "file does not contain dwarf type data". Since e959f2a7d8 of 9 October 2026
# this stops buildkernel. The second and third lines compile these two files with -g0 on amd64. With no
# debug data, ctfconvert gives a warning and continues, as for subr_ticks.o (40371e5141). The kernel
# Makefile reads ASM_CFLAGS.<file>, and a module reads ACFLAGS. GENERIC on amd64 has vmbus_vector.S in
# the kernel too, so the fourth line sets ASM_CFLAGS for it. It applies to G and R alike (#239, #241).
main	git	https://github.com/freebsd/freebsd-src	665afd2a9d6469ce692de4018c7c015a194c201d	CFLAGS+=${DEBUG_FLAGS:M-g:S/^-g$/-gdwarf-4/},ASM_CFLAGS.exception.S=${MACHINE_CPUARCH:Mamd64:C/.+/-g0/},ACFLAGS+=${.IMPSRC:T:Mvmbus_vector.S:C/.+/-g0/},ASM_CFLAGS.vmbus_vector.S=${MACHINE_CPUARCH:Mamd64:C/.+/-g0/}
# stable-15: the head of 8 November 2026 in pins.toml, to find whether G builds and boots it (plan
# 04.6, open question 1).
stable-15	git	https://github.com/freebsd/freebsd-src	77fa63fa43fc8df1cfb86476b9caff24d10de6bc
# stable-14: 2192d42bbcde of 5 October 2026, the GCC 14 candidate of #85. Build it with gcc: 14, the
# fallback of personas.toml, because GCC 15 does not build 14.x. WITHOUT_SSP=yes because the kernel
# that GCC 14 builds with SSP panics at boot in __stack_chk_fail from mi_startup: mi_startup ends with
# a tail call to swapper(), which is not declared noreturn, so GCC checks the canary before the jump,
# and the stack_chk SYSINIT (SI_SUB_RANDOM) has set __stack_chk_guard since mi_startup saved it.
# 15.x ends mi_startup with a tsleep loop and never checks.
# The stable-14 kernel is built with -g and DWARF 5, as GCC 14 writes by default, and so it has no CTF:
# ctfconvert of stable/14 stops on DWARF 5 with "Unsupported version", and kern.mk of stable/14 does not
# add -gdwarf-4 as 15.x does. A known limit: with -gdwarf-4 (#201, freebsd-g 43295755180) the kernel
# has CTF, but 1057 DTrace cases of G fail at kernel`hz in /usr/lib/dtrace/tcp.d. For `extern int hz;
# int hz;` GCC writes a declaration DIE with the name and type and a definition DIE with only
# DW_AT_specification and DW_AT_location, and ctfconvert skips both, so a global that a header declares
# has no CTF type. With no kernel CTF, dtrace does not check these types, and the DTrace cases of G pass.
stable-14	git	https://github.com/freebsd/freebsd-src	2192d42bbcde78de89177994889481ae6d334f6e	WITHOUT_SSP=yes
