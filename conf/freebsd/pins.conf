# stable-15: the head of 8 November 2026 in pins.toml, to find whether G builds and boots it (plan
# 04.6, open question 1).
stable-15	git	https://github.com/freebsd/freebsd-src	77fa63fa43fc8df1cfb86476b9caff24d10de6bc
# stable-14: 2192d42bbcde of 5 October 2026, the GCC 14 candidate of #85. Build it with gcc: 14, the
# fallback of personas.toml, because GCC 15 does not build 14.x. WITHOUT_SSP=yes because the kernel
# that GCC 14 builds with SSP panics at boot in __stack_chk_fail from mi_startup: mi_startup ends with
# a tail call to swapper(), which is not declared noreturn, so GCC checks the canary before the jump,
# and the stack_chk SYSINIT (SI_SUB_RANDOM) has set __stack_chk_guard since mi_startup saved it.
# 15.x ends mi_startup with a tsleep loop and never checks.
# The CFLAGS.gcc line gives the kernel and its modules -gdwarf-4, which kern.mk of 15.x adds and
# kern.mk of stable/14 does not. GCC 14 writes DWARF 5 by default, and ctfconvert of stable/14 stops on
# it with "Unsupported version". Without it 5597 of 5605 ctfconvert runs of G failed and the kernel had
# no CTF, so in R every D program stopped at "/usr/lib/dtrace/psinfo.d", line 37: syntax error near
# "uid_t". sys.mk reads the SRCCONF before the kernel Makefile sets DEBUG=-g, so the line tests DEBUG
# when the flags are expanded: the kernel has DEBUG, and a module has KMOD and DEBUG_FLAGS. kern.mk adds
# CFLAGS.gcc to both, and rucc builds as gcc too. A world build has neither DEBUG nor KMOD, so it does
# not change. CONF_CFLAGS cannot hold the flag: freebsd-r sets it on the make command line.
stable-14	git	https://github.com/freebsd/freebsd-src	2192d42bbcde78de89177994889481ae6d334f6e	WITHOUT_SSP=yes,CFLAGS.gcc+= ${DEBUG:D-gdwarf-4} ${KMOD:D${DEBUG_FLAGS:D-gdwarf-4}}
