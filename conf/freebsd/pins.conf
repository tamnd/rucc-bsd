# FreeBSD source pins (plan 04.5). One pin per line: name, kind, source and the hash that checks it.
# A txz pin is a release's src.txz, checked by the SHA-256 in the release's MANIFEST.
# A git pin is a commit of the GitHub mirror of git.freebsd.org/src.git, checked by its full hash.
# A fifth field, when present, holds src.conf lines of this pin only, separated by commas. fetch.sh
# writes them to pin.conf, and freebsd-g and freebsd-r add them to the SRCCONF of G and R alike.
# 15.1-release: GITBRANCH releng/15.1, REVISION 96841ea08dcf, BUILDDATE 20260612.
15.1-release	txz	https://download.freebsd.org/releases/amd64/15.1-RELEASE/src.txz	cf5762da53fd52e1eaf0f9ceee9bf58cbe314c821031d0d9ffa76823185a89e1
# main: the pin of 7 November 2026. ci.freebsd.org ran FreeBSD-main-amd64-test build 29902 on this commit.
