# Appended to /etc/sysctl.conf of the test image. All lines copy freebsd-ci's testvm image.
kern.crypto.allow_soft=1	# sys/opencrypto
kern.ipc.tls.enable=1		# sys/kern/ktls_test
net.add_addr_allfibs=0		# sys/netinet/fibs_test
vfs.aio.enable_unsafe=1		# sys/aio
vfs.usermount=1			# sys/fs tests that mount as a user
