# Appended to /boot/loader.conf of the test image. R and G images get the same lines.
# Each comment is on its own line, because the loader is part of the system under test.
# Boot without waiting, without the menu, with the loader and the kernel on the serial console that rb boot reads.
autoboot_delay="1"
beastie_disable="YES"
boot_multicons="YES"
boot_serial="YES"
console="comconsole,vidconsole"
# The rest copies freebsd-ci's testvm image, so that a G run can be held against ci.freebsd.org.
# sys/netinet/fibs_test
net.fibs="3"
# ipfw tests must not cut the VM off
net.inet.ip.fw.default_to_accept="1"
# sbin/ipf
net.inet.ipf.jail_allowed="1"
# sys/mac/bsdextended, sys/mac/ipacl, sys/mac/portacl
security.mac.bsdextended.enabled="0"
security.mac.ipacl.ipv4="0"
security.mac.ipacl.ipv6="0"
security.mac.portacl.enabled="0"
# keeps the ZFS ARC from taking the 8 GB of the test VM
vfs.zfs.arc_max="4294967296"
