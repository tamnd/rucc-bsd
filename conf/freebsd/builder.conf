# The FreeBSD builder VM (plan 14.6): the official FreeBSD 15.1-RELEASE BASIC-CI image.
# The image has a serial console, growfs, and sshd that accepts root with an empty password.
# The SHA-256 is the one in the image's CHECKSUM.SHA256 on download.freebsd.org.
RB_BUILDER_NAME=FreeBSD-15.1-RELEASE-amd64-BASIC-CI-ufs.raw.xz
RB_BUILDER_URL=https://download.freebsd.org/releases/CI-IMAGES/15.1-RELEASE/amd64/Latest/FreeBSD-15.1-RELEASE-amd64-BASIC-CI-ufs.raw.xz
RB_BUILDER_SHA256=908e735f18ba192eaf48c2703b549225c9b96e74e3784bd9278c7120b4139962
# The reference toolchain packages. The versions that pkg installed are recorded in each run's toolchain.txt.
RB_TOOLCHAIN_PKGS="amd64-gcc15 amd64-binutils"
RB_CROSS_TOOLCHAIN=amd64-gcc15
