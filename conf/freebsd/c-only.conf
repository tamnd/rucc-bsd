# SRCCONF for the c-only FreeBSD configuration (plan 02.1 and 10.5). R and G use this same file.
# It is the graded configuration plus the two knobs that remove C++ and little C.
.include "graded.conf"
WITHOUT_GOOGLETEST=yes		# GoogleTest and its tests are C++ only.
WITHOUT_PMC=yes			# pmc(8) is C++. The knob also removes libpmc and its few C users.
