# SRCCONF for the graded FreeBSD configuration (plan 02.1). R and G use this same file.
# Each WITHOUT_ knob removes LLVM, which is C++ only and built by g++ in both R and G (plan 10.3). No knob removes C.
# The WITH_ knob adds C: the DTrace test suite (plan 12.2), which is off by default. It is set on amd64 only.
WITHOUT_CLANG=yes		# clang is C++. g++ builds it in R and G alike, so it grades nothing. It is most of the compile time of a world.
WITHOUT_CLANG_BOOTSTRAP=yes	# the bootstrap clang is C++ and is not used, because CROSS_TOOLCHAIN names the compiler.
WITHOUT_LLD=yes			# ld.lld is C++. R and G link with BFD ld from the binutils package.
WITHOUT_LLD_BOOTSTRAP=yes	# the bootstrap ld.lld is C++ and is not used, because CROSS_TOOLCHAIN names the linker.
WITHOUT_LLDB=yes		# lldb is C++. It is on by default on amd64 and is built by g++ in R and G alike.
# The suite links its USDT probes with dtrace -G of the build host, which is amd64 and accepts only amd64 objects.
# On aarch64 and riscv64 that stops buildworld in cddl/usr.sbin/dtrace/tests/common/json (tamnd/rucc-bsd#8).
.if ${MACHINE_ARCH} == "amd64"
WITH_DTRACE_TESTS=yes		# installs cddl/usr.sbin/dtrace/tests for kyua, as freebsd-ci's DTrace job builds it. Off by default.
.endif
