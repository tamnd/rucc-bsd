# The DragonFly builder VM (plan 14.6): the official DragonFly 6.4.2 release image for USB sticks.
# It is the live system that the installer runs from, with root and no password. Its base compiler
# is GCC 8.3 (gcc80) and its linker is GNU ld 2.34.
# DragonFly publishes only MD5 sums, in iso-images/md5.txt. The MD5 is the line of that file for
# the bz2 file. The SHA-256 is of the same file, read on 12 November 2026 after the MD5 matched.
RB_BUILDER_NAME=dfly-x86_64-6.4.2_REL.img.bz2
# The first mirror is the master site. The others are tried in turn when a download fails.
RB_BUILDER_URLS="https://mirror-master.dragonflybsd.org/iso-images https://mirrors.nycbug.org/pub/DragonflyBSD/iso-images https://mirror.sjtu.edu.cn/dragonflybsd/iso-images"
RB_BUILDER_MD5=d321c363be7653525049c501ecf16e37
RB_BUILDER_SHA256=f1c1fb4c2aff3537b4fd03dc47cc2173966cbabf7c37ec4af0f9ab7f3b9a91eb
