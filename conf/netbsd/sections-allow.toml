# The statics that rb sections-diff --allow allows on the NetBSD kernel and module objects.
#
# GCC and rucc can put a static that the program never writes, or never uses, in different
# sections, or keep it in one build only. Such a difference does not change what the kernel does.
# Each entry names one static: source is the unit under the source root, symbol is the name
# without the .N of a static local, and why says what the source does with it. Each reason was
# checked against the source at NetBSD/src 3c50f59789893ab1f71051686347e79c7b2e8327.
#
# A data section that differs is allowed only when an allowed static of the unit is in it, and
# its other object symbols are the same in G and R. The report lists it under "statics of the
# allow list" with the names. A new difference gets an entry only when the source shows that
# the static is never written or never used.

[[static]]
source = "sys/crypto/aes/aes_selftest.c"
symbol = "ctr0"
why = "Never written. GCC makes the 16-byte memcpy from it into stores of immediates and drops it, and rucc keeps it in .data."

